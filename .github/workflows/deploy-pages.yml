name: Deploy Bina Court Web

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'chunks/**'
      - 'latest-version.json'
      - 'latest-apk-source.txt'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct live web app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/downloads
          OUT="_site/index.html"
          : > "$OUT"
          for f in chunks/part*.html; do
            cat "$f" >> "$OUT"
          done
          for f in chunks/part*.b64; do
            base64 -d "$f" >> "$OUT"
          done
          test -s "$OUT"
          grep -q "Bina Court Designer" "$OUT"

          cp latest-version.json _site/latest-version.json

          # Bootstrap a newly built native APK from a short-lived artifact URL.
          # On later web-only deploys, preserve the already-live APK from Pages.
          if [ -s latest-apk-source.txt ]; then
            APK_SOURCE="$(tr -d '\r\n' < latest-apk-source.txt)"
            if [ -n "$APK_SOURCE" ]; then
              if curl -fL --retry 2 --connect-timeout 10 "$APK_SOURCE" -o /tmp/binacourt-apk.zip; then
                unzip -p /tmp/binacourt-apk.zip '*.apk' > _site/downloads/BinaCourt-latest.apk || true
              fi
            fi
          fi

          if [ ! -s _site/downloads/BinaCourt-latest.apk ]; then
            curl -fL --retry 2 --connect-timeout 10               "https://binamarketingteam.github.io/BinaCourt-Web/downloads/BinaCourt-latest.apk"               -o _site/downloads/BinaCourt-latest.apk || true
          fi

          test -s _site/downloads/BinaCourt-latest.apk
          touch _site/.nojekyll
          echo "index.html bytes: $(wc -c < "$OUT")"
          echo "APK bytes: $(wc -c < _site/downloads/BinaCourt-latest.apk)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
