<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Court Request Inbox · Bina Paint</title>
<style>
:root{--navy:#0f172a;--bg:#f3f6fb;--card:#fff;--text:#172033;--muted:#64748b;--line:#dbe3ef;--blue:#2563eb;--green:#067647;--yellow:#b54708}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}
header{background:var(--navy);color:#fff;padding:18px 16px}.head{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:20px;margin:0}.small{font-size:12px;color:#94a3b8}.wrap{max-width:900px;margin:auto;padding:14px 12px 50px}
.panel,.card{background:#fff;border:1px solid #e3e9f2;border-radius:17px;box-shadow:0 7px 20px #0f172a0c}.panel{padding:15px;margin-bottom:12px}.login{max-width:440px;margin:30px auto}.row{display:flex;gap:8px}input,select,button{font:inherit}.input,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}.btn{border:0;border-radius:12px;padding:11px 13px;font-weight:800;cursor:pointer;background:#eef2f7;color:#334155}.btn-dark{background:var(--navy);color:#fff}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar .input{flex:1;min-width:160px}.cards{display:grid;gap:11px}.card{padding:14px}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.code{font-size:12px;font-weight:900;color:#475569}.title{font-size:17px;font-weight:900;margin:4px 0 2px}.meta{font-size:12.5px;color:#64748b;line-height:1.5}.pill{font-size:11px;font-weight:900;border-radius:999px;padding:6px 9px;white-space:nowrap}.new{background:#eff6ff;color:#1d4ed8}.in_progress{background:#fff7ed;color:#b45309}.done{background:#ecfdf3;color:#047857}.cancelled{background:#f1f5f9;color:#64748b}.detail{margin-top:11px;padding-top:11px;border-top:1px solid #edf2f7;display:grid;gap:7px;font-size:13px}.label{color:#64748b;font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.05em}.value{white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:7px;margin-top:11px;align-items:center}.actions select{flex:1}.empty{text-align:center;padding:45px 10px;color:#64748b}.error{color:#b42318;font-size:12px;margin-top:8px}.hidden{display:none!important}
@media(min-width:740px){.cards{grid-template-columns:1fr 1fr}.card{padding:16px}}
</style>
</head>
<body>
<header><div class="head"><div><h1>Court Request Inbox</h1><div class="small">Bina Paint · Designer Admin</div></div><a href="./" style="color:#cbd5e1;text-decoration:none;font-size:12px">+ New Request</a></div></header>
<main class="wrap">
<section class="panel login" id="loginPanel">
  <div style="font-weight:900;font-size:18px;margin-bottom:5px">Admin Login</div>
  <div class="small" style="color:#64748b;margin-bottom:12px">Guna password Admin Court Designer yang sama.</div>
  <form id="loginForm"><div class="row"><input class="input" id="password" type="password" placeholder="Admin password" required><button class="btn btn-dark">Login</button></div><div class="error" id="loginError"></div></form>
</section>
<section id="app" class="hidden">
  <div class="panel toolbar">
    <input class="input" id="search" placeholder="Cari tajuk / lokasi / sale…">
    <select id="filter"><option value="">Semua status</option><option value="new">New</option><option value="in_progress">In Progress</option><option value="done">Done</option><option value="cancelled">Cancelled</option></select>
    <button class="btn" id="refresh">Refresh</button>
  </div>
  <div class="cards" id="cards"></div>
</section>
</main>
<script>
const SUPABASE_URL="https://thvpxsqrkusxbmeaojiv.supabase.co";
const SUPABASE_KEY="sb_publishable_damFcLVhqwglcU8tJWlfBA_ZYb15BrM";
const $=id=>document.getElementById(id);
let adminPassword="",rows=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function sizeText(r){if(r.size_mode==="dimension")return [r.length_m,r.width_m].map(x=>Number(x)).join(" m × ")+" m"+(r.area_m2?" ("+Number(r.area_m2)+" m²)":"");if(r.size_mode==="area")return Number(r.area_m2)+" m²";return "Belum diketahui"}
function statusLabel(s){return {new:"New",in_progress:"In Progress",done:"Done",cancelled:"Cancelled"}[s]||s}
async function load(){
  $("cards").innerHTML='<div class="empty">Loading…</div>';
  const r=await fetch(SUPABASE_URL+"/rest/v1/court_drawing_requests?select=*&order=created_at.desc&limit=200",{headers:{apikey:SUPABASE_KEY,"x-admin-password":adminPassword}});
  if(!r.ok) throw new Error("Password tidak betul atau akses ditolak.");
  rows=await r.json(); render();
}
function render(){
  const q=$("search").value.trim().toLowerCase(),f=$("filter").value;
  const list=rows.filter(r=>(!f||r.status===f)&&(!q||[r.request_code,r.sales_name,r.project_title,r.project_location,r.court_type,r.customer_name].join(" ").toLowerCase().includes(q)));
  if(!list.length){$("cards").innerHTML='<div class="empty">Tiada request dijumpai.</div>';return}
  $("cards").innerHTML=list.map(r=>`
    <article class="card">
      <div class="top"><div><div class="code">${esc(r.request_code)}</div><div class="title">${esc(r.project_title)}</div><div class="meta">${esc(r.sales_name)} · ${esc(r.court_type)}<br>${esc(r.project_location)}</div></div><span class="pill ${esc(r.status)}">${statusLabel(r.status)}</span></div>
      <div class="detail">
        ${r.customer_name?'<div><div class="label">Customer / Company</div><div class="value">'+esc(r.customer_name)+'</div></div>':''}
        <div><div class="label">Saiz / Keluasan</div><div class="value">${esc(sizeText(r))}</div></div>
        ${r.court_notes?'<div><div class="label">Catatan Court</div><div class="value">'+esc(r.court_notes)+'</div></div>':''}
        <div><div class="label">Warna</div><div class="value">${esc(r.color_request)}</div></div>
        ${r.due_date?'<div><div class="label">Perlu siap</div><div class="value">'+esc(r.due_date)+'</div></div>':''}
        ${r.notes?'<div><div class="label">Catatan</div><div class="value">'+esc(r.notes)+'</div></div>':''}
        <div><div class="label">Dihantar</div><div class="value">${new Date(r.created_at).toLocaleString("ms-MY")}</div></div>
      </div>
      <div class="actions"><select data-id="${r.id}" class="statusSel"><option value="new" ${r.status==="new"?"selected":""}>New</option><option value="in_progress" ${r.status==="in_progress"?"selected":""}>In Progress</option><option value="done" ${r.status==="done"?"selected":""}>Done</option><option value="cancelled" ${r.status==="cancelled"?"selected":""}>Cancelled</option></select></div>
    </article>`).join("");
  document.querySelectorAll(".statusSel").forEach(el=>el.addEventListener("change",()=>updateStatus(el.dataset.id,el.value,el)));
}
async function updateStatus(id,status,el){
  el.disabled=true;
  try{
    const r=await fetch(SUPABASE_URL+"/rest/v1/court_drawing_requests?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{apikey:SUPABASE_KEY,"x-admin-password":adminPassword,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({status})});
    if(!r.ok) throw new Error();
    const row=rows.find(x=>String(x.id)===String(id));if(row)row.status=status;render();
  }catch(_){alert("Gagal update status.");el.disabled=false}
}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginError").textContent="";adminPassword=$("password").value;try{await load();$("loginPanel").classList.add("hidden");$("app").classList.remove("hidden")}catch(ex){$("loginError").textContent=ex.message}});
$("search").addEventListener("input",render);$("filter").addEventListener("change",render);$("refresh").addEventListener("click",()=>load().catch(e=>alert(e.message)));
</script>
</body>
</html>
