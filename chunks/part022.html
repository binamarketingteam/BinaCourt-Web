<script>
(function(){
  // -------------------------------------------------------------------------
  // Plan / Perspective View v2
  // Perspective is a clean presentation render, not a rotated technical plan.
  // -------------------------------------------------------------------------

  let perspectiveViewMode=false;
  let perspectivePreviewToken=0;
  const PERSPECTIVE_STORAGE_KEY="binacourt-view-mode-v2";

  function isPerspectiveView(){
    return !!perspectiveViewMode;
  }

  function ensurePerspectiveViewUi(){
    const wrap=$("stageWrap");
    if(!wrap) return;

    if(!document.getElementById("courtViewModeSwitch")){
      const switcher=document.createElement("div");
      switcher.id="courtViewModeSwitch";
      switcher.className="court-view-mode-switch";
      switcher.setAttribute("aria-label","Court view");
      switcher.innerHTML=`
        <button id="planViewButton" type="button" class="active" aria-pressed="true">Plan View</button>
        <button id="perspectiveViewButton" type="button" aria-pressed="false">Perspective View</button>
      `;
      wrap.appendChild(switcher);

      const preview=document.createElement("canvas");
      preview.id="perspectivePreviewCanvas";
      preview.className="perspective-preview-canvas";
      preview.hidden=true;
      wrap.appendChild(preview);

      const note=document.createElement("div");
      note.id="perspectiveViewNote";
      note.className="perspective-view-note";
      note.hidden=true;
      note.textContent="Perspective View · presentation only";
      wrap.appendChild(note);

      $("planViewButton")?.addEventListener("click",()=>setPerspectiveView(false));
      $("perspectiveViewButton")?.addEventListener("click",()=>setPerspectiveView(true));
    }
  }

  function cleanPerspectiveClone(){
    const clone=svg.cloneNode(true);

    clone.querySelectorAll(
      ".editing-only,.svg-action,.smart-guide,.court-dimension-overlay,"+
      ".futsal-standard-detail-dimensions,.futsal-standard-substitution-zones,"+
      ".measure-annotation,.measurement-annotation,.court-center-net,.court-center-net-shadow"
    ).forEach(node=>node.remove());

    // Perspective is a visual presentation. Remove technical labels/numbers.
    clone.querySelectorAll("text").forEach(node=>node.remove());

    // Walkway/site dimensions are mostly ungrouped legacy lines. Remove the
    // dark CAD strokes while retaining white/yellow court markings.
    clone.querySelectorAll("line,path,polyline,polygon,circle").forEach(el=>{
      const stroke=String(el.getAttribute("stroke")||"").trim().toLowerCase();
      if([
        "#111827","#26303c","#344054","#475467","#000000","black"
      ].includes(stroke)){
        el.remove();
      }
    });

    clone.style.background="transparent";
    clone.setAttribute("style",(clone.getAttribute("style")||"")+";background:transparent");
    return clone;
  }

  function alphaBounds(canvas){
    try{
      const ctx=canvas.getContext("2d",{willReadFrequently:true});
      const {width,height}=canvas;
      const data=ctx.getImageData(0,0,width,height).data;
      let minX=width,minY=height,maxX=-1,maxY=-1;
      for(let y=0;y<height;y++){
        const row=y*width*4;
        for(let x=0;x<width;x++){
          if(data[row+x*4+3]>8){
            if(x<minX) minX=x;
            if(x>maxX) maxX=x;
            if(y<minY) minY=y;
            if(y>maxY) maxY=y;
          }
        }
      }
      if(maxX<minX || maxY<minY) return {x:0,y:0,w:width,h:height};
      const pad=Math.max(4,Math.round(Math.min(width,height)*.012));
      minX=Math.max(0,minX-pad);
      minY=Math.max(0,minY-pad);
      maxX=Math.min(width-1,maxX+pad);
      maxY=Math.min(height-1,maxY+pad);
      return {x:minX,y:minY,w:maxX-minX+1,h:maxY-minY+1};
    }catch(_){
      return {x:0,y:0,w:canvas.width,h:canvas.height};
    }
  }

  function perspectiveGeometry(crop,outW,outH){
    // Isometric/oblique basis, closer to the supplied reference:
    // horizontal plan axis goes up-right; vertical plan axis goes down-right.
    const a=.94,b=-.40,c=.58,d=.48;
    const corners=[
      [-crop.w/2,-crop.h/2],[crop.w/2,-crop.h/2],
      [crop.w/2,crop.h/2],[-crop.w/2,crop.h/2]
    ].map(([x,y])=>({x:a*x+c*y,y:b*x+d*y}));
    const minX=Math.min(...corners.map(p=>p.x));
    const maxX=Math.max(...corners.map(p=>p.x));
    const minY=Math.min(...corners.map(p=>p.y));
    const maxY=Math.max(...corners.map(p=>p.y));
    const rawW=Math.max(1,maxX-minX);
    const rawH=Math.max(1,maxY-minY);
    const fit=Math.min((outW*.92)/rawW,(outH*.82)/rawH);
    return {
      a,b,c,d,fit,
      cx:outW/2,
      cy:outH/2+outH*.025,
      cropCx:crop.x+crop.w/2,
      cropCy:crop.y+crop.h/2
    };
  }

  function projectPerspectivePoint(x,y,g){
    const lx=x-g.cropCx;
    const ly=y-g.cropCy;
    return {
      x:g.cx+(g.a*lx+g.c*ly)*g.fit,
      y:g.cy+(g.b*lx+g.d*ly)*g.fit
    };
  }

  function courtLocalToWorld(court,lx,ly){
    const angle=(Number(court.angle)||0)*Math.PI/180;
    const cx=court.w/2,cy=court.h/2;
    const dx=lx-cx,dy=ly-cy;
    return {
      x:court.x+cx+dx*Math.cos(angle)-dy*Math.sin(angle),
      y:court.y+cy+dx*Math.sin(angle)+dy*Math.cos(angle)
    };
  }

  function drawPerspectiveNets(ctx,g,box,pixelWidth,pixelHeight){
    const courts=activeCourts().filter(court=>
      !court.hidden && typeof courtUsesCenterNet==="function" &&
      courtUsesCenterNet(court.type) && court.showNet!==false
    );

    courts.forEach(court=>{
      const extension=Math.max(.28,Math.min(.42,court.h*.055));
      const p1w=courtLocalToWorld(court,court.w/2,-extension);
      const p2w=courtLocalToWorld(court,court.w/2,court.h+extension);
      const toSource=p=>({
        x:((p.x-box.x)/box.w)*pixelWidth,
        y:((p.y-box.y)/box.h)*pixelHeight
      });
      const p1s=toSource(p1w),p2s=toSource(p2w);
      const ground1=projectPerspectivePoint(p1s.x,p1s.y,g);
      const ground2=projectPerspectivePoint(p2s.x,p2s.y,g);
      const length=Math.hypot(ground2.x-ground1.x,ground2.y-ground1.y);
      const height=Math.max(15,Math.min(58,length*.10));
      const top1={x:ground1.x,y:ground1.y-height};
      const top2={x:ground2.x,y:ground2.y-height};

      // Ground shadow.
      ctx.save();
      ctx.strokeStyle="rgba(15,23,42,.20)";
      ctx.lineWidth=Math.max(2,length*.006);
      ctx.beginPath();
      ctx.moveTo(ground1.x+10,ground1.y+13);
      ctx.lineTo(ground2.x+10,ground2.y+13);
      ctx.stroke();

      // Net mesh.
      ctx.strokeStyle="rgba(255,255,255,.70)";
      ctx.lineWidth=Math.max(1,length*.0022);
      const verticals=12;
      for(let i=0;i<=verticals;i++){
        const t=i/verticals;
        const gx=ground1.x+(ground2.x-ground1.x)*t;
        const gy=ground1.y+(ground2.y-ground1.y)*t;
        const tx=top1.x+(top2.x-top1.x)*t;
        const ty=top1.y+(top2.y-top1.y)*t;
        ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(tx,ty);ctx.stroke();
      }
      for(const frac of [.25,.5,.75]){
        const ax=ground1.x+(top1.x-ground1.x)*frac;
        const ay=ground1.y+(top1.y-ground1.y)*frac;
        const bx=ground2.x+(top2.x-ground2.x)*frac;
        const by=ground2.y+(top2.y-ground2.y)*frac;
        ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();
      }

      // White tape + posts.
      ctx.strokeStyle="#ffffff";
      ctx.lineCap="round";
      ctx.lineWidth=Math.max(2,length*.005);
      ctx.beginPath();ctx.moveTo(top1.x,top1.y);ctx.lineTo(top2.x,top2.y);ctx.stroke();
      ctx.lineWidth=Math.max(2.2,length*.0058);
      ctx.beginPath();
      ctx.moveTo(ground1.x,ground1.y+2);ctx.lineTo(top1.x,top1.y-3);
      ctx.moveTo(ground2.x,ground2.y+2);ctx.lineTo(top2.x,top2.y-3);
      ctx.stroke();
      ctx.restore();
    });
  }

  function perspectiveCanvas(source,meta,{transparent=false}={}){
    const out=document.createElement("canvas");
    out.width=source.width;
    out.height=source.height;
    const ctx=out.getContext("2d");
    if(!transparent){
      ctx.fillStyle="#ffffff";
      ctx.fillRect(0,0,out.width,out.height);
    }

    const crop=alphaBounds(source);
    const g=perspectiveGeometry(crop,out.width,out.height);

    ctx.save();
    ctx.translate(g.cx,g.cy);
    ctx.scale(g.fit,g.fit);
    ctx.transform(g.a,g.b,g.c,g.d,0,0);
    ctx.translate(-crop.w/2,-crop.h/2);
    ctx.shadowColor="rgba(15,23,42,.22)";
    ctx.shadowBlur=Math.max(10,Math.round(out.width*.006/g.fit));
    ctx.shadowOffsetX=Math.round(out.width*.004/g.fit);
    ctx.shadowOffsetY=Math.round(out.width*.009/g.fit);
    ctx.drawImage(source,crop.x,crop.y,crop.w,crop.h,0,0,crop.w,crop.h);
    ctx.restore();

    drawPerspectiveNets(ctx,g,meta.box,meta.pixelWidth,meta.pixelHeight);
    return out;
  }

  function renderPerspectiveSource(pixelWidth=1800,{transparent=false}={}){
    return new Promise((resolve,reject)=>{
      try{
        const clone=cleanPerspectiveClone();
        const box=exportArtworkViewBox();
        const ratio=box.h/box.w;
        const pixelHeight=Math.max(1,Math.round(pixelWidth*ratio));
        clone.setAttribute("viewBox",`${box.x} ${box.y} ${box.w} ${box.h}`);
        clone.setAttribute("width",pixelWidth);
        clone.setAttribute("height",pixelHeight);

        const data=new XMLSerializer().serializeToString(clone);
        const blob=new Blob([data],{type:"image/svg+xml;charset=utf-8"});
        const url=URL.createObjectURL(blob);
        const img=new Image();
        img.onload=()=>{
          try{
            const source=document.createElement("canvas");
            source.width=pixelWidth;
            source.height=pixelHeight;
            const sourceCtx=source.getContext("2d");
            sourceCtx.clearRect(0,0,pixelWidth,pixelHeight);
            sourceCtx.drawImage(img,0,0,pixelWidth,pixelHeight);
            URL.revokeObjectURL(url);
            resolve(perspectiveCanvas(
              source,
              {box,pixelWidth,pixelHeight},
              {transparent}
            ));
          }catch(error){
            URL.revokeObjectURL(url);
            reject(error);
          }
        };
        img.onerror=()=>{
          URL.revokeObjectURL(url);
          reject(new Error("Gagal menyediakan Perspective View."));
        };
        img.src=url;
      }catch(error){
        reject(error);
      }
    });
  }

  async function refreshPerspectivePreview(){
    if(!perspectiveViewMode) return;
    const wrap=$("stageWrap");
    const preview=$("perspectivePreviewCanvas");
    if(!wrap || !preview) return;
    const token=++perspectivePreviewToken;
    try{
      const rendered=await renderPerspectiveSource(1800,{transparent:true});
      if(token!==perspectivePreviewToken || !perspectiveViewMode) return;

      const dpr=Math.min(2,window.devicePixelRatio||1);
      const w=Math.max(1,Math.round(wrap.clientWidth*dpr));
      const h=Math.max(1,Math.round(wrap.clientHeight*dpr));
      preview.width=w;preview.height=h;
      preview.style.width=wrap.clientWidth+"px";
      preview.style.height=wrap.clientHeight+"px";
      const ctx=preview.getContext("2d");
      ctx.clearRect(0,0,w,h);
      const scale=Math.min((w*.96)/rendered.width,(h*.94)/rendered.height);
      const dw=rendered.width*scale,dh=rendered.height*scale;
      ctx.drawImage(rendered,(w-dw)/2,(h-dh)/2,dw,dh);
    }catch(error){
      console.warn("Perspective preview:",error);
    }
  }

  function updatePerspectiveUi(){
    ensurePerspectiveViewUi();
    const wrap=$("stageWrap");
    const preview=$("perspectivePreviewCanvas");
    if(!wrap || !preview) return;

    wrap.classList.toggle("perspective-view",perspectiveViewMode);
    svg.style.visibility=perspectiveViewMode?"hidden":"";
    svg.style.pointerEvents=perspectiveViewMode?"none":"";
    preview.hidden=!perspectiveViewMode;

    const plan=$("planViewButton");
    const perspective=$("perspectiveViewButton");
    plan?.classList.toggle("active",!perspectiveViewMode);
    perspective?.classList.toggle("active",perspectiveViewMode);
    plan?.setAttribute("aria-pressed",perspectiveViewMode?"false":"true");
    perspective?.setAttribute("aria-pressed",perspectiveViewMode?"true":"false");
    if($("perspectiveViewNote")) $("perspectiveViewNote").hidden=!perspectiveViewMode;
    if($("toolsMenuButton")) $("toolsMenuButton").disabled=perspectiveViewMode;

    if(perspectiveViewMode) requestAnimationFrame(refreshPerspectivePreview);
  }

  function setPerspectiveView(enabled){
    perspectiveViewMode=!!enabled;
    if(perspectiveViewMode){
      try{closeTextInlineEditor(false);}catch(_){}
      try{closeMeasureInlineEditor(false);}catch(_){}
      try{removeWalkwayInlineEditor();}catch(_){}
      try{removeCustomSiteEdgeInlineEditor();}catch(_){}
      try{lineToolState.active=false;measureToolState.active=false;textToolState.active=false;}catch(_){}
    }
    try{localStorage.setItem(PERSPECTIVE_STORAGE_KEY,perspectiveViewMode?"perspective":"plan");}catch(_){}
    updatePerspectiveUi();
    updateStageCursor?.();
  }

  const baseRender=render;
  render=function(options={}){
    baseRender(options);
    updatePerspectiveUi();
  };

  if(typeof svgToCanvas==="function"){
    const baseSvgToCanvas=svgToCanvas;
    svgToCanvas=async function(...args){
      if(isPerspectiveView()){
        return await renderPerspectiveSource(Math.max(1200,Number(args[0])||2800),{transparent:false});
      }
      return await baseSvgToCanvas(...args);
    };
  }

  if(typeof svgToCanvasVectorBase==="function"){
    const baseSvgToCanvasVectorBase=svgToCanvasVectorBase;
    svgToCanvasVectorBase=async function(...args){
      if(isPerspectiveView()){
        return await renderPerspectiveSource(Math.max(1200,Number(args[0])||2800),{transparent:false});
      }
      return await baseSvgToCanvasVectorBase(...args);
    };
  }

  if(typeof buildOptionPageVectorCommands==="function"){
    const baseBuildOptionPageVectorCommands=buildOptionPageVectorCommands;
    buildOptionPageVectorCommands=async function(...args){
      if(isPerspectiveView()) return "";
      return await baseBuildOptionPageVectorCommands(...args);
    };
  }

  const style=document.createElement("style");
  style.textContent=`
    .court-view-mode-switch{
      position:absolute;top:14px;right:14px;z-index:205;
      display:flex;gap:3px;padding:4px;background:rgba(255,255,255,.96);
      border:1px solid #d0d5dd;border-radius:10px;
      box-shadow:0 7px 22px rgba(16,24,40,.14)
    }
    .court-view-mode-switch button{
      width:auto!important;min-width:86px;height:34px;padding:5px 10px!important;
      border:0!important;border-radius:7px!important;background:transparent!important;
      color:#475467!important;font-size:11px!important;font-weight:800!important;
      white-space:nowrap;box-shadow:none!important
    }
    .court-view-mode-switch button.active{background:#111827!important;color:#fff!important}
    .perspective-preview-canvas{
      position:absolute;inset:0;z-index:120;width:100%;height:100%;
      pointer-events:none
    }
    .perspective-view-note{
      position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
      z-index:206;padding:6px 10px;border-radius:999px;
      background:rgba(17,24,39,.80);color:#fff;font-size:11px;font-weight:700;
      pointer-events:none;white-space:nowrap
    }
    #stageWrap.perspective-view{
      background:radial-gradient(circle at 50% 42%,#f8fafc 0,#eef2f6 48%,#dfe6ed 100%);
      cursor:default!important
    }
    #stageWrap.perspective-view .stage-ruler,
    #stageWrap.perspective-view .stage-ruler-corner,
    #stageWrap.perspective-view .measure-inline-editor-wrap,
    #stageWrap.perspective-view .walkway-inline-editor,
    #stageWrap.perspective-view .custom-site-edge-inline-editor{display:none!important}
    @media(max-width:700px){
      .court-view-mode-switch{top:8px;right:8px}
      .court-view-mode-switch button{min-width:72px;font-size:10px!important;padding:4px 7px!important}
      .perspective-view-note{bottom:8px;font-size:10px}
    }
  `;
  document.head.appendChild(style);

  ensurePerspectiveViewUi();
  try{
    perspectiveViewMode=localStorage.getItem(PERSPECTIVE_STORAGE_KEY)==="perspective";
  }catch(_){
    perspectiveViewMode=false;
  }
  updatePerspectiveUi();
  window.addEventListener("resize",()=>{if(perspectiveViewMode) refreshPerspectivePreview();});
})();
</script>
