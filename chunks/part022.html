<script>
(function(){
  "use strict";
  // View / Display (#4): global visibility for centre nets, keeping each court's own preference.
  if(typeof drawCourtCenterNet!=="function" || typeof render!=="function") return;

  const preferenceKey="binacourt-center-net-view-v1";
  let showAllCenterNets=true;
  try{
    showAllCenterNets=localStorage.getItem(preferenceKey)!=="0";
  }catch(_){ /* Storage may be blocked. */ }

  const originalDrawCourtCenterNet=drawCourtCenterNet;
  drawCourtCenterNet=function(g,c){
    if(!showAllCenterNets) return;
    return originalDrawCourtCenterNet(g,c);
  };

  function setupNetViewToggle(){
    if(document.getElementById("centerNetViewToggle")) return;
    const grid=document.querySelector("#panelView .sidebar-view-grid");
    if(!grid) return;

    const row=document.createElement("label");
    row.className="inline";
    row.style.cssText="cursor:pointer;";

    const checkbox=document.createElement("input");
    checkbox.id="centerNetViewToggle";
    checkbox.type="checkbox";
    checkbox.checked=showAllCenterNets;
    checkbox.setAttribute("aria-label","View net tengah bagi semua court");
    checkbox.title="Paparkan atau sembunyikan net tengah semua court. Tetapan setiap court masih dikekalkan.";

    const label=document.createElement("span");
    label.textContent="View Net Tengah (semua court)";

    checkbox.addEventListener("change",function(){
      showAllCenterNets=checkbox.checked;
      try{
        localStorage.setItem(preferenceKey,showAllCenterNets?"1":"0");
      }catch(_){ }
      render();
    });

    row.appendChild(checkbox);
    row.appendChild(label);

    const after=grid.querySelector("#showCourtSizes")?.closest(".inline");
    if(after) after.insertAdjacentElement("afterend",row);
    else grid.appendChild(row);
  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",setupNetViewToggle,{once:true});
  }else{
    setupNetViewToggle();
  }
})();
</script>
