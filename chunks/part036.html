<style>
.bcTplHead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}
.bcTplHead h2{margin:0;font-size:23px}.bcTplHead p{margin:5px 0 0;font-size:11px;color:#667085}.bcTplActions{display:flex;gap:7px;flex-wrap:wrap}

.bcTplModal[hidden]{display:none!important}.bcTplModal{position:fixed;inset:0;z-index:90100;background:#0b1729a8;display:grid;place-items:center;padding:20px}.bcTplModalCard{width:min(540px,96vw);background:#fff;border-radius:16px;box-shadow:0 25px 70px #0005;overflow:hidden}
.bcTplModalHead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:17px 18px;border-bottom:1px solid #e4e7ec}.bcTplModalHead h3{margin:0;font-size:16px}.bcTplModalHead p{margin:4px 0 0;font-size:10px;color:#667085}
.bcTplModalBody{padding:18px}.bcTplForm{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bcTplForm label{display:block;font-size:9px;color:#475467}.bcTplForm input,.bcTplForm select,.bcTplForm textarea{width:100%;box-sizing:border-box;margin-top:5px;border:1px solid #d0d5dd;border-radius:9px;padding:9px;font:11px Inter,Arial}
.bcTplForm textarea{min-height:82px;resize:vertical}.bcTplForm .full{grid-column:1/-1}.bcTplCheck{display:flex!important;align-items:center;gap:7px;margin-top:8px}.bcTplCheck input{width:auto!important;margin:0!important}
.bcTplModalFoot{display:flex;justify-content:flex-end;gap:7px;padding:0 18px 18px}.bcTplSize{font-size:9px;color:#667085;margin-top:8px}
#bcSaveTemplateDesigner{width:auto!important;padding:7px 10px!important;border-radius:8px!important;font-size:10px!important;background:#fff8db!important;color:#805b00!important;border:1px solid #f2d264!important}
@media(max-width:1050px){.bcTplGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.bcTplGrid{grid-template-columns:1fr}.bcTplFilters{grid-template-columns:1fr 1fr}.bcTplFilters input:first-child{grid-column:1/-1}.bcTplHead{flex-direction:column}.bcTplForm{grid-template-columns:1fr}.bcTplForm .full{grid-column:auto}}
</style>
<script>
(function setupBinaCourtTemplateLibrary(){
"use strict";
const SB_URL="https://thvpxsqrkusxbmeaojiv.supabase.co",SB_KEY="sb_publishable_damFcLVhqwglcU8tJWlfBA_ZYb15BrM",MAX_SNAPSHOT_BYTES=4000000;
let templates=[],editingTemplate=null,pendingSnapshot=null,pendingPreview="";
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),isAdmin=()=>String(document.body.dataset.userRole||"")==="admin";
const clone=v=>typeof cloneData==="function"?cloneData(v):JSON.parse(JSON.stringify(v));
async function sb(path,opt={}){const headers=Object.assign({apikey:SB_KEY,"Content-Type":"application/json"},opt.headers||{}),r=await fetch(SB_URL+"/rest/v1/"+path,Object.assign({},opt,{headers})),txt=await r.text();let body=null;try{body=txt?JSON.parse(txt):null}catch(_){body=txt}if(!r.ok)throw new Error((body&&(body.message||body.details||body.error))||("HTTP "+r.status));return body}
async function adminHeaders(){if(!window.BinaCourtAdminTools?.headers)throw new Error("Admin tools belum tersedia.");return await window.BinaCourtAdminTools.headers()}
function snapshotBytes(v){return new TextEncoder().encode(JSON.stringify(v)).length}
function courtTypesFromSnapshot(snap){const out=new Set(),groups=Array.isArray(snap?.optionGroups)?snap.optionGroups:[];groups.forEach(g=>(g.optionPages||[]).forEach(p=>(p?.courts||[]).forEach(c=>{if(c?.type)out.add(c.type)})));if(!out.size)(snap?.courts||[]).forEach(c=>{if(c?.type)out.add(c.type)});return [...out]}
function suggestedCategory(types){if(types.length>1)return"Multipurpose";const t=String(types[0]||"").toLowerCase(),m={pickleball:"Pickleball",badminton:"Badminton",basketball:"Basketball",basketball_custom:"Basketball",half_basketball:"Basketball",futsal:"Futsal",futsal_custom:"Futsal",sepak_takraw:"Sepak Takraw",sepak_takraw_custom:"Sepak Takraw",tennis:"Tennis",volleyball:"Volleyball",netball:"Netball",handball:"Handball"};return m[t]||"Custom"}
function cleanSnapshot(){if(typeof saveCurrentGroupToStore==="function")saveCurrentGroupToStore();const raw=typeof projectSnapshot==="function"?JSON.parse(projectSnapshot()):clone(state);raw.projectTitle="";raw.projectSalesName="";raw.projectReferenceNo="";raw.selectedId=null;delete raw.lastSavedAt;delete raw._binaCloud;return raw}
async function makePreview(){try{if(typeof svgToCanvas!=="function")return"";const c=await svgToCanvas(520);return c?c.toDataURL("image/jpeg",0.62):""}catch(e){console.warn("Template preview",e);return""}}
async function loadTemplates(){const rows=await sb("binacourt_templates?select=*&order=pinned.desc,updated_at.desc&limit=500");templates=Array.isArray(rows)?rows:[];populateFilters();renderTemplates();return templates}
function categories(){return[...new Set(templates.map(t=>t.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b))}
function populateFilters(){const s=$("bcTplCategory");if(!s)return;const k=s.value;s.innerHTML='<option value="">Semua Kategori</option>'+categories().map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join("");s.value=k}
function filtered(){const q=String($("bcTplSearch")?.value||"").toLowerCase(),cat=$("bcTplCategory")?.value||"",brand=$("bcTplBrand")?.value||"",arch=!!$("bcTplArchived")?.checked;return templates.filter(t=>{if(!arch&&!t.active)return false;if(cat&&t.category!==cat)return false;if(brand&&t.brand!==brand)return false;if(q&&!((t.name+" "+t.category+" "+t.description+" "+(t.court_types||[]).join(" ")).toLowerCase().includes(q)))return false;return true}).sort((a,b)=>Number(b.pinned)-Number(a.pinned)||String(b.updated_at||"").localeCompare(String(a.updated_at||"")))}
function renderTemplates(){const grid=$("bcTplGrid");if(!grid)return;const rows=filtered(),admin=isAdmin(),summary=$("bcTplSummary");if(summary)summary.textContent=rows.length+" template dipaparkan · "+templates.filter(x=>x.active).length+" aktif · "+templates.filter(x=>x.pinned&&x.active).length+" pinned";if(!rows.length){grid.innerHTML='<div class="bcTplEmpty"><b>Belum ada template.</b>Siapkan design dalam Designer kemudian tekan <strong>Save as Template</strong>.</div>';return}
grid.innerHTML=rows.map(t=>{const preview=t.preview?'<img alt="" src="'+esc(t.preview)+'">':'<div class="bcTplPreviewFallback"></div>',types=Array.isArray(t.court_types)?t.court_types:[];return '<article class="bcTplCard '+(t.pinned?'pinned ':'')+(!t.active?'bcTplArchived':'')+'" data-template-id="'+t.id+'"><div class="bcTplPreview">'+preview+(admin?'<button class="bcTplPin" data-pin="'+t.id+'" title="'+(t.pinned?'Unpin':'Pin')+'">'+(t.pinned?'★':'☆')+'</button>':'')+'</div><div class="bcTplBody"><div class="bcTplMeta"><span class="bcTplChip">'+esc(t.category)+'</span><span class="bcTplChip">'+esc(String(t.brand||"").toUpperCase())+'</span>'+(!t.active?'<span class="bcTplChip">ARCHIVED</span>':'')+'</div><div class="bcTplName">'+esc(t.name)+'</div><div class="bcTplDesc">'+esc(t.description||"Tiada description.")+'</div><div class="bcTplCourtTypes">'+esc(types.length?types.map(x=>String(x).replaceAll("_"," ")).join(" · "):"Custom layout")+'</div><div class="bcTplBtns">'+(t.active?'<button class="bcBtn primary" data-use="'+t.id+'">Use Template</button>':'')+(admin?'<button class="bcBtn" data-edit="'+t.id+'">Edit</button><button class="bcBtn" data-dup="'+t.id+'">Duplicate</button><button class="bcBtn '+(t.active?'bcV2Warn':'')+'" data-archive="'+t.id+'">'+(t.active?'Archive':'Restore')+'</button><button class="bcBtn bcV2Danger" data-delete="'+t.id+'">Delete</button>':'')+'</div></div></article>'}).join("");
grid.querySelectorAll("[data-use]").forEach(b=>b.onclick=()=>useTemplate(b.dataset.use).catch(showError));grid.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));grid.querySelectorAll("[data-dup]").forEach(b=>b.onclick=()=>duplicateTemplate(b.dataset.dup).catch(showError));grid.querySelectorAll("[data-pin]").forEach(b=>b.onclick=e=>{e.stopPropagation();togglePin(b.dataset.pin).catch(showError)});grid.querySelectorAll("[data-archive]").forEach(b=>b.onclick=()=>toggleArchive(b.dataset.archive).catch(showError));grid.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>deleteTemplate(b.dataset.delete).catch(showError))}
function replaceTemplatePage(){const view=document.querySelector('#bcDash .bcView[data-view="templates"]');if(!view||$("bcTplGrid"))return;view.innerHTML='<div class="bcTplHead"><div><h2>Template Library</h2><p>Cipta template daripada artwork sendiri. Template tidak menyimpan Nama Sale, Reference No. atau Project Title.</p></div><div class="bcTplActions"><button class="bcBtn primary" id="bcTplCreate">＋ Save Current Design</button><button class="bcBtn" id="bcTplRefresh">Refresh</button></div></div><div class="bcTplFilters"><input id="bcTplSearch" placeholder="Cari nama, court atau description"><select id="bcTplCategory"><option value="">Semua Kategori</option></select><select id="bcTplBrand"><option value="">Semua Brand</option><option value="duracourt">Duracourt</option><option value="primacourt">Primacourt</option><option value="terracourt">Terracourt</option></select><label style="font-size:10px;display:flex;align-items:center;gap:6px"><input id="bcTplArchived" type="checkbox" style="width:auto"> Archived</label><div id="bcTplSummary" class="bcTplSummary"></div></div><div id="bcTplGrid" class="bcTplGrid"></div>';$("bcTplCreate").onclick=()=>openCreate().catch(showError);$("bcTplRefresh").onclick=()=>loadTemplates().catch(showError);["bcTplSearch","bcTplCategory","bcTplBrand","bcTplArchived"].forEach(id=>{const e=$(id);e.addEventListener(id==="bcTplSearch"?"input":"change",renderTemplates)})}
function injectModal(){if($("bcTplModal"))return;const d=document.createElement("div");d.id="bcTplModal";d.className="bcTplModal";d.hidden=true;d.innerHTML='<div class="bcTplModalCard"><div class="bcTplModalHead"><div><h3 id="bcTplModalTitle">Save as Template</h3><p id="bcTplModalSub">Design semasa akan disimpan sebagai reusable template.</p></div><button class="bcBtn" id="bcTplModalClose">×</button></div><div class="bcTplModalBody"><div class="bcTplForm"><label class="full">Template Name<input id="bcTplName" maxlength="120" placeholder="Contoh: 2 Pickleball Side by Side"></label><label>Category<input id="bcTplCatInput" maxlength="60" list="bcTplCatList"><datalist id="bcTplCatList"><option>Pickleball</option><option>Badminton</option><option>Basketball</option><option>Futsal</option><option>Sepak Takraw</option><option>Multipurpose</option><option>Custom</option></datalist></label><label>Brand<select id="bcTplBrandInput"><option value="duracourt">Duracourt</option><option value="primacourt">Primacourt</option><option value="terracourt">Terracourt</option></select></label><label class="full">Description<textarea id="bcTplDescription" maxlength="500"></textarea></label><label class="bcTplCheck full"><input id="bcTplPinned" type="checkbox"> Pin template ini di bahagian atas library</label></div><div class="bcTplSize" id="bcTplSize"></div></div><div class="bcTplModalFoot"><button class="bcBtn" id="bcTplCancel">Cancel</button><button class="bcBtn primary" id="bcTplSave">Save Template</button></div></div>';document.body.appendChild(d);$("bcTplModalClose").onclick=closeModal;$("bcTplCancel").onclick=closeModal;$("bcTplSave").onclick=()=>saveModal().catch(showError);d.onclick=e=>{if(e.target===d)closeModal()}}
function injectDesignerButton(){const w=document.querySelector("header .header-admin-wrap");if(!w||$("bcSaveTemplateDesigner"))return;const b=document.createElement("button");b.id="bcSaveTemplateDesigner";b.type="button";b.textContent="Save as Template";b.onclick=()=>openCreate().catch(showError);w.insertBefore(b,w.firstChild);applyRole()}
function applyRole(){const a=isAdmin();if($("bcTplCreate"))$("bcTplCreate").hidden=!a;if($("bcSaveTemplateDesigner"))$("bcSaveTemplateDesigner").hidden=!a;renderTemplates()}
async function openCreate(){if(!isAdmin())throw new Error("Hanya Admin boleh create template.");pendingSnapshot=cleanSnapshot();const bytes=snapshotBytes(pendingSnapshot);if(bytes>MAX_SNAPSHOT_BYTES)throw new Error("Design ini terlalu besar untuk template ("+(bytes/1048576).toFixed(1)+" MB). Kurangkan embedded image/annotation besar dahulu.");pendingPreview=await makePreview();editingTemplate=null;injectModal();const types=courtTypesFromSnapshot(pendingSnapshot);$("bcTplModalTitle").textContent="Save Current Design as Template";$("bcTplModalSub").textContent="Artwork disimpan tanpa maklumat project customer.";$("bcTplName").value="";$("bcTplCatInput").value=suggestedCategory(types);$("bcTplBrandInput").value=String(pendingSnapshot.brand||"duracourt");$("bcTplDescription").value="";$("bcTplPinned").checked=false;$("bcTplSize").textContent="Snapshot "+(bytes/1024).toFixed(0)+" KB · "+(types.length||0)+" court type";$("bcTplModal").hidden=false;setTimeout(()=>$("bcTplName").focus(),50)}
function openEdit(id){const t=templates.find(x=>x.id===id);if(!t)return;editingTemplate=t;pendingSnapshot=null;pendingPreview="";injectModal();$("bcTplModalTitle").textContent="Edit Template Info";$("bcTplModalSub").textContent="Artwork template tidak berubah.";$("bcTplName").value=t.name;$("bcTplCatInput").value=t.category;$("bcTplBrandInput").value=t.brand;$("bcTplDescription").value=t.description||"";$("bcTplPinned").checked=!!t.pinned;$("bcTplSize").textContent="Created "+new Date(t.created_at).toLocaleString()+" · Updated "+new Date(t.updated_at).toLocaleString();$("bcTplModal").hidden=false}
function closeModal(){if($("bcTplModal"))$("bcTplModal").hidden=true;editingTemplate=null;pendingSnapshot=null;pendingPreview=""}
async function saveModal(){const name=$("bcTplName").value.trim(),category=$("bcTplCatInput").value.trim()||"Custom",brand=$("bcTplBrandInput").value,description=$("bcTplDescription").value.trim(),pinned=$("bcTplPinned").checked;if(!name)throw new Error("Masukkan nama template.");const headers=Object.assign({Prefer:"return=representation"},await adminHeaders());if(editingTemplate){await sb("binacourt_templates?id=eq."+encodeURIComponent(editingTemplate.id),{method:"PATCH",headers,body:JSON.stringify({name,category,brand,description,pinned,updated_at:new Date().toISOString()})})}else{if(!pendingSnapshot)throw new Error("Snapshot template tidak tersedia.");const types=courtTypesFromSnapshot(pendingSnapshot);await sb("binacourt_templates",{method:"POST",headers,body:JSON.stringify({name,category,brand,description,pinned,active:true,snapshot:pendingSnapshot,preview:pendingPreview,court_types:types})})}closeModal();await loadTemplates();window.BinaCourtDashboard?.show("templates")}
async function useTemplate(id){const t=templates.find(x=>x.id===id);if(!t||!t.active)throw new Error("Template tidak tersedia.");if(window.BinaCourtDashboard?.dirty&&window.BinaCourtDashboard?.currentProject&&!confirm("Project semasa ada perubahan yang mungkin belum disimpan. Gunakan template dan mulakan project baru?"))return;if(!t.snapshot||typeof t.snapshot!=="object")throw new Error("Snapshot template rosak.");window.BinaCourtDashboard?.clearProjectContext?.();const snap=clone(t.snapshot);snap.projectTitle="";snap.projectSalesName="";snap.projectReferenceNo="";snap.selectedId=null;if(typeof restoreProjectSnapshot!=="function")throw new Error("Project restore engine tidak tersedia.");restoreProjectSnapshot(JSON.stringify(snap));state.projectTitle="";state.projectSalesName="";state.projectReferenceNo="";state.selectedId=null;if(typeof syncProjectInputs==="function")syncProjectInputs();if(typeof render==="function")render({preserveStagePosition:false});if(typeof initializeHistory==="function")initializeHistory();window.BinaCourtDashboard?.hide()}
async function duplicateTemplate(id){const t=templates.find(x=>x.id===id);if(!t)return;const body={name:(t.name+" Copy").slice(0,120),category:t.category,description:t.description,brand:t.brand,court_types:t.court_types||[],pinned:false,active:true,snapshot:t.snapshot,preview:t.preview||""};await sb("binacourt_templates",{method:"POST",headers:Object.assign({Prefer:"return=minimal"},await adminHeaders()),body:JSON.stringify(body)});await loadTemplates()}
async function togglePin(id){const t=templates.find(x=>x.id===id);if(!t)return;await sb("binacourt_templates?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:Object.assign({Prefer:"return=minimal"},await adminHeaders()),body:JSON.stringify({pinned:!t.pinned,updated_at:new Date().toISOString()})});await loadTemplates()}
async function toggleArchive(id){const t=templates.find(x=>x.id===id);if(!t)return;await sb("binacourt_templates?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:Object.assign({Prefer:"return=minimal"},await adminHeaders()),body:JSON.stringify({active:!t.active,pinned:t.active?false:t.pinned,updated_at:new Date().toISOString()})});await loadTemplates()}
async function deleteTemplate(id){const t=templates.find(x=>x.id===id);if(!t||!confirm('Delete template "'+t.name+'"? Project yang pernah dibuat daripada template tidak terjejas.'))return;await sb("binacourt_templates?id=eq."+encodeURIComponent(id),{method:"DELETE",headers:Object.assign({Prefer:"return=minimal"},await adminHeaders())});await loadTemplates()}
function showError(e){alert(e?.message||String(e||"Ralat template."))}
async function init(){for(let i=0;i<160&&(!window.BinaCourtDashboard||typeof state==="undefined");i++)await new Promise(r=>setTimeout(r,50));replaceTemplatePage();injectModal();injectDesignerButton();const view=document.querySelector('#bcDash .bcView[data-view="templates"]');if(view)new MutationObserver(()=>{if(!view.hidden)loadTemplates().catch(showError)}).observe(view,{attributes:true,attributeFilter:["hidden"]});new MutationObserver(applyRole).observe(document.body,{attributes:true,attributeFilter:["data-user-role"]});await loadTemplates().catch(e=>console.warn("Template Library",e));applyRole();window.BinaCourtTemplateLibrary={refresh:loadTemplates,create:openCreate,use:useTemplate,get templates(){return templates.slice()}}}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init,{once:true});else init();
})();
</script>
