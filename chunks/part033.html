<style>
.bcAdminViewHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.bcAdminViewHead h2{margin:0;font-size:22px}.bcAdminViewHead p{margin:5px 0 0;color:#667085;font-size:11px}
.bcStandardsGrid{display:grid;grid-template-columns:repeat(2,minmax(320px,1fr));gap:12px}.bcStandardCard{background:#fff;border:1px solid #d9e2ec;border-radius:13px;padding:14px}.bcStandardTop{display:flex;justify-content:space-between;gap:10px}.bcStandardTop h3{margin:0;font-size:13px}.bcStandardTop small{color:#667085}.bcStandardFields{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.bcStandardFields label,.bcColourForm label{font-size:9px;color:#667085}.bcStandardFields input,.bcStandardFields select,.bcColourForm input,.bcColourForm select{width:100%;height:34px;box-sizing:border-box;padding:6px 8px;font-size:10px}.bcStandardFields .wide{grid-column:span 2}.bcStandardActions{display:flex;gap:6px;margin-top:10px}.bcStandardActions button{font-size:9px!important;padding:7px 9px!important}
.bcBrandTabs{display:flex;gap:7px;margin-bottom:12px}.bcBrandTabs button{width:auto!important;padding:8px 11px!important;border-radius:99px!important;background:#fff!important;color:#344054!important;border:1px solid #d0d5dd!important}.bcBrandTabs button.active{background:#0d5cab!important;color:#fff!important;border-color:#0d5cab!important}
.bcColourLayout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px}.bcColourGrid{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:9px}.bcColourCard{background:#fff;border:1px solid #d9e2ec;border-radius:11px;overflow:hidden}.bcColourSwatch{height:68px;position:relative}.bcColourFav{position:absolute;right:7px;top:6px;border:0;background:#ffffffd9;border-radius:99px;width:27px!important;height:27px;padding:0!important;font-size:15px!important}.bcColourInfo{padding:9px}.bcColourInfo b{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bcColourInfo small{font-size:9px;color:#667085}.bcColourBtns{display:flex;gap:4px;margin-top:7px}.bcColourBtns button{font-size:8px!important;padding:5px 6px!important}
.bcColourSide{display:flex;flex-direction:column;gap:12px}.bcColourForm{background:#fff;border:1px solid #d9e2ec;border-radius:12px;padding:13px}.bcColourForm h3{margin:0 0 9px;font-size:12px}.bcColourForm .row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.bcMiniSwatches{display:flex;gap:5px;flex-wrap:wrap}.bcMiniSwatch{width:30px;height:30px;border-radius:7px;border:1px solid #d0d5dd;cursor:pointer}.bcPairing{border-top:1px solid #eef2f6;padding:8px 0}.bcPairing b{font-size:10px}.bcPairingActions{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:5px}.bcPairingActions button{font-size:8px!important;padding:5px 6px!important}
@media(max-width:1050px){.bcStandardsGrid{grid-template-columns:1fr}.bcColourLayout{grid-template-columns:1fr}.bcColourGrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.bcColourGrid{grid-template-columns:repeat(2,1fr)}.bcStandardFields{grid-template-columns:repeat(2,1fr)}}
</style>
<script>
(function setupBinaCourtStandardsAndColours(){
"use strict";
const SB_URL="https://thvpxsqrkusxbmeaojiv.supabase.co",SB_KEY="sb_publishable_damFcLVhqwglcU8tJWlfBA_ZYb15BrM";
const FAVORITES_KEY="binaCourtColourFavoritesV1",RECENT_KEY="binaCourtColourRecentV1";
const BUILTIN=typeof COURT_TYPES!=="undefined"?JSON.parse(JSON.stringify(COURT_TYPES)):{};
let standards=[],colours=[],pairings=[],brand="duracourt";
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isAdmin=()=>String(document.body.dataset.userRole||"")==="admin";
async function sb(path,opt={}){const r=await fetch(SB_URL+"/rest/v1/"+path,Object.assign({},opt,{headers:Object.assign({apikey:SB_KEY,"Content-Type":"application/json"},opt.headers||{})}));const t=await r.text();let b=null;try{b=t?JSON.parse(t):null}catch(_){b=t}if(!r.ok)throw new Error((b&&(b.message||b.details||b.error))||("HTTP "+r.status));return b}
async function adminHeaders(){return window.BinaCourtAdminTools?.headers?await window.BinaCourtAdminTools.headers():{}}
function localObj(k){try{return JSON.parse(localStorage.getItem(k)||"{}")||{}}catch(_){return{}}}
function saveObj(k,v){localStorage.setItem(k,JSON.stringify(v))}
function favs(b=brand){return localObj(FAVORITES_KEY)[b]||[]}
function recents(b=brand){return localObj(RECENT_KEY)[b]||[]}
function toggleFav(hex){const o=localObj(FAVORITES_KEY),a=new Set(o[brand]||[]);a.has(hex)?a.delete(hex):a.add(hex);o[brand]=[...a];saveObj(FAVORITES_KEY,o);renderColours()}
function remember(hex){const o=localObj(RECENT_KEY),a=[hex,...(o[brand]||[]).filter(x=>x!==hex)].slice(0,8);o[brand]=a;saveObj(RECENT_KEY,o);renderColourSide()}

function applyStandards(){
  if(typeof COURT_TYPES==="undefined")return;
  standards.forEach(r=>{
    const base=COURT_TYPES[r.sport_key]||{};
    COURT_TYPES[r.sport_key]=Object.assign({},base,r.config||{},{
      name:r.name,mode:r.mode,w:Number(r.w),h:Number(r.h),
      minW:r.min_w==null?undefined:Number(r.min_w),maxW:r.max_w==null?undefined:Number(r.max_w),
      minH:r.min_h==null?undefined:Number(r.min_h),maxH:r.max_h==null?undefined:Number(r.max_h),
      refW:r.ref_w==null?undefined:Number(r.ref_w),refH:r.ref_h==null?undefined:Number(r.ref_h),
      note:r.note||base.note||"",active:r.active!==false
    });
  });
  const sel=$("courtType");if(sel){const keep=sel.value;sel.innerHTML="";Object.entries(COURT_TYPES).forEach(([key,c])=>{if(key==="custom"||c.active===false)return;const op=document.createElement("option");op.value=key;op.textContent=c.name;sel.appendChild(op)});if([...sel.options].some(o=>o.value===keep))sel.value=keep;else if(sel.options.length)sel.selectedIndex=0;if(typeof updateAddCourtForm==="function")updateAddCourtForm()}
}
async function loadStandards(){standards=await sb("binacourt_court_standards?select=*&order=sort_order.asc,sport_key.asc");applyStandards();renderStandards()}
async function saveStandard(key){
  const r=standards.find(x=>x.sport_key===key);if(!r)return;
  const card=document.querySelector('[data-standard="'+CSS.escape(key)+'"]'),val=n=>{const v=card.querySelector('[data-field="'+n+'"]')?.value;return v===""?null:Number(v)};
  const config=Object.assign({},r.config||{});
  for(const k of ["fill","line"]){const v=card.querySelector('[data-field="'+k+'"]')?.value.trim();if(v)config[k]=v}
  const body={name:card.querySelector('[data-field="name"]').value.trim()||r.name,w:val("w"),h:val("h"),min_w:val("min_w"),max_w:val("max_w"),min_h:val("min_h"),max_h:val("max_h"),ref_w:val("ref_w"),ref_h:val("ref_h"),note:card.querySelector('[data-field="note"]').value.trim(),active:card.querySelector('[data-field="active"]').checked,config,updated_at:new Date().toISOString()};
  await sb("binacourt_court_standards?sport_key=eq."+encodeURIComponent(key),{method:"PATCH",headers:Object.assign({Prefer:"return=representation"},await adminHeaders()),body:JSON.stringify(body)});await loadStandards();if(typeof refreshCustomColourUi==="function")refreshCustomColourUi()
}
async function resetStandard(key){const b=BUILTIN[key];if(!b)return alert("Tiada built-in default untuk standard ini.");const body={name:b.name,mode:b.mode,w:b.w,h:b.h,min_w:b.minW??null,max_w:b.maxW??null,min_h:b.minH??null,max_h:b.maxH??null,ref_w:b.refW??null,ref_h:b.refH??null,note:b.note||"",active:true,config:Object.fromEntries(Object.entries(b).filter(([k])=>!["name","mode","w","h","minW","maxW","minH","maxH","refW","refH","note","active"].includes(k))),updated_at:new Date().toISOString()};await sb("binacourt_court_standards?sport_key=eq."+encodeURIComponent(key),{method:"PATCH",headers:Object.assign({Prefer:"return=representation"},await adminHeaders()),body:JSON.stringify(body)});await loadStandards()}
function field(label,name,value,type="number",wide=false){return'<label class="'+(wide?"wide":"")+'">'+label+'<input data-field="'+name+'" type="'+type+'" '+(type==="number"?'step="0.01" min="0"':'')+' value="'+esc(value??"")+'"></label>'}
function renderStandards(){
  const host=$("bcStandardsGrid");if(!host)return;host.innerHTML=standards.map(r=>'<article class="bcStandardCard" data-standard="'+esc(r.sport_key)+'"><div class="bcStandardTop"><div><h3>'+esc(r.name)+'</h3><small>'+esc(r.sport_key)+' · '+esc(r.mode)+'</small></div><label style="font-size:9px"><input data-field="active" type="checkbox" '+(r.active?'checked':'')+' '+(!isAdmin()?'disabled':'')+'> Active</label></div><div class="bcStandardFields">'+field("Name","name",r.name,"text",true)+field("Width (m)","w",r.w)+field("Height (m)","h",r.h)+field("Min W","min_w",r.min_w)+field("Max W","max_w",r.max_w)+field("Min H","min_h",r.min_h)+field("Max H","max_h",r.max_h)+field("Ref W","ref_w",r.ref_w)+field("Ref H","ref_h",r.ref_h)+field("Default Fill","fill",r.config?.fill||"","text")+field("Default Line","line",r.config?.line||"","text")+field("Note","note",r.note,"text",true)+'</div><div class="bcStandardActions"><button class="bcBtn primary" data-save="'+esc(r.sport_key)+'" '+(!isAdmin()?'disabled':'')+'>Save</button><button class="bcBtn" data-reset="'+esc(r.sport_key)+'" '+(!isAdmin()?'disabled':'')+'>Reset Built-in</button></div></article>').join("");
  host.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>saveStandard(b.dataset.save).catch(e=>alert(e.message)));host.querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>resetStandard(b.dataset.reset).catch(e=>alert(e.message)))
}

async function loadColours(){const [c,p]=await Promise.all([sb("binacourt_brand_colours?select=*&order=brand.asc,sort_order.asc,name.asc"),sb("binacourt_colour_pairings?select=*&order=brand.asc,sort_order.asc,name.asc")]);colours=Array.isArray(c)?c:[];pairings=Array.isArray(p)?p:[];renderColours();if(typeof refreshCustomColourUi==="function")refreshCustomColourUi()}
function paletteForBrand(b){return colours.filter(x=>x.brand===b&&x.active).sort((a,b)=>a.sort_order-b.sort_order).map(x=>({name:x.name,color:String(x.color).toLowerCase(),cloudBrand:true,id:x.id}))}
function setBrand(b){brand=["duracourt","primacourt","terracourt"].includes(b)?b:"duracourt";document.querySelectorAll(".bcBrandTabs button").forEach(x=>x.classList.toggle("active",x.dataset.brand===brand));renderColours();renderColourSide()}
function renderColours(){
  const host=$("bcColourGrid");if(!host)return;const f=new Set(favs());const rows=colours.filter(x=>x.brand===brand).sort((a,b)=>a.sort_order-b.sort_order);
  host.innerHTML=rows.map(r=>'<article class="bcColourCard"><div class="bcColourSwatch" style="background:'+esc(r.color)+'"><button class="bcColourFav" data-fav="'+esc(r.color.toLowerCase())+'">'+(f.has(r.color.toLowerCase())?"★":"☆")+'</button></div><div class="bcColourInfo"><b>'+esc(r.name)+'</b><small>'+esc(r.color.toUpperCase())+(r.active?"":" · Disabled")+'</small><div class="bcColourBtns"><button class="bcBtn" data-use="'+esc(r.color.toLowerCase())+'">Favorite</button>'+(isAdmin()?'<button class="bcBtn" data-edit="'+r.id+'">Edit</button><button class="bcBtn" data-toggle="'+r.id+'">'+(r.active?"Disable":"Enable")+'</button><button class="bcBtn bcV2Danger" data-delete="'+r.id+'">Delete</button>':'')+'</div></div></article>').join("");
  host.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>toggleFav(b.dataset.fav));host.querySelectorAll("[data-use]").forEach(b=>b.onclick=()=>{toggleFav(b.dataset.use);remember(b.dataset.use)});
  host.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editColour(b.dataset.edit).catch(e=>alert(e.message)));host.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>toggleColour(b.dataset.toggle).catch(e=>alert(e.message)));host.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>deleteColour(b.dataset.delete).catch(e=>alert(e.message)));renderColourSide()
}
function renderColourSide(){
  const f=$("bcFavSwatches"),r=$("bcRecentSwatches"),p=$("bcPairingList");if(f)f.innerHTML=favs().map(h=>'<span class="bcMiniSwatch" title="'+esc(h)+'" style="background:'+esc(h)+'"></span>').join("")||'<small>Belum ada favorite.</small>';if(r)r.innerHTML=recents().map(h=>'<span class="bcMiniSwatch" title="'+esc(h)+'" style="background:'+esc(h)+'"></span>').join("")||'<small>Belum ada recent.</small>';
  if(p){const rows=pairings.filter(x=>x.brand===brand&&x.active);p.innerHTML=rows.map(x=>'<div class="bcPairing"><b>'+esc(x.name)+'</b><div class="bcPairingActions"><span class="bcMiniSwatches">'+(Array.isArray(x.colors)?x.colors:[]).map(h=>'<span class="bcMiniSwatch" style="background:'+esc(h)+'"></span>').join("")+'</span><span><button class="bcBtn" data-pair="'+x.id+'">Favorite Set</button>'+(isAdmin()?'<button class="bcBtn bcV2Danger" data-pairdel="'+x.id+'">Delete</button>':'')+'</span></div></div>').join("")||'<small>Belum ada pairing preset.</small>';p.querySelectorAll("[data-pair]").forEach(b=>b.onclick=()=>{const x=pairings.find(y=>y.id===b.dataset.pair),o=localObj(FAVORITES_KEY),set=new Set(o[brand]||[]);(x?.colors||[]).forEach(h=>set.add(String(h).toLowerCase()));o[brand]=[...set];saveObj(FAVORITES_KEY,o);renderColours()});p.querySelectorAll("[data-pairdel]").forEach(b=>b.onclick=()=>deletePairing(b.dataset.pairdel).catch(e=>alert(e.message)))}
}
async function addColour(){const name=$("bcNewColourName").value.trim(),hex=$("bcNewColourHex").value.trim().toLowerCase();if(!name||!/^#[0-9a-f]{6}$/.test(hex))throw new Error("Masukkan nama dan HEX #RRGGBB yang sah.");await sb("binacourt_brand_colours",{method:"POST",headers:Object.assign({Prefer:"return=minimal"},await adminHeaders()),body:JSON.stringify({brand,name,color:hex,sort_order:colours.filter(x=>x.brand===brand).length*10+10})});$("bcNewColourName").value="";$("bcNewColourHex").value="#";await loadColours()}
async function editColour(id){const x=colours.find(y=>y.id===id);if(!x)return;const name=prompt("Nama warna:",x.name);if(name===null)return;const hex=prompt("HEX:",x.color);if(hex===null)return;if(!/^#[0-9a-fA-F]{6}$/.test(hex.trim()))throw new Error("HEX tidak sah.");await sb("binacourt_brand_colours?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:Object.assign({Prefer:"return=minimal"},await adminHeaders()),body:JSON.stringify({name:name.trim()||x.name,color:hex.trim().toLowerCase(),updated_at:new Date().toISOString()})});await loadColours()}
async function toggleColour(id){const x=colours.find(y=>y.id===id);if(!x)return;await sb("binacourt_brand_colours?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:Object.assign({Prefer:"return=minimal"},await adminHeaders()),body:JSON.stringify({active:!x.active,updated_at:new Date().toISOString()})});await loadColours()}
async function deleteColour(id){const x=colours.find(y=>y.id===id);if(!x||!confirm('Delete "'+x.name+'"? Existing projects using this HEX will remain unchanged.'))return;await sb("binacourt_brand_colours?id=eq."+encodeURIComponent(id),{method:"DELETE",headers:Object.assign({Prefer:"return=minimal"},await adminHeaders())});await loadColours()}
async function addPairing(){const name=$("bcPairName").value.trim(),raw=$("bcPairColours").value.trim(),arr=raw.split(",").map(x=>x.trim().toLowerCase()).filter(x=>/^#[0-9a-f]{6}$/.test(x));if(!name||arr.length<2)throw new Error("Masukkan nama dan sekurang-kurangnya 2 HEX dipisahkan koma.");await sb("binacourt_colour_pairings",{method:"POST",headers:Object.assign({Prefer:"return=minimal"},await adminHeaders()),body:JSON.stringify({brand,name,colors:arr,sort_order:pairings.filter(x=>x.brand===brand).length*10+10})});$("bcPairName").value="";$("bcPairColours").value="";await loadColours()}
async function deletePairing(id){if(!confirm("Delete pairing preset ini?"))return;await sb("binacourt_colour_pairings?id=eq."+encodeURIComponent(id),{method:"DELETE",headers:Object.assign({Prefer:"return=minimal"},await adminHeaders())});await loadColours()}

function navButton(view,label,path){const b=document.createElement("button");b.dataset.view=view;b.innerHTML='<svg viewBox="0 0 24 24"><path d="'+path+'"/></svg><span>'+label+'</span>';b.onclick=()=>window.BinaCourtDashboard?.show(view);return b}
function injectViews(){
  const nav=document.querySelector("#bcDash .bcNav");if(nav&&!$("bcNavStandards")){const settings=nav.querySelector('[data-view="settings"]');const s=navButton("court-standards","Court Standards","M4 5h16M7 3v4m10-4v4M5 10h14v10H5z");s.id="bcNavStandards";const c=navButton("colour-library","Colour Library","M12 3a9 9 0 1 0 0 18h1.4a2 2 0 0 0 0-4h-.9a2 2 0 0 1 0-4H12a10 10 0 0 1 0-20z");c.id="bcNavColourLibrary";nav.insertBefore(s,settings);nav.insertBefore(c,settings)}
  const main=document.querySelector("#bcDash .bcMain");if(main&&!$("bcStandardsView")){const s=document.createElement("section");s.id="bcStandardsView";s.className="bcView";s.dataset.view="court-standards";s.hidden=true;s.innerHTML='<div class="bcAdminViewHead"><div><h2>Admin Court Standard Manager</h2><p>Ubah saiz default/range tanpa edit source code. Existing saved court tidak diubah.</p></div><button class="bcBtn" id="bcStandardsRefresh">Refresh</button></div><div id="bcStandardsGrid" class="bcStandardsGrid"></div>';main.appendChild(s);$("bcStandardsRefresh").onclick=()=>loadStandards().catch(e=>alert(e.message));
    const c=document.createElement("section");c.id="bcColoursView";c.className="bcView";c.dataset.view="colour-library";c.hidden=true;c.innerHTML='<div class="bcAdminViewHead"><div><h2>Brand & Colour Library</h2><p>Master palette ikut brand, Favorite/Recent Colours dan pairing preset.</p></div><button class="bcBtn" id="bcColoursRefresh">Refresh</button></div><div class="bcBrandTabs"><button data-brand="duracourt" class="active">Duracourt</button><button data-brand="primacourt">Primacourt</button><button data-brand="terracourt">Terracourt</button></div><div class="bcColourLayout"><div id="bcColourGrid" class="bcColourGrid"></div><aside class="bcColourSide"><div class="bcColourForm"><h3>Favorites</h3><div id="bcFavSwatches" class="bcMiniSwatches"></div><h3 style="margin-top:12px">Recent</h3><div id="bcRecentSwatches" class="bcMiniSwatches"></div></div><div class="bcColourForm" id="bcColourAdminForm"><h3>Add Colour</h3><div class="row"><label>Name<input id="bcNewColourName"></label><label>HEX<input id="bcNewColourHex" value="#"></label></div><button class="bcBtn primary" id="bcAddBrandColour" style="margin-top:8px">Add Colour</button></div><div class="bcColourForm"><h3>Pairing Presets</h3><div id="bcPairingList"></div><div id="bcPairAdmin"><label>Name<input id="bcPairName"></label><label>HEX list, comma separated<input id="bcPairColours" placeholder="#1b427a,#416c3f,#ffffff"></label><button class="bcBtn primary" id="bcAddPairing" style="margin-top:8px">Add Pairing</button></div></div></aside></div>';main.appendChild(c);c.querySelectorAll("[data-brand]").forEach(b=>b.onclick=()=>setBrand(b.dataset.brand));$("bcColoursRefresh").onclick=()=>loadColours().catch(e=>alert(e.message));$("bcAddBrandColour").onclick=()=>addColour().catch(e=>alert(e.message));$("bcAddPairing").onclick=()=>addPairing().catch(e=>alert(e.message))}
}
function applyRole(){const admin=isAdmin();if($("bcColourAdminForm"))$("bcColourAdminForm").hidden=!admin;if($("bcPairAdmin"))$("bcPairAdmin").hidden=!admin;renderStandards();renderColours()}
async function init(){for(let i=0;i<120&&(!window.BinaCourtDashboard||typeof COURT_TYPES==="undefined");i++)await new Promise(r=>setTimeout(r,60));injectViews();await Promise.all([loadStandards(),loadColours()]);applyRole();new MutationObserver(applyRole).observe(document.body,{attributes:true,attributeFilter:["data-user-role"]})}
window.BinaCourtBrandLibrary={paletteForBrand,remember,refresh:loadColours,get colours(){return colours.slice()},get pairings(){return pairings.slice()}};
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init,{once:true});else init();
})();
</script>
