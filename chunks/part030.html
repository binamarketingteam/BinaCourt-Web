async function scanDriveProjects(){
  var d=window.BinaCourtDrive,btn=$("bcProjectScan");
  if(!d)throw new Error("Google Drive module tidak tersedia.");
  if(btn){btn.disabled=true;btn.textContent="Scanning…"}
  try{
    if(!d.connected)await d.connect();
    var root=d.root;
    if(!root){await d.selectRoot();root=d.root}
    if(!root||!root.id)throw new Error("Pilih folder BINA COURT PROJECTS dahulu.");
    var years=(await d.listChildren(root.id,{foldersOnly:true})).filter(function(x){return /^20\d{2}$/.test(String(x.name||""))});
    var imported=0,failed=0;
    for(var yi=0;yi<years.length;yi++){
      var year=years[yi],sales=await d.listChildren(year.id,{foldersOnly:true});
      for(var si=0;si<sales.length;si++){
        var sale=sales[si],jobs=await d.listChildren(sale.id,{foldersOnly:true});
        for(var ji=0;ji<jobs.length;ji++){
          var job=jobs[ji];
          try{
            var files=await d.listChildren(job.id);
            var projectFiles=files.filter(function(x){return /\.(binacourt|json)$/i.test(String(x.name||""))});
            if(!projectFiles.length)continue;
            projectFiles.sort(function(a,b){return String(b.modifiedTime||"").localeCompare(String(a.modifiedTime||""))});
            var pf=projectFiles[0],data=await d.readFile(pf.id),p=data&&data.project&&typeof data.project==="object"?data.project:data;
            if(!p||typeof p!=="object")continue;
            var cloud=p._binaCloud||data._binaCloud||{};
            var ref=String(p.projectReferenceNo||cloud.referenceNo||String(job.name||"").match(/^\s*([^\s-]+)/)?.[1]||"").trim();
            var title=String(p.projectTitle||String(job.name||"").replace(/^\s*[^\s-]+\s*[-–—]?\s*/,"")||job.name||"Untitled Project").trim();
            var payload={
              project_year:Number(year.name)||Number(cloud.year)||new Date().getFullYear(),
              reference_no:ref,title:title||"Untitled Project",
              sales_name:String(p.projectSalesName||cloud.saleName||sale.name||"Unknown").trim(),
              status:"draft",brand_system:String(p.brand||"duracourt"),
              court_count:Array.isArray(p.courts)?p.courts.filter(function(c){return !c.hidden}).length:0,
              drive_root_folder_id:root.id,drive_year_folder_id:year.id,drive_sales_folder_id:sale.id,
              drive_job_folder_id:job.id,drive_project_file_id:pf.id,
              last_saved_at:pf.modifiedTime||cloud.savedAt||now(),
              metadata:{site_w:Number(p.siteW||0),site_h:Number(p.siteH||0),measurement_unit:p.measurementUnit||"m",court_types:[...new Set((p.courts||[]).filter(function(c){return !c.hidden}).map(function(c){return c.type}).filter(Boolean))]}
            };
            await sb("binacourt_projects?on_conflict=drive_project_file_id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(payload)});
            imported++;
          }catch(error){failed++;console.warn("Drive scan project:",job.name,error)}
        }
      }
    }
    await refreshProjects();
    alert("Drive scan selesai. "+imported+" project didaftarkan"+(failed?" · "+failed+" gagal dibaca":"")+".");
  }finally{
    if(btn){btn.disabled=false;btn.textContent="Import / Scan Drive"}
  }
}

async function capturePdf(){

}
