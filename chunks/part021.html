<script>
(function(){
  // ------------------------------------------------------------
  // Shape Tool - editable rectangle surface artwork.
  // Supports Walkway/Main Surface roles, Duracourt/Primacourt/Terracourt,
  // court surface palette colours, resize/move/rotate/delete/duplicate,
  // Layers ordering, JSON/Option persistence and PDF colour descriptions.
  // ------------------------------------------------------------

  if(!Array.isArray(state.shapeAnnotations)) state.shapeAnnotations=[];
  if(!Number.isFinite(Number(state.nextShapeId))) state.nextShapeId=1;

  let selectedShapeId=null;
  const shapeToolState={
    active:false,
    dragging:false,
    pointerId:null,
    start:null,
    end:null,
    role:"walkway",
    brand:normalizeBrand(state.brand,"duracourt"),
    color:""
  };

  function normalizeShapeRole(value){
    return value==="main_surface" ? "main_surface" : "walkway";
  }

  function normalizeShapeAngle(value){
    let angle=Number(value);
    if(!Number.isFinite(angle)) angle=0;
    angle=((angle%360)+360)%360;
    if(angle>180) angle-=360;
    return angle;
  }

  function shapePalette(brand){
    const normalized=normalizeBrand(brand,state.brand||"duracourt");
    return getDefaultPaletteForBrand(normalized).filter(item=>normalizeHexColor(item?.color));
  }

  function shapeDefaultColor(brand){
    const palette=shapePalette(brand);
    const site=normalizeHexColor(state.siteColor);
    if(site && palette.some(item=>normalizeHexColor(item.color)===site)) return site;
    return normalizeHexColor(palette[0]?.color) || "#7b7e82";
  }

  function normalizeShapeAnnotation(item,index=0){
    const raw=item && typeof item==="object" ? item : {};
    const brand=normalizeBrand(raw.brand,state.brand||"duracourt");
    const palette=shapePalette(brand);
    const requested=normalizeHexColor(raw.color);
    const color=requested && palette.some(entry=>normalizeHexColor(entry.color)===requested)
      ? requested
      : shapeDefaultColor(brand);
    let w=Number(raw.w), h=Number(raw.h);
    if(!Number.isFinite(w) || w<=0) w=4;
    if(!Number.isFinite(h) || h<=0) h=3;
    return {
      id:Math.max(1,parseInt(raw.id,10)||(index+1)),
      x:Number.isFinite(Number(raw.x)) ? Number(raw.x) : 0,
      y:Number.isFinite(Number(raw.y)) ? Number(raw.y) : 0,
      w:Math.max(.15,w),
      h:Math.max(.15,h),
      angle:normalizeShapeAngle(raw.angle),
      role:normalizeShapeRole(raw.role),
      brand,
      color,
      hidden:!!raw.hidden,
      locked:!!raw.locked
    };
  }

  function normalizeShapeAnnotations(){
    state.shapeAnnotations=Array.isArray(state.shapeAnnotations)
      ? state.shapeAnnotations.map((item,index)=>{
          const normalized=normalizeShapeAnnotation(item,index);
          if(item && typeof item==="object"){
            Object.assign(item,normalized);
            return item;
          }
          return normalized;
        })
      : [];
    const used=new Set();
    state.shapeAnnotations.forEach(item=>{
      while(used.has(item.id)) item.id++;
      used.add(item.id);
    });
    state.nextShapeId=Math.max(
      parseInt(state.nextShapeId||1,10)||1,
      ...state.shapeAnnotations.map(item=>item.id+1),
      1
    );
    if(selectedShapeId!==null && !state.shapeAnnotations.some(item=>item.id===selectedShapeId)){
      selectedShapeId=null;
    }
    return state.shapeAnnotations;
  }

  function shapeAnnotationById(id){
    normalizeShapeAnnotations();
    return state.shapeAnnotations.find(item=>item.id===id)||null;
  }

  function shapeRoleLabel(role){
    return normalizeShapeRole(role)==="main_surface" ? "Main Surface" : "Walkway";
  }

  function clearOtherSelectionsForShape(){
    selectedImageId=null;
    selectedTextId=null;
    selectedMeasurementId=null;
    selectedLineId=null;
    clearCourtSelection();
    closeMeasureInlineEditor(false);
    closeTextInlineEditor(false);
  }

  function shapeGroupTransform(item){
    const angle=normalizeShapeAngle(item?.angle);
    if(!angle) return "";
    const cx=(Number(item.x)||0)+(Number(item.w)||0)/2;
    const cy=(Number(item.y)||0)+(Number(item.h)||0)/2;
    return `rotate(${angle} ${cx} ${cy})`;
  }

  function worldPointToShapeLocal(point,item){
    const angle=-normalizeShapeAngle(item?.angle)*Math.PI/180;
    if(Math.abs(angle)<1e-9) return {x:point.x,y:point.y};
    const cx=item.x+item.w/2, cy=item.y+item.h/2;
    const dx=point.x-cx, dy=point.y-cy;
    return {
      x:cx+dx*Math.cos(angle)-dy*Math.sin(angle),
      y:cy+dx*Math.sin(angle)+dy*Math.cos(angle)
    };
  }

  function shapeResizeHitWorldSize(){
    return Math.max(.38,Math.min(1.0,(courtViewport?.w||40)*.018));
  }

  function updateShapeAnnotationGroup(group,item){
    const transform=shapeGroupTransform(item);
    if(transform) group.setAttribute("transform",transform); else group.removeAttribute("transform");

    const rect=group.querySelector(".shape-content");
    if(rect){
      rect.setAttribute("x",item.x);
      rect.setAttribute("y",item.y);
      rect.setAttribute("width",item.w);
      rect.setAttribute("height",item.h);
      rect.setAttribute("fill",item.color);
    }
    const hit=group.querySelector(".shape-hit-area");
    if(hit){
      hit.setAttribute("x",item.x);
      hit.setAttribute("y",item.y);
      hit.setAttribute("width",item.w);
      hit.setAttribute("height",item.h);
    }
    const sel=group.querySelector(".shape-selection");
    if(sel){
      sel.setAttribute("x",item.x);
      sel.setAttribute("y",item.y);
      sel.setAttribute("width",item.w);
      sel.setAttribute("height",item.h);
    }

    const handles={
      nw:[item.x,item.y],
      ne:[item.x+item.w,item.y],
      sw:[item.x,item.y+item.h],
      se:[item.x+item.w,item.y+item.h]
    };
    const hitSize=shapeResizeHitWorldSize();
    Object.entries(handles).forEach(([key,[x,y]])=>{
      const touch=group.querySelector(`.shape-resize-hit[data-handle="${key}"]`);
      if(touch){
        touch.setAttribute("x",x-hitSize/2);
        touch.setAttribute("y",y-hitSize/2);
        touch.setAttribute("width",hitSize);
        touch.setAttribute("height",hitSize);
      }
      const knob=group.querySelector(`.shape-resize-knob[data-handle="${key}"]`);
      if(knob){
        knob.setAttribute("x",x-.20);
        knob.setAttribute("y",y-.20);
      }
    });

    const rotateGap=Math.max(.7,Math.min(1.2,item.h*.18));
    const rotateX=item.x+item.w;
    const rotateY=item.y-rotateGap;
    const connector=group.querySelector(".shape-rotate-connector");
    if(connector){
      connector.setAttribute("x1",item.x+item.w);
      connector.setAttribute("y1",item.y);
      connector.setAttribute("x2",rotateX);
      connector.setAttribute("y2",rotateY);
    }
    const rotate=group.querySelector(".shape-rotate-handle");
    if(rotate){
      rotate.setAttribute("cx",rotateX);
      rotate.setAttribute("cy",rotateY);
    }
  }

  function bindShapeDrag(target,item,group){
    target.addEventListener("pointerdown",event=>{
      if(item.locked || event.button!==0) return;
      event.preventDefault();
      event.stopPropagation();
      const id=item.id;
      selectedShapeId=id;
      clearOtherSelectionsForShape();
      const live=shapeAnnotationById(id)||item;
      const start=stagePointFromClient(event.clientX,event.clientY);
      const x0=live.x, y0=live.y;
      const pid=event.pointerId;
      let moved=false;
      try{target.setPointerCapture?.(pid);}catch(_){ }

      const move=e=>{
        if(e.pointerId!==pid) return;
        e.preventDefault?.();
        const p=stagePointFromClient(e.clientX,e.clientY);
        const current=shapeAnnotationById(id);
        if(!current) return;
        current.x=x0+(p.x-start.x);
        current.y=y0+(p.y-start.y);
        moved=true;
        updateShapeAnnotationGroup(group,current);
      };
      const end=e=>{
        if(e.pointerId!==pid) return;
        window.removeEventListener("pointermove",move);
