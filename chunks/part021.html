<script>
(function(){
  // ------------------------------------------------------------
  // Shape Tool - editable rectangle surface artwork.
  // Supports Walkway/Main Surface roles, Duracourt/Primacourt/Terracourt,
  // court surface palette colours, resize/move/rotate/delete/duplicate,
  // Layers ordering, JSON/Option persistence and PDF colour descriptions.
  // ------------------------------------------------------------

  if(!Array.isArray(state.shapeAnnotations)) state.shapeAnnotations=[];
  if(!Number.isFinite(Number(state.nextShapeId))) state.nextShapeId=1;

  let selectedShapeId=null;
  window.__clearBinaShapeSelection=()=>{selectedShapeId=null;};
  const shapeToolState={
    active:false,
    dragging:false,
    pointerId:null,
    start:null,
    end:null,
    role:"walkway",
    brand:normalizeBrand(state.brand,"duracourt"),
    color:""
  };

  function normalizeShapeRole(value){
    return value==="main_surface" ? "main_surface" : "walkway";
  }

  function normalizeShapeAngle(value){
    let angle=Number(value);
    if(!Number.isFinite(angle)) angle=0;
    angle=((angle%360)+360)%360;
    if(angle>180) angle-=360;
    return angle;
  }

  function shapePalette(brand){
    const normalized=normalizeBrand(brand,state.brand||"duracourt");
    return getDefaultPaletteForBrand(normalized).filter(item=>normalizeHexColor(item?.color));
  }

  function shapeDefaultColor(brand){
    const palette=shapePalette(brand);
    const site=normalizeHexColor(state.siteColor);
    if(site && palette.some(item=>normalizeHexColor(item.color)===site)) return site;
    return normalizeHexColor(palette[0]?.color) || "#7b7e82";
  }

  function normalizeShapeAnnotation(item,index=0){
    const raw=item && typeof item==="object" ? item : {};
    const brand=normalizeBrand(raw.brand,state.brand||"duracourt");
    const palette=shapePalette(brand);
    const requested=normalizeHexColor(raw.color);
    const color=requested && palette.some(entry=>normalizeHexColor(entry.color)===requested)
      ? requested
      : shapeDefaultColor(brand);
    let w=Number(raw.w), h=Number(raw.h);
    if(!Number.isFinite(w) || w<=0) w=4;
    if(!Number.isFinite(h) || h<=0) h=3;
    return {
      id:Math.max(1,parseInt(raw.id,10)||(index+1)),
      x:Number.isFinite(Number(raw.x)) ? Number(raw.x) : 0,
      y:Number.isFinite(Number(raw.y)) ? Number(raw.y) : 0,
      w:Math.max(.15,w),
      h:Math.max(.15,h),
      angle:normalizeShapeAngle(raw.angle),
      role:normalizeShapeRole(raw.role),
      brand,
      color,
      hidden:!!raw.hidden,
      locked:!!raw.locked
    };
  }

  function normalizeShapeAnnotations(){
    state.shapeAnnotations=Array.isArray(state.shapeAnnotations)
      ? state.shapeAnnotations.map((item,index)=>{
          const normalized=normalizeShapeAnnotation(item,index);
          if(item && typeof item==="object"){
            Object.assign(item,normalized);
            return item;
          }
          return normalized;
        })
      : [];
    const used=new Set();
    state.shapeAnnotations.forEach(item=>{
      while(used.has(item.id)) item.id++;
      used.add(item.id);
    });
    state.nextShapeId=Math.max(
      parseInt(state.nextShapeId||1,10)||1,
      ...state.shapeAnnotations.map(item=>item.id+1),
      1
    );
    if(selectedShapeId!==null && !state.shapeAnnotations.some(item=>item.id===selectedShapeId)){
      selectedShapeId=null;
    }
    return state.shapeAnnotations;
  }

  function shapeAnnotationById(id){
    normalizeShapeAnnotations();
    return state.shapeAnnotations.find(item=>item.id===id)||null;
  }

  function shapeRoleLabel(role){
    return normalizeShapeRole(role)==="main_surface" ? "Main Surface" : "Walkway";
  }

  function clearOtherSelectionsForShape(){
    selectedImageId=null;
    selectedTextId=null;
    selectedMeasurementId=null;
    selectedLineId=null;
    clearCourtSelection();
    closeMeasureInlineEditor(false);
    closeTextInlineEditor(false);
  }

  function shapeGroupTransform(item){
    const angle=normalizeShapeAngle(item?.angle);
    if(!angle) return "";
    const cx=(Number(item.x)||0)+(Number(item.w)||0)/2;
    const cy=(Number(item.y)||0)+(Number(item.h)||0)/2;
    return `rotate(${angle} ${cx} ${cy})`;
  }

  function worldPointToShapeLocal(point,item){
    const angle=-normalizeShapeAngle(item?.angle)*Math.PI/180;
    if(Math.abs(angle)<1e-9) return {x:point.x,y:point.y};
    const cx=item.x+item.w/2, cy=item.y+item.h/2;
    const dx=point.x-cx, dy=point.y-cy;
    return {
      x:cx+dx*Math.cos(angle)-dy*Math.sin(angle),
      y:cy+dx*Math.sin(angle)+dy*Math.cos(angle)
    };
  }

  function shapeResizeHitWorldSize(){
    return Math.max(.38,Math.min(1.0,(courtViewport?.w||40)*.018));
  }

  function updateShapeAnnotationGroup(group,item){
    const transform=shapeGroupTransform(item);
    if(transform) group.setAttribute("transform",transform); else group.removeAttribute("transform");

    const rect=group.querySelector(".shape-content");
    if(rect){
      rect.setAttribute("x",item.x);
      rect.setAttribute("y",item.y);
      rect.setAttribute("width",item.w);
      rect.setAttribute("height",item.h);
      rect.setAttribute("fill",item.color);
    }
    const hit=group.querySelector(".shape-hit-area");
    if(hit){
      hit.setAttribute("x",item.x);
      hit.setAttribute("y",item.y);
      hit.setAttribute("width",item.w);
      hit.setAttribute("height",item.h);
    }
    const sel=group.querySelector(".shape-selection");
    if(sel){
      sel.setAttribute("x",item.x);
      sel.setAttribute("y",item.y);
      sel.setAttribute("width",item.w);
      sel.setAttribute("height",item.h);
    }

    const handles={
      nw:[item.x,item.y],
      ne:[item.x+item.w,item.y],
      sw:[item.x,item.y+item.h],
      se:[item.x+item.w,item.y+item.h]
    };
    const hitSize=shapeResizeHitWorldSize();
    Object.entries(handles).forEach(([key,[x,y]])=>{
      const touch=group.querySelector(`.shape-resize-hit[data-handle="${key}"]`);
      if(touch){
        touch.setAttribute("x",x-hitSize/2);
        touch.setAttribute("y",y-hitSize/2);
        touch.setAttribute("width",hitSize);
        touch.setAttribute("height",hitSize);
      }
      const knob=group.querySelector(`.shape-resize-knob[data-handle="${key}"]`);
      if(knob){
        knob.setAttribute("x",x-.20);
        knob.setAttribute("y",y-.20);
      }
    });

    const rotateGap=Math.max(.7,Math.min(1.2,item.h*.18));
    const rotateX=item.x+item.w;
    const rotateY=item.y-rotateGap;
    const connector=group.querySelector(".shape-rotate-connector");
    if(connector){
      connector.setAttribute("x1",item.x+item.w);
      connector.setAttribute("y1",item.y);
      connector.setAttribute("x2",rotateX);
      connector.setAttribute("y2",rotateY);
    }
    const rotate=group.querySelector(".shape-rotate-handle");
    if(rotate){
      rotate.setAttribute("cx",rotateX);
      rotate.setAttribute("cy",rotateY);
    }
  }

  function bindShapeDrag(target,item,group){
    target.addEventListener("pointerdown",event=>{
      if(item.locked || event.button!==0) return;
      event.preventDefault();
      event.stopPropagation();
      const id=item.id;
      selectedShapeId=id;
      clearOtherSelectionsForShape();
      const live=shapeAnnotationById(id)||item;
      const start=stagePointFromClient(event.clientX,event.clientY);
      const x0=live.x, y0=live.y;
      const pid=event.pointerId;
      let moved=false;
      try{target.setPointerCapture?.(pid);}catch(_){ }

      const move=e=>{
        if(e.pointerId!==pid) return;
        e.preventDefault?.();
        const p=stagePointFromClient(e.clientX,e.clientY);
        const current=shapeAnnotationById(id);
        if(!current) return;
        current.x=x0+(p.x-start.x);
        current.y=y0+(p.y-start.y);
        moved=true;
        updateShapeAnnotationGroup(group,current);
      };
      const end=e=>{
        if(e.pointerId!==pid) return;
        window.removeEventListener("pointermove",move);
        window.removeEventListener("pointerup",end);
        window.removeEventListener("pointercancel",end);
        try{target.releasePointerCapture?.(pid);}catch(_){ }
        render();
        if(moved) commitHistory();
      };
      window.addEventListener("pointermove",move,{passive:false});
      window.addEventListener("pointerup",end);
      window.addEventListener("pointercancel",end);
      updateShapeFormatToolbar();
    });
  }

  function bindShapeResize(handle,item,group,corner){
    handle.addEventListener("pointerdown",event=>{
      if(item.locked || event.button!==0) return;
      event.preventDefault();
      event.stopPropagation();
      selectedShapeId=item.id;
      clearOtherSelectionsForShape();
      const live=shapeAnnotationById(item.id)||item;
      const startState={x:live.x,y:live.y,w:live.w,h:live.h,angle:live.angle||0};
      let anchorX=startState.x, anchorY=startState.y;
      if(corner==="nw"){anchorX=startState.x+startState.w;anchorY=startState.y+startState.h;}
      if(corner==="ne"){anchorX=startState.x;anchorY=startState.y+startState.h;}
      if(corner==="sw"){anchorX=startState.x+startState.w;anchorY=startState.y;}
      if(corner==="se"){anchorX=startState.x;anchorY=startState.y;}
      const pid=event.pointerId;
      let moved=false;
      try{handle.setPointerCapture?.(pid);}catch(_){ }

      const move=e=>{
        if(e.pointerId!==pid) return;
        e.preventDefault?.();
        const world=stagePointFromClient(e.clientX,e.clientY);
        const p=worldPointToShapeLocal(world,startState);
        const minSize=.15;
        let left,right,top,bottom;
        if(corner==="nw" || corner==="sw"){
          left=Math.min(p.x,anchorX-minSize);right=anchorX;
        }else{
          left=anchorX;right=Math.max(p.x,anchorX+minSize);
        }
        if(corner==="nw" || corner==="ne"){
          top=Math.min(p.y,anchorY-minSize);bottom=anchorY;
        }else{
          top=anchorY;bottom=Math.max(p.y,anchorY+minSize);
        }
        const current=shapeAnnotationById(item.id);
        if(!current) return;
        current.x=left;
        current.y=top;
        current.w=Math.max(minSize,right-left);
        current.h=Math.max(minSize,bottom-top);
        moved=true;
        updateShapeAnnotationGroup(group,current);
      };
      const end=e=>{
        if(e.pointerId!==pid) return;
        window.removeEventListener("pointermove",move);
        window.removeEventListener("pointerup",end);
        window.removeEventListener("pointercancel",end);
        try{handle.releasePointerCapture?.(pid);}catch(_){ }
        render();
        if(moved) commitHistory();
      };
      window.addEventListener("pointermove",move,{passive:false});
      window.addEventListener("pointerup",end);
      window.addEventListener("pointercancel",end);
    });
  }

  function bindShapeRotate(handle,item,group){
    handle.addEventListener("pointerdown",event=>{
      if(item.locked || event.button!==0) return;
      event.preventDefault();
      event.stopPropagation();
      selectedShapeId=item.id;
      clearOtherSelectionsForShape();
      const live=shapeAnnotationById(item.id)||item;
      const cx=live.x+live.w/2, cy=live.y+live.h/2;
      const start=stagePointFromClient(event.clientX,event.clientY);
      const pointerStart=Math.atan2(start.y-cy,start.x-cx)*180/Math.PI;
      const angleStart=normalizeShapeAngle(live.angle);
      const pid=event.pointerId;
      let moved=false;
      try{handle.setPointerCapture?.(pid);}catch(_){ }

      const move=e=>{
        if(e.pointerId!==pid) return;
        e.preventDefault?.();
        const p=stagePointFromClient(e.clientX,e.clientY);
        const pointerAngle=Math.atan2(p.y-cy,p.x-cx)*180/Math.PI;
        let next=angleStart+(pointerAngle-pointerStart);
        if(e.shiftKey) next=Math.round(next/45)*45;
        const current=shapeAnnotationById(item.id);
        if(!current) return;
        current.angle=normalizeShapeAngle(next);
        moved=true;
        updateShapeAnnotationGroup(group,current);
        if($("shapeAngle")) $("shapeAngle").value=String(Math.round(current.angle));
      };
      const end=e=>{
        if(e.pointerId!==pid) return;
        window.removeEventListener("pointermove",move);
        window.removeEventListener("pointerup",end);
        window.removeEventListener("pointercancel",end);
        try{handle.releasePointerCapture?.(pid);}catch(_){ }
        render();
        if(moved) commitHistory();
      };
      window.addEventListener("pointermove",move,{passive:false});
      window.addEventListener("pointerup",end);
      window.addEventListener("pointercancel",end);
    });
  }

  function createShapeAnnotationGroup(item){
    const attrs={class:"shape-annotation","data-shape-id":item.id,"data-shape-role":item.role,"data-shape-brand":item.brand};
    const transform=shapeGroupTransform(item);
    if(transform) attrs.transform=transform;
    const group=ns("g",attrs);

    const rect=ns("rect",{
      class:"shape-content",
      x:item.x,y:item.y,width:item.w,height:item.h,
      fill:item.color,
      stroke:"none",
      "shape-rendering":"geometricPrecision"
    });
    group.appendChild(rect);

    const hit=ns("rect",{
      class:"shape-hit-area",
      x:item.x,y:item.y,width:item.w,height:item.h,
      fill:"rgba(0,0,0,0)",stroke:"none","pointer-events":"all"
    });
    hit.style.cursor=item.locked?"default":"move";
    group.appendChild(hit);
    bindShapeDrag(hit,item,group);
    bindShapeDrag(rect,item,group);

    if(item.id===selectedShapeId){
      group.appendChild(ns("rect",{
        class:"editing-only shape-selection",
        x:item.x,y:item.y,width:item.w,height:item.h,
        fill:"none",stroke:"#2563eb","stroke-width":.045,"stroke-dasharray":".16 .10",
        "vector-effect":"non-scaling-stroke","pointer-events":"none"
      }));

      if(!item.locked){
        const handles={
          nw:[item.x,item.y],ne:[item.x+item.w,item.y],
          sw:[item.x,item.y+item.h],se:[item.x+item.w,item.y+item.h]
        };
        const hitSize=shapeResizeHitWorldSize();
        Object.entries(handles).forEach(([key,[x,y]])=>{
          const touch=ns("rect",{
            class:"editing-only shape-resize-hit",
            "data-handle":key,
            x:x-hitSize/2,y:y-hitSize/2,width:hitSize,height:hitSize,
            fill:"rgba(0,0,0,0)",stroke:"none","pointer-events":"all"
          });
          touch.style.cursor=(key==="nw"||key==="se")?"nwse-resize":"nesw-resize";
          group.appendChild(touch);
          const knob=ns("rect",{
            class:"editing-only shape-resize-knob",
            "data-handle":key,
            x:x-.20,y:y-.20,width:.40,height:.40,
            rx:.05,fill:"#ffffff",stroke:"#2563eb","stroke-width":.04,
            "vector-effect":"non-scaling-stroke","pointer-events":"none"
          });
          group.appendChild(knob);
          bindShapeResize(touch,item,group,key);
        });

        const rotateGap=Math.max(.7,Math.min(1.2,item.h*.18));
        const rotateX=item.x+item.w;
        const rotateY=item.y-rotateGap;
        group.appendChild(ns("line",{
          class:"editing-only shape-rotate-connector",
          x1:item.x+item.w,y1:item.y,x2:rotateX,y2:rotateY,
          stroke:"#2563eb","stroke-width":.04,"vector-effect":"non-scaling-stroke","pointer-events":"none"
        }));
        const rotate=ns("circle",{
          class:"editing-only shape-rotate-handle",
          cx:rotateX,cy:rotateY,r:.24,
          fill:"#ffffff",stroke:"#2563eb","stroke-width":.04,
          "vector-effect":"non-scaling-stroke","pointer-events":"all"
        });
        rotate.style.cursor="grab";
        group.appendChild(rotate);
        bindShapeRotate(rotate,item,group);
      }
    }

    return group;
  }

  function deleteShapeAnnotation(id){
    const item=shapeAnnotationById(id);
    if(!item || item.locked) return;
    state.shapeAnnotations=state.shapeAnnotations.filter(shape=>shape.id!==id);
    state.artworkLayerOrder=(state.artworkLayerOrder||[]).filter(token=>token!==`shape:${id}`);
    if(selectedShapeId===id) selectedShapeId=null;
    render();
    commitHistory();
  }

  function duplicateSelectedShape(){
    const item=shapeAnnotationById(selectedShapeId);
    if(!item) return;
    normalizeShapeAnnotations();
    const copy=normalizeShapeAnnotation({
      ...cloneData(item),
      id:state.nextShapeId++,
      x:item.x+.45,
      y:item.y+.45,
      locked:false,
      hidden:false
    },state.shapeAnnotations.length);
    state.shapeAnnotations.push(copy);
    normalizeArtworkLayerOrder();
    state.artworkLayerOrder=(state.artworkLayerOrder||[]).filter(token=>token!==`shape:${copy.id}`);
    state.artworkLayerOrder.push(`shape:${copy.id}`);
    selectedShapeId=copy.id;
    clearOtherSelectionsForShape();
    render();
    commitHistory();
  }

  function rotateSelectedShape(delta){
    const item=shapeAnnotationById(selectedShapeId);
    if(!item || item.locked) return;
    item.angle=normalizeShapeAngle((Number(item.angle)||0)+Number(delta||0));
    render();
    commitHistory();
  }

  function setSelectedShapeAngle(value,{commit=false}={}){
    const item=shapeAnnotationById(selectedShapeId);
    if(!item || item.locked) return;
    item.angle=normalizeShapeAngle(value);
    render();
    if(commit) commitHistory();
  }

  function populateShapeColourOptions(brand,color){
    const select=$("shapeColour");
    if(!select) return;
    const palette=shapePalette(brand);
    const current=normalizeHexColor(color)||shapeDefaultColor(brand);
    select.innerHTML="";
    palette.forEach(entry=>{
      const hex=normalizeHexColor(entry.color);
      if(!hex) return;
      const option=document.createElement("option");
      option.value=hex;
      option.textContent=`${entry.name} (${hex.toUpperCase()})`;
      select.appendChild(option);
    });
    const exists=Array.from(select.options).some(option=>option.value===current);
    select.value=exists?current:(select.options[0]?.value||current);
    const swatch=$("shapeColourPreview");
    if(swatch) swatch.style.background=select.value||current;
  }

  function updateShapeFormatToolbar(){
    const bar=$("shapeFormatToolbar");
    if(!bar) return;
    const item=selectedShapeId!==null ? shapeAnnotationById(selectedShapeId) : null;
    const show=!!item || !!shapeToolState.active;
    bar.hidden=!show;
    if(!show) return;

    const role=item?.role || shapeToolState.role;
    const brand=item?.brand || shapeToolState.brand || normalizeBrand(state.brand);
    const color=item?.color || shapeToolState.color || shapeDefaultColor(brand);
    if($("shapeRole")) $("shapeRole").value=normalizeShapeRole(role);
    if($("shapeBrand")) $("shapeBrand").value=normalizeBrand(brand,state.brand);
    populateShapeColourOptions(brand,color);
    if($("shapeAngle")){
      $("shapeAngle").value=String(Math.round(normalizeShapeAngle(item?.angle||0)));
      $("shapeAngle").disabled=!item || !!item.locked;
    }
    if($("shapeRotateLeft")) $("shapeRotateLeft").disabled=!item || !!item.locked;
    if($("shapeRotateRight")) $("shapeRotateRight").disabled=!item || !!item.locked;
    if($("shapeDuplicate")) $("shapeDuplicate").disabled=!item;
    if($("shapeDelete")) $("shapeDelete").disabled=!item || !!item.locked;
    if($("shapeRole")) $("shapeRole").disabled=!!item?.locked;
    if($("shapeBrand")) $("shapeBrand").disabled=!!item?.locked;
    if($("shapeColour")) $("shapeColour").disabled=!!item?.locked;
  }

  function applyShapeRole(value,{commit=false}={}){
    const role=normalizeShapeRole(value);
    shapeToolState.role=role;
    const item=shapeAnnotationById(selectedShapeId);
    if(item && !item.locked) item.role=role;
    render();
    if(commit && item && !item.locked) commitHistory();
  }

  function applyShapeBrand(value,{commit=false}={}){
    const brand=normalizeBrand(value,state.brand);
    shapeToolState.brand=brand;
    const item=shapeAnnotationById(selectedShapeId);
    if(item && !item.locked){
      const oldColor=normalizeHexColor(item.color);
      item.brand=brand;
      const palette=shapePalette(brand);
      item.color=palette.some(entry=>normalizeHexColor(entry.color)===oldColor)
        ? oldColor
        : shapeDefaultColor(brand);
      shapeToolState.color=item.color;
    }else{
      shapeToolState.color=shapeDefaultColor(brand);
    }
    render();
    if(commit && item && !item.locked) commitHistory();
  }

  function applyShapeColour(value,{commit=false}={}){
    const item=shapeAnnotationById(selectedShapeId);
    const brand=item?.brand || shapeToolState.brand;
    const palette=shapePalette(brand);
    const normalized=normalizeHexColor(value);
    const allowed=normalized && palette.some(entry=>normalizeHexColor(entry.color)===normalized);
    const color=allowed?normalized:shapeDefaultColor(brand);
    shapeToolState.color=color;
    if(item && !item.locked) item.color=color;
    const swatch=$("shapeColourPreview");
    if(swatch) swatch.style.background=color;
    render();
    if(commit && item && !item.locked) commitHistory();
  }

  function removeShapePreview(){
    svg.querySelectorAll(".shape-tool-preview").forEach(node=>node.remove());
  }

  function drawShapeToolOverlay(){
    removeShapePreview();
    if(!shapeToolState.active || !shapeToolState.dragging || !shapeToolState.start || !shapeToolState.end) return;
    const a=shapeToolState.start,b=shapeToolState.end;
    const x=Math.min(a.x,b.x),y=Math.min(a.y,b.y);
    const w=Math.abs(b.x-a.x),h=Math.abs(b.y-a.y);
    const rect=ns("rect",{
      class:"editing-only shape-tool-preview",
      x,y,width:w,height:h,
      fill:shapeToolState.color||shapeDefaultColor(shapeToolState.brand),
      "fill-opacity":.28,
      stroke:"#2563eb","stroke-width":.06,"stroke-dasharray":".20 .12",
      "vector-effect":"non-scaling-stroke","pointer-events":"none"
    });
    svg.appendChild(rect);
  }

  function setShapeToolActive(active){
    if(active && typeof customSiteDrawing!=="undefined" && customSiteDrawing){
      alert("Selesaikan atau Batal Draw Site dahulu sebelum guna Shape Tool.");
      return;
    }
    if(active){
      lineToolState.active=false;
      measureToolState.active=false;
      textToolState.active=false;
      stageTouchPanMode=false;
      closeTextInlineEditor(false);
      closeMeasureInlineEditor(false);
      shapeToolState.brand=normalizeBrand(shapeToolState.brand||state.brand,state.brand);
      if(!shapeToolState.color) shapeToolState.color=shapeDefaultColor(shapeToolState.brand);
    }
    shapeToolState.active=!!active;
    shapeToolState.dragging=false;
    shapeToolState.pointerId=null;
    shapeToolState.start=null;
    shapeToolState.end=null;
    removeShapePreview();
    updateToolsMenuState();
    updateShapeFormatToolbar();
    render();
  }

  function handleShapePointerDown(event){
    if(!shapeToolState.active || stageSpaceHeld || stagePanActive || event.button!==0) return;
    if(event.target?.closest?.("[data-shape-id]")) return;
    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation();
    const p=stagePointFromClient(event.clientX,event.clientY);
    shapeToolState.dragging=true;
    shapeToolState.pointerId=event.pointerId;
    shapeToolState.start={x:p.x,y:p.y};
    shapeToolState.end={x:p.x,y:p.y};
    try{svg.setPointerCapture?.(event.pointerId);}catch(_){ }
    drawShapeToolOverlay();
  }

  function handleShapePointerMove(event){
    if(!shapeToolState.dragging || event.pointerId!==shapeToolState.pointerId) return;
    event.preventDefault?.();
    const p=stagePointFromClient(event.clientX,event.clientY);
    shapeToolState.end={x:p.x,y:p.y};
    drawShapeToolOverlay();
  }

  function finishShapePointer(event){
    if(!shapeToolState.dragging || event.pointerId!==shapeToolState.pointerId) return;
    event.preventDefault?.();
    const a=shapeToolState.start;
    const b=shapeToolState.end || stagePointFromClient(event.clientX,event.clientY);
    shapeToolState.dragging=false;
    try{svg.releasePointerCapture?.(event.pointerId);}catch(_){ }
    shapeToolState.pointerId=null;
    shapeToolState.start=null;
    shapeToolState.end=null;
    removeShapePreview();
    if(!a || !b) return render();

    const x=Math.min(a.x,b.x),y=Math.min(a.y,b.y);
    const w=Math.abs(b.x-a.x),h=Math.abs(b.y-a.y);
    if(w<.08 || h<.08) return render();

    normalizeShapeAnnotations();
    const brand=normalizeBrand(shapeToolState.brand,state.brand);
    const item=normalizeShapeAnnotation({
      id:state.nextShapeId++,
      x,y,w,h,
      angle:0,
      role:shapeToolState.role,
      brand,
      color:shapeToolState.color||shapeDefaultColor(brand),
      hidden:false,locked:false
    },state.shapeAnnotations.length);
    state.shapeAnnotations.push(item);
    selectedShapeId=item.id;
    clearOtherSelectionsForShape();
    normalizeArtworkLayerOrder();
    state.artworkLayerOrder=state.artworkLayerOrder.filter(token=>token!==`shape:${item.id}`);
    state.artworkLayerOrder.push(`shape:${item.id}`);
    render();
    commitHistory();
  }

  function toggleShapeLayerVisibility(id){
    const item=shapeAnnotationById(id);
    if(!item) return;
    item.hidden=!item.hidden;
    if(item.hidden && selectedShapeId===id) selectedShapeId=null;
    render();
    commitHistory();
  }

  function toggleShapeLayerLock(id){
    const item=shapeAnnotationById(id);
    if(!item) return;
    item.locked=!item.locked;
    render();
    commitHistory();
  }

  // ---- UI -----------------------------------------------------------------
  const toolsDropdown=$("toolsDropdown");
  if(toolsDropdown && !$("shapeTool")){
    const button=document.createElement("button");
    button.id="shapeTool";
    button.type="button";
    button.setAttribute("aria-pressed","false");
    button.title="Tambah shape petak segi empat";
    button.innerHTML='<span class="tool-icon">&#9633;</span><span>Shape</span>';
    const imageButton=$("imageTool");
    toolsDropdown.insertBefore(button,imageButton||toolsDropdown.lastChild);
  }

  const lineBar=$("lineFormatToolbar");
  if(lineBar && !$("shapeFormatToolbar")){
    const bar=document.createElement("div");
    bar.id="shapeFormatToolbar";
    bar.className="image-format-toolbar";
    bar.hidden=true;
    bar.setAttribute("aria-label","Shape formatting");
    bar.innerHTML=`
      <span class="image-format-label">SHAPE</span>
      <span class="image-format-label">TYPE</span>
      <select id="shapeRole" title="Fungsi shape" style="width:118px;height:34px;padding:5px 24px 5px 8px;font-size:11px;font-weight:700">
        <option value="walkway">Walkway</option>
        <option value="main_surface">Main Surface</option>
      </select>
      <span class="image-format-label">SYSTEM</span>
      <select id="shapeBrand" title="Sistem produk" style="width:112px;height:34px;padding:5px 24px 5px 8px;font-size:11px;font-weight:700">
        <option value="duracourt">Duracourt</option>
        <option value="primacourt">Primacourt</option>
        <option value="terracourt">Terracourt</option>
      </select>
      <span class="image-format-label">COLOUR</span>
      <span id="shapeColourPreview" style="width:24px;height:24px;border:1px solid #98a2b3;border-radius:5px;display:inline-block;flex:0 0 auto"></span>
      <select id="shapeColour" title="Warna court palette" style="width:190px;height:34px;padding:5px 24px 5px 8px;font-size:11px;font-weight:700"></select>
      <span class="image-format-label">ANGLE</span>
      <input id="shapeAngle" class="image-angle-input" type="number" min="-360" max="360" step="1" value="0" title="Sudut shape dalam darjah">
      <button id="shapeRotateLeft" class="secondary" type="button" title="Pusing 90 darjah ke kiri">&#8634; 90</button>
      <button id="shapeRotateRight" class="secondary" type="button" title="Pusing 90 darjah ke kanan">&#8635; 90</button>
      <button id="shapeDuplicate" class="secondary" type="button" title="Duplicate shape">&#10799; Duplicate</button>
      <button id="shapeDelete" class="danger" type="button" title="Padam shape">Padam</button>
      <span class="image-format-hint">drag untuk buat petak; tarik bucu untuk resize; Shift semasa rotate = snap 45 darjah</span>
    `;
    lineBar.parentNode.insertBefore(bar,lineBar);
  }

  shapeToolState.color=shapeDefaultColor(shapeToolState.brand);

  // ---- Persist Shape data in every Option/Group/JSON -----------------------
  const originalCaptureCurrentOptionData=captureCurrentOptionData;
  captureCurrentOptionData=function(){
    normalizeShapeAnnotations();
    const data=originalCaptureCurrentOptionData();
    data.shapeAnnotations=cloneData(state.shapeAnnotations||[]);
    data.nextShapeId=state.nextShapeId;
    return data;
  };

  const originalNormalizeOptionData=normalizeOptionData;
  normalizeOptionData=function(option){
    const raw=option||{};
    const data=originalNormalizeOptionData(option);
    const shapes=Array.isArray(raw.shapeAnnotations)
      ? raw.shapeAnnotations.map((item,index)=>normalizeShapeAnnotation(cloneData(item),index))
      : [];
    data.shapeAnnotations=shapes;
    data.nextShapeId=Math.max(
      parseInt(raw.nextShapeId||1,10)||1,
      ...shapes.map(item=>item.id+1),
      1
    );
    return data;
  };

  const originalApplyOptionData=applyOptionData;
  applyOptionData=function(optionData){
    const data=normalizeOptionData(optionData);
    originalApplyOptionData(data);
    state.shapeAnnotations=cloneData(data.shapeAnnotations||[]);
    state.nextShapeId=data.nextShapeId||1;
    selectedShapeId=null;
    normalizeShapeAnnotations();
  };

  // ---- Artwork Layers -------------------------------------------------------
  function artworkLayerShapeTokens(){
    normalizeShapeAnnotations();
    return state.shapeAnnotations.map(item=>`shape:${item.id}`);
  }

  normalizeArtworkLayerOrder=function(value=state.artworkLayerOrder){
    const siteTokens=artworkLayerSiteTokens();
    const courtTokens=artworkLayerCourtTokens();
    const imageTokens=artworkLayerImageTokens();
    const lineTokens=artworkLayerLineTokens();
    const shapeTokens=artworkLayerShapeTokens();
    const lampTokens=(state.lampAnnotations||[]).map(item=>`lamp:${item.id}`);
    const doorTokens=(state.doorAnnotations||[]).map(item=>`door:${item.id}`);
    const fenceTokens=(state.partitionAnnotations||[]).map(item=>`partition:${item.id}`);
    const available=[...siteTokens,...courtTokens,...imageTokens,...lineTokens,...shapeTokens,...lampTokens,...doorTokens,...fenceTokens];
    const availableSet=new Set(available);
    let order=Array.isArray(value) ? value.filter(token=>typeof token==="string") : [];

    if(state.siteShapeMode==="custom" && order.includes("site:main")){
      const index=order.indexOf("site:main");
      order.splice(index,1,...siteTokens);
    }else if(state.siteShapeMode!=="custom"){
      const oldSiteIndexes=order
        .map((token,index)=>token.startsWith("site:") ? index : -1)
        .filter(index=>index>=0);
      if(oldSiteIndexes.length && !order.includes("site:main")){
        const insertAt=Math.min(...oldSiteIndexes);
        order=order.filter(token=>!token.startsWith("site:"));
        order.splice(Math.min(insertAt,order.length),0,"site:main");
      }
    }

    const seen=new Set();
    order=order.filter(token=>{
      if(!availableSet.has(token) || seen.has(token)) return false;
      seen.add(token);
      return true;
    });

    if(!order.length){
      order=[...siteTokens,...courtTokens,...imageTokens,...lineTokens,...shapeTokens,...lampTokens,...doorTokens,...fenceTokens];
    }else{
      siteTokens.forEach(token=>{
        if(order.includes(token)) return;
        let insertAt=-1;
        order.forEach((existing,index)=>{if(existing.startsWith("site:")) insertAt=index+1;});
        order.splice(insertAt>=0?insertAt:0,0,token);
      });
      [...courtTokens,...imageTokens,...lineTokens,...shapeTokens,...lampTokens,...doorTokens,...fenceTokens].forEach(token=>{
        if(!order.includes(token)) order.push(token);
      });
    }

    state.artworkLayerOrder=order;
    return order;
  };

  drawArtworkLayers=function(){
    normalizeImageAnnotations();
    normalizeLineAnnotations();
    normalizeShapeAnnotations();
    const order=normalizeArtworkLayerOrder();
    const customAreas=state.siteShapeMode==="custom"
      ? new Map(siteAreasForRender().map((area,index)=>[area.id,{area,index}]))
      : null;

    let index=0;
    while(index<order.length){
      const token=order[index];

      if(token.startsWith("court:")){
        const segment=[];
        while(index<order.length && order[index].startsWith("court:")){
          const id=parseInt(order[index].slice(6),10);
          const court=state.courts.find(item=>item.id===id);
          if(court && !court.hidden) segment.push(court);
          index++;
        }
        segment.forEach(drawCourt);
        if(state.overlayMode) segment.forEach(drawCourtLineOverlay);
        continue;
      }

      if(token==="site:main"){
        if(state.siteShapeMode!=="custom") drawRectSiteLayer();
        index++;
        continue;
      }

      if(token.startsWith("site:")){
        const id=parseInt(token.slice(5),10);
        const entry=customAreas?.get(id);
        if(entry) drawCustomSiteAreaLayer(entry.area,entry.index);
        index++;
        continue;
      }

      if(token.startsWith("image:")){
        const id=parseInt(token.slice(6),10);
        const item=state.imageAnnotations.find(image=>image.id===id);
        if(item && !item.hidden && item.src){
          const group=createImageAnnotationGroup(item);
          group.setAttribute("data-layer-token",token);
          svg.appendChild(group);
        }
        index++;
        continue;
      }

      if(token.startsWith("line:")){
        const id=parseInt(token.slice(5),10);
        const item=state.lineAnnotations.find(line=>line.id===id);
        if(item && !item.hidden && lineLength(item)>.001){
          const group=createLineAnnotationGroup(item);
          group.setAttribute("data-layer-token",token);
          svg.appendChild(group);
        }
        index++;
        continue;
      }

      if(token.startsWith("lamp:")){
        if(window.BinaCourtLighting) window.BinaCourtLighting.draw(parseInt(token.slice(5),10));
        index++;
        continue;
      }

      if(token.startsWith("door:")){
        window.BinaCourtDoors?.draw(parseInt(token.slice(5),10));
        index++;
        continue;
      }

      if(token.startsWith("partition:")){
        window.BinaCourtPartitions?.draw(parseInt(token.slice(10),10));
        index++;
        continue;
      }

      if(token.startsWith("shape:")){
        const id=parseInt(token.slice(6),10);
        const item=shapeAnnotationById(id);
        if(item && !item.hidden){
          const group=createShapeAnnotationGroup(item);
          group.setAttribute("data-layer-token",token);
          svg.appendChild(group);
        }
        index++;
        continue;
      }

      index++;
    }
  };

  const originalLayerItemInfo=layerItemInfo;
  layerItemInfo=function(token,displayIndex,total){
    if(token.startsWith("shape:")){
      const id=parseInt(token.slice(6),10);
      const item=shapeAnnotationById(id);
      if(!item) return null;
      const rankText=displayIndex===0 ? "Paling atas" : (displayIndex===total-1 ? "Paling bawah" : `Layer ${displayIndex+1}`);
      return {
        token,type:"shape",id,
        name:`${shapeRoleLabel(item.role)} Shape ${id}`,
        meta:`${item.w.toFixed(1)} x ${item.h.toFixed(1)} m - ${productBrandName(item.brand)} - Shape - ${rankText}`,
        color:item.color,
        hidden:!!item.hidden,
        locked:!!item.locked,
        active:selectedShapeId===id
      };
    }
    return originalLayerItemInfo(token,displayIndex,total);
  };

  const originalSelectArtworkLayerToken=selectArtworkLayerToken;
  selectArtworkLayerToken=function(token,event=null){
    if(token.startsWith("shape:")){
      const id=parseInt(token.slice(6),10);
      if(!shapeAnnotationById(id)) return;
      selectedShapeId=id;
      clearOtherSelectionsForShape();
      render();
      return;
    }
    selectedShapeId=null;
    originalSelectArtworkLayerToken(token,event);
  };

  syncArtworkTypeOrders=function(){
    const order=normalizeArtworkLayerOrder();

    const courtById=new Map(state.courts.map(c=>[c.id,c]));
    const orderedCourts=order.filter(token=>token.startsWith("court:"))
      .map(token=>courtById.get(parseInt(token.slice(6),10))).filter(Boolean);
    if(orderedCourts.length===state.courts.length) state.courts=orderedCourts;

    const imageById=new Map(state.imageAnnotations.map(item=>[item.id,item]));
    const orderedImages=order.filter(token=>token.startsWith("image:"))
      .map(token=>imageById.get(parseInt(token.slice(6),10))).filter(Boolean);
    if(orderedImages.length===state.imageAnnotations.length) state.imageAnnotations=orderedImages;

    const lineById=new Map(state.lineAnnotations.map(item=>[item.id,item]));
    const orderedLines=order.filter(token=>token.startsWith("line:"))
      .map(token=>lineById.get(parseInt(token.slice(5),10))).filter(Boolean);
    if(orderedLines.length===state.lineAnnotations.length) state.lineAnnotations=orderedLines;

    const shapeById=new Map(state.shapeAnnotations.map(item=>[item.id,item]));
    const orderedShapes=order.filter(token=>token.startsWith("shape:"))
      .map(token=>shapeById.get(parseInt(token.slice(6),10))).filter(Boolean);
    if(orderedShapes.length===state.shapeAnnotations.length) state.shapeAnnotations=orderedShapes;
  };

  updateCourtList=function(){
    const list=$("courtList");
    if(!list) return;
    list.innerHTML="";
    updateMeasurementLayerList();

    const order=normalizeArtworkLayerOrder();
    const displayTokens=order.slice().reverse();
    if(!displayTokens.length){
      list.innerHTML='<div class="hint">Belum ada Site, Court, Image, Line atau Shape.</div>';
      return;
    }

    displayTokens.forEach((token,index)=>{
      const info=layerItemInfo(token,index,displayTokens.length);
      if(!info) return;
      const item=document.createElement("div");
      item.className=`court-item artwork-layer-item ${info.active?"active":""} ${info.hidden?"hidden-layer":""} ${info.locked?"locked-layer":""}`;
      item.dataset.layerToken=token;
      // Use simple, readable separators for court measurements.
      const layerMeta=info.type==="court"
        ? (()=>{
            const court=state.courts.find(c=>c.id===info.id);
            if(!court) return String(info.meta||"");
            const rank=index===0 ? "Paling atas"
              : index===displayTokens.length-1 ? "Paling bawah" : "Layer "+(index+1);
            return Number(court.w).toFixed(1)+" x "+Number(court.h).toFixed(1)+" m | Court | "+rank;
          })()
        : String(info.meta||"").replace(/\uFFFD/g," | ");
      const marker=info.icon
        ? `<span style="width:16px;display:inline-flex;justify-content:center">${info.icon}</span>`
        : `<span class="court-dot" style="background:${info.color||"#7b7e82"}"></span>`;
      item.innerHTML=`
        <button type="button" class="layer-handle" aria-label="Drag layer" ${info.locked?"disabled":""} title="${info.locked?"Unlock dahulu untuk ubah susunan layer":"Drag untuk ubah susunan layer"}">&#8801;</button>
        <span class="layer-main">
          <span class="layer-name">${marker}${escapeHtml(info.name)}${info.locked?" - Locked":""}${info.hidden?" - Hidden":""}</span>
          <span class="layer-meta">${escapeHtml(layerMeta)}</span>
        </span>
        <span class="layer-actions">
          ${info.staticActions?"":`
          <button type="button" class="layer-visibility ${info.hidden?"hide-active":""}" title="${info.hidden?"Show layer":"Hide layer"}" aria-label="${info.hidden?"Show layer":"Hide layer"}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.7"/></svg></button>
          <button type="button" class="layer-lock ${info.locked?"lock-active":""}" title="${info.locked?"Unlock layer":"Lock layer"}" aria-label="${info.locked?"Unlock layer":"Lock layer"}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="${info.locked?"M8 10V7a4 4 0 0 1 8 0v3":"M8 10V7a4 4 0 0 1 8 0"}"/></svg></button>
          `}
        </span>
      `;

      item.querySelector(".layer-visibility")?.addEventListener("click",e=>{
        e.preventDefault();e.stopPropagation();
        if(info.type==="court") toggleCourtVisibility(info.id);
        else if(info.type==="image") toggleImageLayerVisibility(info.id);
        else if(info.type==="line") toggleLineLayerVisibility(info.id);
        else if(info.type==="site") toggleSiteAreaLayerVisibility(info.id);
        else if(info.type==="shape") toggleShapeLayerVisibility(info.id);
      });
      item.querySelector(".layer-lock")?.addEventListener("click",e=>{
        e.preventDefault();e.stopPropagation();
        if(info.type==="court") toggleCourtLock(info.id);
        else if(info.type==="image") toggleImageLayerLock(info.id);
        else if(info.type==="line") toggleLineLayerLock(info.id);
        else if(info.type==="site") toggleSiteAreaLayerLock(info.id);
        else if(info.type==="shape") toggleShapeLayerLock(info.id);
      });
      item.addEventListener("click",e=>{
        if(e.target.closest(".layer-handle,.layer-actions")) return;
        selectArtworkLayerToken(token,e);
      });
      if(!info.locked) enableArtworkLayerDrag(item,token);
      list.appendChild(item);
    });
  };

  // ---- PDF / colour description integration --------------------------------
  const originalCollectUsedColors=collectUsedColors;
  collectUsedColors=function(){
    const used=originalCollectUsedColors();
    normalizeShapeAnnotations();
    state.shapeAnnotations.filter(item=>!item.hidden).forEach(shape=>{
      const brand=normalizeBrand(shape.brand,state.brand);
      const palette=shapePalette(brand);
      const info=colorInfo(shape.color,palette);
      if(!info) return;
      const usage=shapeRoleLabel(shape.role);
      const existing=used.find(item=>
        item.color===info.color && item.kind==="surface" && item.brand===brand
      );
      if(existing){
        const text=String(existing.usage||"");
        const hasRole=usage==="Walkway"
          ? /walkway/i.test(text)
          : /main surface/i.test(text);
        if(!hasRole) existing.usage=text?`${text} / ${usage}`:usage;
      }else{
        used.push({...info,usage,kind:"surface",brand,lineDetails:undefined});
      }
    });
    return used;
  };

  if(typeof visibleSurfacePairs==="function"){
    const originalVisibleSurfacePairs=visibleSurfacePairs;
    visibleSurfacePairs=function(){
      const pairs=originalVisibleSurfacePairs();
      normalizeShapeAnnotations();
      state.shapeAnnotations.filter(item=>!item.hidden).forEach(shape=>{
        const color=normalizeHexColor(shape.color);
        if(!color) return;
        const brand=normalizeBrand(shape.brand,state.brand);
        const key=surfaceLegendKey(brand,color);
        if(!pairs.has(key)){
          pairs.set(key,{
            key,hex:color,brand,
            name:colorInfo(color,getDefaultPaletteForBrand(brand))?.name || color.toUpperCase()
          });
        }
      });
      return pairs;
    };
  }

  // ---- Render and tools integration -----------------------------------------
  const originalRender=render;
  render=function(options={}){
    normalizeShapeAnnotations();
    originalRender(options);
    drawShapeToolOverlay();
    updateShapeFormatToolbar();
  };

  const originalUpdateToolsMenuState=updateToolsMenuState;
  updateToolsMenuState=function(){
    originalUpdateToolsMenuState();
    const button=$("shapeTool");
    if(button){
      button.classList.toggle("is-active",!!shapeToolState.active);
      button.setAttribute("aria-pressed",shapeToolState.active?"true":"false");
    }
    const main=$("toolsMenuButton");
    if(main && shapeToolState.active){
      main.classList.add("tool-active");
      main.title="Tools - Shape aktif";
    }
  };

  const originalUpdateStageCursor=updateStageCursor;
  updateStageCursor=function(){
    originalUpdateStageCursor();
    const wrap=$("stageWrap");
    if(!wrap) return;
    if(shapeToolState.active && !stageSpaceHeld && !stagePanActive && !stageTouchPanMode){
      wrap.style.cursor="crosshair";
    }
  };

  // ---- Events ---------------------------------------------------------------
  $("shapeTool")?.addEventListener("click",()=>{
    setShapeToolActive(!shapeToolState.active);
    if($("toolsDropdown")) $("toolsDropdown").hidden=true;
    $("toolsMenuButton")?.setAttribute("aria-expanded","false");
  });

  ["lineTool","measureTool","textTool","imageTool","touchPanTool"].forEach(id=>{
    $(id)?.addEventListener("click",()=>{
      if(!shapeToolState.active) return;
      shapeToolState.active=false;
      shapeToolState.dragging=false;
      shapeToolState.start=null;
      shapeToolState.end=null;
      removeShapePreview();
      updateShapeFormatToolbar();
    },true);
  });

  $("shapeRole")?.addEventListener("change",event=>applyShapeRole(event.target.value,{commit:true}));
  $("shapeBrand")?.addEventListener("change",event=>applyShapeBrand(event.target.value,{commit:true}));
  $("shapeColour")?.addEventListener("change",event=>applyShapeColour(event.target.value,{commit:true}));
  $("shapeAngle")?.addEventListener("input",event=>setSelectedShapeAngle(event.target.value));
  $("shapeAngle")?.addEventListener("change",event=>setSelectedShapeAngle(event.target.value,{commit:true}));
  $("shapeRotateLeft")?.addEventListener("click",()=>rotateSelectedShape(-90));
  $("shapeRotateRight")?.addEventListener("click",()=>rotateSelectedShape(90));
  $("shapeDuplicate")?.addEventListener("click",duplicateSelectedShape);
  $("shapeDelete")?.addEventListener("click",()=>{
    if(selectedShapeId!==null) deleteShapeAnnotation(selectedShapeId);
  });

  svg.addEventListener("pointerdown",handleShapePointerDown,true);
  svg.addEventListener("pointermove",handleShapePointerMove,true);
  svg.addEventListener("pointerup",finishShapePointer,true);
  svg.addEventListener("pointercancel",finishShapePointer,true);

  // Clicking another canvas object clears Shape selection before that object's
  // own handler runs, so only one editing toolbar stays active.
  svg.addEventListener("pointerdown",event=>{
    if(event.target?.closest?.("[data-shape-id]")) return;
    if(shapeToolState.active) return;
    selectedShapeId=null;
  },true);

  document.addEventListener("keydown",event=>{
    const editable=stageKeyTargetIsEditable(event.target);
    if(event.key==="Escape" && shapeToolState.dragging){
      event.preventDefault();
      shapeToolState.dragging=false;
      shapeToolState.pointerId=null;
      shapeToolState.start=null;
      shapeToolState.end=null;
      removeShapePreview();
      return;
    }
    if(event.key==="Escape" && shapeToolState.active && !editable){
      event.preventDefault();
      setShapeToolActive(false);
      return;
    }
    if(!editable && selectedShapeId!==null && (event.ctrlKey||event.metaKey) && event.key.toLowerCase()==="d"){
      event.preventDefault();
      event.stopImmediatePropagation();
      duplicateSelectedShape();
      return;
    }
    if(!editable && selectedShapeId!==null && (event.key==="Delete"||event.key==="Backspace")){
      const item=shapeAnnotationById(selectedShapeId);
      if(item && !item.locked){
        event.preventDefault();
        event.stopImmediatePropagation();
        deleteShapeAnnotation(item.id);
      }
    }
  },true);

  window.__resetShapeToolState=function(){
    state.shapeAnnotations=[];
    state.nextShapeId=1;
    selectedShapeId=null;
    shapeToolState.active=false;
    shapeToolState.dragging=false;
    shapeToolState.pointerId=null;
    shapeToolState.start=null;
    shapeToolState.end=null;
    removeShapePreview();
  };

  // Initial normalisation after the legacy app has loaded.
  normalizeShapeAnnotations();
  normalizeArtworkLayerOrder();
  updateToolsMenuState();
  updateShapeFormatToolbar();
})();

</script>
