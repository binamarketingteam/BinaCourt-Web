          changed=true;
        }
        if(sp.token.startsWith("site:")&&String(item.id)===String(state.activeSiteAreaId)){
          state.siteColor=colour;
        }
      });
      if(changed){
        render();
        commitHistory();
      }
    }
    palette.addEventListener("change",()=>applyColour(palette.value));
    custom.addEventListener("change",()=>applyColour(custom.value));
    return bar;
  }
  function updateGroupColourEditor(){
    const bar=ensureGroupColourEditor();
    if(!bar)return;
    const tokens=[...chosen].filter(valid);
    bar.hidden=tokens.length<2;
    bar.style.display=tokens.length<2?"none":"flex";
    if(tokens.length<2)return;
    const kind=document.getElementById("artworkColourKind");
    const palette=document.getElementById("artworkColourPalette");
    const custom=document.getElementById("artworkColourFree");
    const note=document.getElementById("artworkColourNote");
    const options=compatibleColourOptions();
    const previous=kind.value;
    kind.replaceChildren();
    for(const option of options){
      const el=document.createElement("option");
      el.value=option.key;
      el.textContent=option.label;
      kind.appendChild(el);
    }
    const active=options.find(o=>o.key===previous)||options[0]||null;
    if(active)kind.value=active.key;
    const locked=tokens.some(token=>itemFor(token)?.locked);
    kind.disabled=locked||!options.length;
    palette.replaceChildren();
    if(active?.palette){
      const placeholder=document.createElement("option");
      placeholder.value="";
      placeholder.textContent="Pilih warna";
      palette.appendChild(placeholder);
      active.palette.forEach(item=>{
        const hex=normalizeHexColor(item.color);
        if(!hex)return;
        const opt=document.createElement("option");
        opt.value=hex;
        opt.textContent=item.name;
        palette.appendChild(opt);
      });
    }
    const first=active?.specs[0];
    const same=first&&active.specs.every(sp=>
      normalizeHexColor(sp.obj[sp.prop])===normalizeHexColor(first.obj[first.prop]));
    const current=same?normalizeHexColor(first.obj[first.prop]):"";
    const listed=active?.palette?.some(item=>normalizeHexColor(item.color)===current);
    palette.value=listed?current:"";
    palette.hidden=!active?.palette;
    palette.disabled=locked||!active?.palette?.length;
    custom.hidden=!!active?.palette||!active;
    custom.disabled=locked||!active;
    if(current&&!active?.palette&&document.activeElement!==custom)custom.value=current;
    else if(!current&&!active?.palette&&document.activeElement!==custom){
      custom.value=normalizeHexColor(first?.obj[first?.prop])||"#ffffff";
    }
    note.textContent=locked?"Unlock semua objek sebelum edit."
      :!options.length?"Objek ini tiada bahagian warna serasi. Pilih kumpulan warna yang sama."
      :active?.palette&&!active.palette.length?"Tiada kod warna sama untuk sistem produk ini."
      :"Tukar "+tokens.length+" objek sekaligus";
    // Native court / free-shape colour panels remain available for legacy
    // operations, but the unified editor is the consistent source of truth.
    const legacyCourt=document.getElementById("bulkCourtColourToolbar");
    const legacyFree=document.getElementById("bulkFreeShapeColourToolbar");
    if(legacyCourt){legacyCourt.hidden=true;legacyCourt.style.display="none";}
    if(legacyFree){legacyFree.hidden=true;legacyFree.style.display="none";}
  }

  // Drag any selected group as one world-space transaction. Snapshot all
  // coordinates first to avoid cumulative errors and commit only on release.
  function movementSnapshot(token){
    if(token==="site:main")return null;
    const obj=itemFor(token);
    if(!obj||obj.locked||obj.hidden)return null;
    const type=token.split(":")[0];
    if(type==="site"&&Array.isArray(obj.polygon)&&obj.polygon.length){
      return {token,kind:"polygon",base:obj.polygon.map(p=>({...p}))};
    }
    if(Number.isFinite(obj.x)&&Number.isFinite(obj.y)){
      return {token,kind:"xy",base:{x:obj.x,y:obj.y}};
    }
    if(obj.start&&obj.end&&Number.isFinite(obj.start.x)&&Number.isFinite(obj.end.x)){
      return {token,kind:"ends",base:{start:{...obj.start},end:{...obj.end}}};
    }
    if(Array.isArray(obj.points)&&obj.points.length&&
       obj.points.every(p=>Number.isFinite(p.x)&&Number.isFinite(p.y))){
      return {token,kind:"points",base:obj.points.map(p=>({...p}))};
    }
    if(Number.isFinite(obj.cx)&&Number.isFinite(obj.cy)){
      return {token,kind:"center",base:{cx:obj.cx,cy:obj.cy}};
    }
    if(obj.position&&Number.isFinite(obj.position.x)&&Number.isFinite(obj.position.y)){
      return {token,kind:"position",base:{...obj.position}};
    }
    return null;
  }
  function moveSnapshot(snapshot,dx,dy){
    const obj=itemFor(snapshot.token);
    if(!obj)return;
    const base=snapshot.base;
    if(snapshot.kind==="xy"){
      obj.x=base.x+dx;obj.y=base.y+dy;
    }else if(snapshot.kind==="ends"){
      obj.start={...base.start,x:base.start.x+dx,y:base.start.y+dy};
      obj.end={...base.end,x:base.end.x+dx,y:base.end.y+dy};
    }else if(snapshot.kind==="polygon"||snapshot.kind==="points"){
      obj[snapshot.kind==="polygon"?"polygon":"points"]=base.map(p=>
        ({...p,x:p.x+dx,y:p.y+dy}));
      if(snapshot.kind==="polygon"&&String(obj.id)===String(state.activeSiteAreaId)){
        state.sitePolygon=obj.polygon.map(p=>({...p}));
      }
    }else if(snapshot.kind==="center"){
      obj.cx=base.cx+dx;obj.cy=base.cy+dy;
    }else if(snapshot.kind==="position"){
      obj.position={...base,x:base.x+dx,y:base.y+dy};
    }
  }
  function beginGroupMove(event,clickedToken){
    const tokens=[...chosen].filter(valid);
    if(tokens.length<2||!chosen.has(clickedToken))return false;
    if(tokens.some(token=>itemFor(token)?.locked)){
      alert("Ada objek Locked dalam selection. Unlock dahulu untuk gerakkan kumpulan.");
      event.preventDefault();
      event.stopImmediatePropagation();
      return true;
    }
    const snapshots=tokens.map(movementSnapshot);
    if(snapshots.some(shot=>!shot)){
      alert("Objek ini belum mempunyai koordinat yang boleh digerakkan bersama.");
      event.preventDefault();
      event.stopImmediatePropagation();
      return true;
    }
    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation();
    const down={x:event.clientX,y:event.clientY};
    const start=stagePointFromClient(down.x,down.y);
    const pointerId=event.pointerId;
    const isPickMode=multiPickMode;
    const target=event.target;
    let moved=false,dx=0,dy=0;
    // Move the live SVG nodes WITHOUT rendering/replacing the pointer target.
    // Re-rendering during drag used to drop pointer capture and move one item.
    const elements=[];
    for(const shot of snapshots){
      for(const node of selectedNodes(shot.token)){
        elements.push({node,base:node.getAttribute("transform")||""});
      }
    }
    for(const node of svg.querySelectorAll(".unified-multi-selection")){
      if(chosen.has(node.getAttribute("data-selected-token"))){
        elements.push({node,base:node.getAttribute("transform")||""});
      }
    }
    function showMove(){
      const offset="translate("+dx+" "+dy+")";
      elements.forEach(({node,base})=>{
        if(node.isConnected)node.setAttribute("transform",offset+(base?" "+base:""));
      });
    }
    function onMove(e){
      if(e.pointerId!==pointerId)return;
      if(typeof stagePinchActive!=="undefined"&&stagePinchActive)return;
      const distance=Math.hypot(e.clientX-down.x,e.clientY-down.y);
      if(!moved&&distance<(e.pointerType==="touch"?8:4))return;
      moved=true;
      e.preventDefault();
      e.stopPropagation();
      const point=stagePointFromClient(e.clientX,e.clientY);
      dx=point.x-start.x;
      dy=point.y-start.y;
      showMove();
    }
    function finish(e){
      if(e.pointerId!==pointerId)return;
      e.preventDefault();
      e.stopImmediatePropagation();
      window.removeEventListener("pointermove",onMove,true);
      window.removeEventListener("pointerup",finish,true);
      window.removeEventListener("pointercancel",finish,true);
      try{target.releasePointerCapture?.(pointerId)}catch(_){}
      if(e.type==="pointercancel"){
        render();
      }else if(moved){
        snapshots.forEach(shot=>moveSnapshot(shot,dx,dy));
        render();
        commitHistory();
      }else if(isPickMode){
        toggle(clickedToken);
      }else{
        render();
      }
    }
    window.addEventListener("pointermove",onMove,true);
    window.addEventListener("pointerup",finish,true);
    window.addEventListener("pointercancel",finish,true);
    try{target.setPointerCapture?.(pointerId)}catch(_){}
    return true;
  }

  function selectedNodes(token){
    const [type]=token.split(":");
    const id=token.slice(type.length+1);
    const groups=[...svg.querySelectorAll("[data-layer-token]")]
      .filter(el=>el.getAttribute("data-layer-token")===token);
    if(groups.length)return groups;
    const attr=nodeAttrs[type];
    return attr?[...svg.querySelectorAll("["+attr+"]")]
      .filter(el=>el.getAttribute(attr)===id):[];
  }
  function selectedBounds(token){
    const all=[];
    for(const node of selectedNodes(token)){
      const source=node.querySelector?.(".shape-content,.image-content,.line-content,.text-content")||node;
      try{
        const b=source.getBBox(),m=source.getScreenCTM(),inv=svg.getScreenCTM()?.inverse();
        if(!m||!inv)continue;
        function p(x,y){
          const sx=m.a*x+m.c*y+m.e,sy=m.b*x+m.d*y+m.f;
          return {x:inv.a*sx+inv.c*sy+inv.e,y:inv.b*sx+inv.d*sy+inv.f};
        }
        all.push(p(b.x,b.y),p(b.x+b.width,b.y),
          p(b.x+b.width,b.y+b.height),p(b.x,b.y+b.height));
      }catch(_){}
    }
    if(!all.length)return null;
    return {left:Math.min(...all.map(v=>v.x)),top:Math.min(...all.map(v=>v.y)),
      right:Math.max(...all.map(v=>v.x)),bottom:Math.max(...all.map(v=>v.y))};
  }
  function drawHighlight(){
    svg.querySelectorAll(".unified-multi-selection").forEach(el=>el.remove());
    if(!chosen.size)return;
    const px=(svg.viewBox?.baseVal?.width||state.siteW||40)/
      Math.max(1,svg.getBoundingClientRect().width);
    let index=0;
    for(const token of chosen){
      const b=selectedBounds(token);
      if(!b)continue;
      index++;
      const x=b.left-4*px,y=b.top-4*px;
      const w=Math.max(b.right-b.left+8*px,14*px);
      const h=Math.max(b.bottom-b.top+8*px,14*px);
      const group=ns("g",{class:"unified-multi-selection editing-only",
        "pointer-events":"none","data-selected-token":token});
      group.appendChild(ns("rect",{x,y,width:w,height:h,fill:"#2563eb",
        "fill-opacity":".04",stroke:"#111111","stroke-width":"2",
        "vector-effect":"non-scaling-stroke","pointer-events":"none"}));
      group.appendChild(ns("rect",{x,y,width:w,height:h,fill:"none",
        stroke:"#ffffff","stroke-width":"2","stroke-dasharray":"5 5",
        "vector-effect":"non-scaling-stroke","pointer-events":"none"}));
      for(const [cx,cy] of [[x,y],[x+w,y],[x,y+h],[x+w,y+h]]){
        group.appendChild(ns("rect",{
          x:cx-3*px,y:cy-3*px,width:6*px,height:6*px,rx:px,
          fill:"#ffffff",stroke:"#2563eb","stroke-width":"1.5",
          "vector-effect":"non-scaling-stroke","pointer-events":"none"
        }));
      }
      group.appendChild(ns("rect",{x,y:y-16*px,width:23*px,height:14*px,rx:3*px,
        fill:"#2563eb","pointer-events":"none"}));
      const text=ns("text",{x:x+11.5*px,y:y-9*px,"text-anchor":"middle",
        "dominant-baseline":"middle","font-size":10*px,"font-weight":"700",
        fill:"#ffffff","pointer-events":"none"});
      text.textContent=String(index);
      group.appendChild(text);
      svg.appendChild(group);
    }
  }
  function decorateLayerRows(){
    const list=document.getElementById("courtList");
    if(!list)return;
    list.querySelectorAll("[data-layer-token]").forEach(row=>{
      const isSelected=chosen.has(row.dataset.layerToken);
      if(!isSelected&&chosen.size){
        row.classList.remove("active");
        row.style.boxShadow="";
        row.style.background="";
      }
      if(!isSelected)return;
      row.classList.add("active");
      row.style.boxShadow="inset 3px 0 #2563eb";
      row.style.background="#eff6ff";
      row.setAttribute("aria-selected","true");
      const caption=row.querySelector(".layer-name");
      if(caption&&!caption.querySelector(".unified-layer-check")){
        const tick=document.createElement("span");
        tick.className="unified-layer-check";
        tick.textContent="✓ ";
        tick.style.cssText="color:#1d4ed8;font-weight:900;margin-right:4px";
        caption.insertBefore(tick,caption.firstChild);
      }
    });
  }
  function syncNativeGroupsIntoDisplay(){
    // Native touch long-press & Shape Bebas Select All should retain highlights.
    if(chosen.size>1)return;
    const courts=selectedCourts();
    if(courts.length>1){
      chosen.clear();
      courts.forEach(c=>chosen.add("court:"+c.id));
      return;
    }
    if(selectedFreeShapeIds.size>1){
      chosen.clear();
      selectedFreeShapeIds.forEach(id=>chosen.add("shape:"+id));
    }
  }
  function refreshSelection(){
    prune();
    syncNativeGroupsIntoDisplay();
    updateToolbar();
    updateGroupColourEditor();
    decorateLayerRows();
    drawHighlight();
  }
  const renderBeforeUnified=render;
  render=function(options={}){
    const result=renderBeforeUnified(options);
    refreshSelection();
    return result;
  };
  // Capture selection gestures before native per-object drag handlers.
  svg.addEventListener("pointerdown",event=>{
    if(event.button!==0||stageSpaceHeld||stagePanActive||stageTouchPanMode)return;
    const token=tokenFromTarget(event.target);
    const explicitToggle=event.shiftKey||event.ctrlKey||event.metaKey;
    const moveGroup=token&&chosen.size>1&&chosen.has(token)&&!explicitToggle;
    if(moveGroup){
      const handle=event.target.closest?.(
        ".image-resize-hit,.image-rotate-handle,.shape-resize-hit,"+
        ".shape-rotate-handle,.line-endpoint-hit,.measure-handle-start,"+
        ".measure-handle-end,.court-resize-handle"
      );
      if(!handle){
        if(beginGroupMove(event,token))return;
      }
    }
    if(multiPickMode||explicitToggle){
      if(!token||token==="site:main"){
        if(multiPickMode&&token==="site:main"){
          event.preventDefault();
          event.stopImmediatePropagation();
        }
        return;
      }
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation();
      toggle(token);
      return;
    }
    if(!token||token==="site:main"){
      chosen.clear();
    }else{
      const allSameType=[...chosen].every(t=>t.split(":")[0]===token.split(":")[0]);
      const groupDrag=chosen.size>1&&chosen.has(token)&&allSameType&&
        (token.startsWith("court:")||token.startsWith("shape:"));
      if(!groupDrag){chosen.clear();chosen.add(token);}
    }
    requestAnimationFrame(refreshSelection);
  },true);
  const list=document.getElementById("courtList");
  list?.addEventListener("click",event=>{
    if(event.target.closest(".layer-handle,.layer-actions"))return;
    const row=event.target.closest("[data-layer-token]");
    if(!row)return;
    const token=row.dataset.layerToken;
    const additive=multiPickMode||event.shiftKey||event.ctrlKey||event.metaKey;
    if(additive){
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation();
      toggle(token);
    }else{
      chosen.clear();
      if(valid(token))chosen.add(token);
      requestAnimationFrame(refreshSelection);
    }
  },true);
  document.getElementById("freeShapeSelectAllButton")?.addEventListener("click",()=>{
    chosen.clear();
    (state.shapeAnnotations||[]).filter(s=>s.decorative&&!s.hidden&&!s.locked)
      .forEach(s=>chosen.add("shape:"+s.id));
    requestAnimationFrame(refreshSelection);
  });
  window.addEventListener("keydown",event=>{
    if(event.key!=="Escape"||!chosen.size)return;
    if(event.target?.isContentEditable||
       /^(INPUT|TEXTAREA|SELECT)$/.test(event.target?.tagName||""))return;
    multiPickMode=false;
    clear();
  },true);
  window.BinaCourtMultiSelection={
    get tokens(){return [...chosen];},
    clear,selectAll,
    pick(token){toggle(token);}
  };
  refreshSelection();
})();

</script>

.shape-annotation .shape-selection-ants { stroke:#fff !important; stroke-width:1.8px !important; stroke-dasharray:5px 5px !important; vector-effect:non-scaling-stroke; animation:binaShapeMarch 0.65s linear infinite; }
.shape-annotation .shape-selection { pointer-events:none !important; }
.shape-annotation .shape-resize-knob { stroke:#111 !important; stroke-width:1.3px !important; vector-effect:non-scaling-stroke; }
@keyframes binaShapeMarch { to { stroke-dashoffset:-10px; } }
