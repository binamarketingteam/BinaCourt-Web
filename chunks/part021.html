<script>
(function(){
  // ------------------------------------------------------------
  // Shape Tool - editable rectangle surface artwork.
  // Supports Walkway/Main Surface roles, Duracourt/Primacourt/Terracourt,
  // court surface palette colours, resize/move/rotate/delete/duplicate,
  // Layers ordering, JSON/Option persistence and PDF colour descriptions.
  // ------------------------------------------------------------

  if(!Array.isArray(state.shapeAnnotations)) state.shapeAnnotations=[];
  if(!Number.isFinite(Number(state.nextShapeId))) state.nextShapeId=1;

  let selectedShapeId=null;
  // Multi-selection applies only to decorative "Shape Bebas" layers.
  const selectedFreeShapeIds=new Set();
  window.__clearBinaShapeSelection=()=>{
    selectedShapeId=null;
    selectedFreeShapeIds.clear();
  };
  const shapeToolState={
    active:false,
    dragging:false,
    pointerId:null,
    start:null,
    end:null,
    startClient:null,
    role:"walkway",
    brand:normalizeBrand(state.brand,"duracourt"),
    color:"",
    normalColor:"",
    decorative:false,
    freeColor:"#a53531",
    freeColourDirty:false
  };

  function normalizeShapeRole(value){
    return value==="main_surface" || value==="line" ? value : "walkway";
  }

  function normalizeShapeAngle(value){
    let angle=Number(value);
    if(!Number.isFinite(angle)) angle=0;
    angle=((angle%360)+360)%360;
    if(angle>180) angle-=360;
    return angle;
  }

  function shapePalette(brand){
    const normalized=normalizeBrand(brand,state.brand||"duracourt");
    return getDefaultPaletteForBrand(normalized).filter(item=>normalizeHexColor(item?.color));
  }

  function shapeDefaultColor(brand){
    const palette=shapePalette(brand);
    const site=normalizeHexColor(state.siteColor);
    if(site && palette.some(item=>normalizeHexColor(item.color)===site)) return site;
    return normalizeHexColor(palette[0]?.color) || "#7b7e82";
  }

  function normalizeShapeAnnotation(item,index=0){
    const raw=item && typeof item==="object" ? item : {};
    const decorative=raw.decorative===true;
    // Decoration is just visual SVG artwork; never assign a product,
    // palette or surface function to it.
    const brand=decorative ? null : normalizeBrand(raw.brand,state.brand||"duracourt");
    const palette=decorative ? [] : shapePalette(brand);
    const requested=normalizeHexColor(raw.color);
    const color=decorative
      ? (requested||"#a53531")
      : (requested && palette.some(entry=>normalizeHexColor(entry.color)===requested)
          ? requested
          : shapeDefaultColor(brand));
    let w=Number(raw.w), h=Number(raw.h);
    if(!Number.isFinite(w) || w<=0) w=4;
    if(!Number.isFinite(h) || h<=0) h=3;
    return {
      id:Math.max(1,parseInt(raw.id,10)||(index+1)),
      x:Number.isFinite(Number(raw.x)) ? Number(raw.x) : 0,
      y:Number.isFinite(Number(raw.y)) ? Number(raw.y) : 0,
      w:Math.max(.15,w),
      h:Math.max(.15,h),
      angle:normalizeShapeAngle(raw.angle),
      role:decorative ? "decorative" : normalizeShapeRole(raw.role),
      brand,
      decorative,
      color,
      hidden:!!raw.hidden,
      locked:!!raw.locked
    };
  }

  function normalizeShapeAnnotations(){
    state.shapeAnnotations=Array.isArray(state.shapeAnnotations)
      ? state.shapeAnnotations.map((item,index)=>{
          const normalized=normalizeShapeAnnotation(item,index);
          if(item && typeof item==="object"){
            Object.assign(item,normalized);
            return item;
          }
          return normalized;
        })
      : [];
    const used=new Set();
    state.shapeAnnotations.forEach(item=>{
      while(used.has(item.id)) item.id++;
      used.add(item.id);
    });
    state.nextShapeId=Math.max(
      parseInt(state.nextShapeId||1,10)||1,
      ...state.shapeAnnotations.map(item=>item.id+1),
      1
    );
    if(selectedShapeId!==null && !state.shapeAnnotations.some(item=>item.id===selectedShapeId)){
      selectedShapeId=null;
    }
    const eligible=new Set(state.shapeAnnotations.filter(item=>item.decorative&&!item.hidden&&!item.locked).map(item=>item.id));
    for(const id of selectedFreeShapeIds) if(!eligible.has(id))selectedFreeShapeIds.delete(id);
    if(selectedFreeShapeIds.size && !selectedFreeShapeIds.has(selectedShapeId))
      selectedShapeId=[...selectedFreeShapeIds].at(-1);
    return state.shapeAnnotations;
  }

  function shapeAnnotationById(id){
    normalizeShapeAnnotations();
    return state.shapeAnnotations.find(item=>item.id===id)||null;
  }

  function shapeRoleLabel(role){
    const normalized=normalizeShapeRole(role);
    if(normalized==="main_surface") return "Main Surface";
    if(normalized==="line") return "Line";
    return "Walkway";
  }

  function clearOtherSelectionsForShape(){
    selectedImageId=null;
    selectedTextId=null;
    selectedMeasurementId=null;
    selectedLineId=null;
    clearCourtSelection();
    closeMeasureInlineEditor(false);
    closeTextInlineEditor(false);
  }

  function shapeGroupTransform(item){
    const angle=normalizeShapeAngle(item?.angle);
    if(!angle) return "";
    const cx=(Number(item.x)||0)+(Number(item.w)||0)/2;
    const cy=(Number(item.y)||0)+(Number(item.h)||0)/2;
    return `rotate(${angle} ${cx} ${cy})`;
  }

  function worldPointToShapeLocal(point,item){
    const angle=-normalizeShapeAngle(item?.angle)*Math.PI/180;
    if(Math.abs(angle)<1e-9) return {x:point.x,y:point.y};
    const cx=item.x+item.w/2, cy=item.y+item.h/2;
    const dx=point.x-cx, dy=point.y-cy;
    return {
      x:cx+dx*Math.cos(angle)-dy*Math.sin(angle),
      y:cy+dx*Math.sin(angle)+dy*Math.cos(angle)
    };
  }

  function shapeResizeHitWorldSize(){
    return Math.max(.38,Math.min(1.0,(courtViewport?.w||40)*.018));
  }

  function updateShapeAnnotationGroup(group,item){
    const transform=shapeGroupTransform(item);
    if(transform) group.setAttribute("transform",transform); else group.removeAttribute("transform");

    const rect=group.querySelector(".shape-content");
    if(rect){
      rect.setAttribute("x",item.x);
      rect.setAttribute("y",item.y);
      rect.setAttribute("width",item.w);
      rect.setAttribute("height",item.h);
      rect.setAttribute("fill",item.color);
    }
    const hit=group.querySelector(".shape-hit-area");
    if(hit){
      hit.setAttribute("x",item.x);
      hit.setAttribute("y",item.y);
      hit.setAttribute("width",item.w);
      hit.setAttribute("height",item.h);
    }
    // Keep both Photoshop-style selection strokes aligned while resizing.
    group.querySelectorAll(".shape-selection").forEach(sel=>{
      sel.setAttribute("x",item.x);
      sel.setAttribute("y",item.y);
      sel.setAttribute("width",item.w);
      sel.setAttribute("height",item.h);
    });

    const handles={
      nw:[item.x,item.y],
      ne:[item.x+item.w,item.y],
      sw:[item.x,item.y+item.h],
      se:[item.x+item.w,item.y+item.h]
    };
    const hitSize=shapeResizeHitWorldSize();
    const knobSize=Math.max(.09,Math.min(.40,hitSize*.40));
    Object.entries(handles).forEach(([key,[x,y]])=>{
      const touch=group.querySelector(`.shape-resize-hit[data-handle="${key}"]`);
      if(touch){
        touch.setAttribute("x",x-hitSize/2);
        touch.setAttribute("y",y-hitSize/2);
        touch.setAttribute("width",hitSize);
        touch.setAttribute("height",hitSize);
      }
      const knob=group.querySelector(`.shape-resize-knob[data-handle="${key}"]`);
      if(knob){
        knob.setAttribute("x",x-knobSize/2);
        knob.setAttribute("y",y-knobSize/2);
        knob.setAttribute("width",knobSize);
        knob.setAttribute("height",knobSize);
        knob.setAttribute("rx",knobSize*.10);
      }
    });

    const rotateGap=Math.max(.7,Math.min(1.2,item.h*.18));
    const rotateX=item.x+item.w;
    const rotateY=item.y-rotateGap;
    const connector=group.querySelector(".shape-rotate-connector");
    if(connector){
      connector.setAttribute("x1",item.x+item.w);
      connector.setAttribute("y1",item.y);
      connector.setAttribute("x2",rotateX);
      connector.setAttribute("y2",rotateY);
    }
    const rotate=group.querySelector(".shape-rotate-handle");
    if(rotate){
      rotate.setAttribute("cx",rotateX);
      rotate.setAttribute("cy",rotateY);
    }
  }


  // ---- Shape Bebas multi-selection, movement and alignment -----------------
  function selectedFreeShapes(){
    return normalizeShapeAnnotations().filter(item=>selectedFreeShapeIds.has(item.id)&&item.decorative&&!item.hidden&&!item.locked);
  }

  function selectShapeForInteraction(item,event=null,{preserveGroup=true}={}){
    if(!item)return false;
    const additive=!!(event?.shiftKey||event?.ctrlKey||event?.metaKey);
    if(!item.decorative){
      selectedFreeShapeIds.clear();
      selectedShapeId=item.id;
    }else if(additive){
      if(selectedFreeShapeIds.has(item.id))selectedFreeShapeIds.delete(item.id);
      else if(!item.hidden&&!item.locked)selectedFreeShapeIds.add(item.id);
      selectedShapeId=[...selectedFreeShapeIds].at(-1)??null;
    }else{
      if(!preserveGroup||!selectedFreeShapeIds.has(item.id)||selectedFreeShapeIds.size<=1){
        selectedFreeShapeIds.clear();
        if(!item.hidden&&!item.locked)selectedFreeShapeIds.add(item.id);
      }
      selectedShapeId=item.id;
    }
    clearOtherSelectionsForShape();
    return !additive;
  }

  function shapeWorldBounds(item){
    const rad=normalizeShapeAngle(item.angle)*Math.PI/180;
    const w=Math.abs(item.w*Math.cos(rad))+Math.abs(item.h*Math.sin(rad));
    const h=Math.abs(item.w*Math.sin(rad))+Math.abs(item.h*Math.cos(rad));
    const cx=item.x+item.w/2,cy=item.y+item.h/2;
    return {left:cx-w/2,right:cx+w/2,top:cy-h/2,bottom:cy+h/2,cx,cy,w,h};
  }

  function unionShapeBounds(items){
    const rects=items.map(shapeWorldBounds);
    if(!rects.length)return null;
    const left=Math.min(...rects.map(r=>r.left)),right=Math.max(...rects.map(r=>r.right));
    const top=Math.min(...rects.map(r=>r.top)),bottom=Math.max(...rects.map(r=>r.bottom));
    return {left,right,top,bottom,cx:(left+right)/2,cy:(top+bottom)/2,w:right-left,h:bottom-top};
  }

  function freeShapeSiteBounds(){
    const polygons=state.siteShapeMode==="custom"
      ? (Array.isArray(state.siteAreas)?state.siteAreas.flatMap(a=>Array.isArray(a.polygon)?a.polygon:[]):[])
      : [];
    const points=polygons.length?polygons:(state.siteShapeMode==="custom"&&Array.isArray(state.sitePolygon)?state.sitePolygon:[]);
    if(points.length){
      const x=points.map(p=>Number(p.x)).filter(Number.isFinite);
      const y=points.map(p=>Number(p.y)).filter(Number.isFinite);
      if(x.length&&y.length){
        const left=Math.min(...x),right=Math.max(...x),top=Math.min(...y),bottom=Math.max(...y);
        return {left,right,top,bottom,cx:(left+right)/2,cy:(top+bottom)/2};
      }
    }
    const left=0,top=0,right=Math.max(0,Number(state.siteW)||0),bottom=Math.max(0,Number(state.siteH)||0);
    return {left,right,top,bottom,cx:right/2,cy:bottom/2};
  }

  function selectAllFreeShapes(){
    selectedFreeShapeIds.clear();
    normalizeShapeAnnotations().filter(item=>item.decorative&&!item.hidden&&!item.locked)
      .forEach(item=>selectedFreeShapeIds.add(item.id));
    selectedShapeId=[...selectedFreeShapeIds].at(-1)??null;
    shapeToolState.active=false;
    shapeToolState.dragging=false;
    shapeToolState.pointerId=null;
    shapeToolState.start=null;
    shapeToolState.end=null;
    removeShapePreview();
    clearOtherSelectionsForShape();
    updateToolsMenuState();
    render();
  }

  function clearFreeShapeSelection(){
    selectedFreeShapeIds.clear();
    selectedShapeId=null;
    render();
  }

  function alignFreeShapes(mode){
    const items=selectedFreeShapes();
    if(items.length<2)return;
    const alignTo=$("freeShapeAlignTo")?.value||"selection";
    const target=alignTo==="site"?freeShapeSiteBounds()
      :alignTo==="key"?(shapeWorldBounds(items.find(item=>item.id===selectedShapeId)||items[0]))
      :unionShapeBounds(items);
    if(!target)return;
    let changed=false;
    items.forEach(item=>{
      if(alignTo==="key"&&item.id===selectedShapeId)return;
      const b=shapeWorldBounds(item);
      let offset=0;
      if(mode==="left")offset=target.left-b.left;
      if(mode==="hcenter")offset=target.cx-b.cx;
      if(mode==="right")offset=target.right-b.right;
      if(mode==="top")offset=target.top-b.top;
      if(mode==="vcenter")offset=target.cy-b.cy;
      if(mode==="bottom")offset=target.bottom-b.bottom;
      if(Math.abs(offset)<1e-8)return;
      if(["left","hcenter","right"].includes(mode))item.x+=offset;
      else item.y+=offset;
      changed=true;
    });
    if(changed){render();commitHistory();}
  }

  function distributeFreeShapes(axis,useGap=false){
    const items=selectedFreeShapes().slice();
    if(items.length<(useGap?2:3))return;
    const horiz=axis==="h";
    items.sort((a,b)=>{
      const ra=shapeWorldBounds(a),rb=shapeWorldBounds(b);
      return (horiz?ra.cx-rb.cx:ra.cy-rb.cy)||a.id-b.id;
    });
    const first=shapeWorldBounds(items[0]),last=shapeWorldBounds(items.at(-1));
    const firstCenter=horiz?first.cx:first.cy,lastCenter=horiz?last.cx:last.cy;
    const gap=Math.max(0,Number($("freeShapeAlignGap")?.value)||0);
    let changed=false;
    let nextEdge=horiz?first.right:first.bottom;
    items.forEach((item,i)=>{
      if(i===0)return;
      if(!useGap&&i===items.length-1)return;
      const b=shapeWorldBounds(item);
      const desired=useGap
        ? nextEdge+gap+(horiz?b.w:b.h)/2
        : firstCenter+(lastCenter-firstCenter)*i/(items.length-1);
      const offset=desired-(horiz?b.cx:b.cy);
      if(Math.abs(offset)>1e-8){
        if(horiz)item.x+=offset;
        else item.y+=offset;
        changed=true;
      }
      const next=shapeWorldBounds(item);
      nextEdge=horiz?next.right:next.bottom;
    });
    if(changed){render();commitHistory();}
  }

  function centerFreeShapesInSite(){
    const items=selectedFreeShapes();
    if(!items.length)return;
    const b=unionShapeBounds(items),site=freeShapeSiteBounds();
    const dx=site.cx-b.cx,dy=site.cy-b.cy;
    if(Math.abs(dx)<1e-8&&Math.abs(dy)<1e-8)return;
    items.forEach(item=>{item.x+=dx;item.y+=dy;});
    render();commitHistory();
  }

  function ensureFreeShapeAlignToolbar(){
    if($("freeShapeAlignToolbar"))return;
    const courtBar=$("courtAlignToolbar");
    if(!courtBar)return;
    const bar=courtBar.cloneNode(true);
    bar.id="freeShapeAlignToolbar";
    bar.setAttribute("aria-label","Align dan distribute Shape Bebas");
    bar.hidden=true;
    const rename={
      courtAlignTo:"freeShapeAlignTo",courtAlignLeft:"freeShapeAlignLeft",
      courtAlignHCenter:"freeShapeAlignHCenter",courtAlignRight:"freeShapeAlignRight",
      courtAlignTop:"freeShapeAlignTop",courtAlignVCenter:"freeShapeAlignVCenter",
      courtAlignBottom:"freeShapeAlignBottom",
      courtDistributeHCenter:"freeShapeDistributeHCenter",
      courtDistributeVCenter:"freeShapeDistributeVCenter",
      courtAlignGap:"freeShapeAlignGap",courtAlignGapUnit:"freeShapeAlignGapUnit",
      courtDistributeHGap:"freeShapeDistributeHGap",
      courtDistributeVGap:"freeShapeDistributeVGap",
      multiCenterSite:"freeShapeCenterSite",alignKeyCourtLabel:"freeShapeKeyLabel"
    };
    bar.querySelectorAll("[id]").forEach(el=>{if(rename[el.id])el.id=rename[el.id];});
    const key=bar.querySelector('option[value="key"]');
    if(key)key.textContent="Key Shape";
    const label=bar.querySelector(".key-court-label");
    if(label)label.textContent="";
    bar.querySelectorAll("[title]").forEach(el=>{
      el.title=el.title.replace(/court/gi,"shape");
    });
    const selection=document.createElement("div");
    selection.className="align-to-wrap";
    selection.innerHTML='<strong id="freeShapeSelectionCount" style="font-size:11px;white-space:nowrap">2 Shape Bebas</strong><button id="freeShapeClearSelection" class="secondary" type="button" title="Clear Shape Bebas selection" style="min-width:26px;width:26px;padding:3px">×</button>';
    bar.insertBefore(selection,bar.firstChild);
    courtBar.parentNode.insertBefore(bar,courtBar.nextSibling);
    const actions={
      freeShapeAlignLeft:()=>alignFreeShapes("left"),
      freeShapeAlignHCenter:()=>alignFreeShapes("hcenter"),
      freeShapeAlignRight:()=>alignFreeShapes("right"),
      freeShapeAlignTop:()=>alignFreeShapes("top"),
      freeShapeAlignVCenter:()=>alignFreeShapes("vcenter"),
      freeShapeAlignBottom:()=>alignFreeShapes("bottom"),
      freeShapeDistributeHCenter:()=>distributeFreeShapes("h"),
      freeShapeDistributeVCenter:()=>distributeFreeShapes("v"),
      freeShapeDistributeHGap:()=>distributeFreeShapes("h",true),
      freeShapeDistributeVGap:()=>distributeFreeShapes("v",true),
      freeShapeCenterSite:centerFreeShapesInSite,
      freeShapeClearSelection:clearFreeShapeSelection
    };
    Object.entries(actions).forEach(([id,fn])=>$(id)?.addEventListener("click",fn));
  }

  function updateFreeShapeAlignToolbar(){
    ensureFreeShapeAlignToolbar();
    const bar=$("freeShapeAlignToolbar");
    if(!bar)return;
    const items=selectedFreeShapes();
    bar.hidden=items.length<2;
    if(items.length<2)return;
    if($("freeShapeSelectionCount"))$("freeShapeSelectionCount").textContent=items.length+" Shape Bebas dipilih";
    if($("freeShapeKeyLabel"))$("freeShapeKeyLabel").textContent="Key: Shape Bebas "+(selectedShapeId??items[0].id);
    if($("freeShapeAlignGapUnit"))$("freeShapeAlignGapUnit").textContent="m";
    refreshBulkFreeShapeColourToolbar(items);
    ["freeShapeDistributeHCenter","freeShapeDistributeVCenter"].forEach(id=>{
      if($(id))$(id).disabled=items.length<3;
    });
  }

  function insertFreeShapeSelectAll(){
    const list=$("courtList");
    if(!list||!list.parentNode)return;
    let bar=$("freeShapeLayerSelectAll");
    if(!bar){
      bar=document.createElement("div");
      bar.id="freeShapeLayerSelectAll";
      bar.className="layer-group-toolbar";
      bar.innerHTML='<button type="button" class="secondary" id="freeShapeSelectAllButton">Select All Shape Bebas</button><button type="button" class="secondary" id="freeShapeClearLayerButton" title="Clear selection">Clear</button><span id="freeShapeSelectLayerCount" class="layer-group-count"></span>';
      list.parentNode.insertBefore(bar,list);
      $("freeShapeSelectAllButton").addEventListener("click",selectAllFreeShapes);
      $("freeShapeClearLayerButton").addEventListener("click",clearFreeShapeSelection);
    }
    const available=normalizeShapeAnnotations().filter(item=>item.decorative&&!item.hidden&&!item.locked).length;
    bar.hidden=!available;
    if($("freeShapeSelectAllButton"))$("freeShapeSelectAllButton").disabled=available<1;
    if($("freeShapeSelectLayerCount"))$("freeShapeSelectLayerCount").textContent=selectedFreeShapes().length+"/"+available+" dipilih";
  }

  function bindShapeDrag(target,item,group){
    target.addEventListener("pointerdown",event=>{
      if(item.locked||event.button!==0)return;
      event.preventDefault();
      event.stopPropagation();
      const id=item.id;
      const canDrag=selectShapeForInteraction(item,event);
      if(!canDrag){
        render();
        return;
      }
      const live=shapeAnnotationById(id)||item;
      const start=stagePointFromClient(event.clientX,event.clientY);
      const x0=live.x,y0=live.y;
      const pid=event.pointerId;
      const starts=new Map((item.decorative&&selectedFreeShapeIds.size>1?selectedFreeShapes():[live])
        .map(shape=>[shape.id,{x:shape.x,y:shape.y}]));
      const dragThresholdPx=event.pointerType==="touch"?7:3;
      let moved=false;
      const shiftLock={axis:null};
      try{target.setPointerCapture?.(pid);}catch(_){}
      const move=e=>{
        if(e.pointerId!==pid)return;
        e.preventDefault?.();
        const travel=Math.hypot(e.clientX-event.clientX,e.clientY-event.clientY);
        if(!moved&&travel<dragThresholdPx)return;
        const p=stagePointFromClient(e.clientX,e.clientY);
        const snapped=snapShiftDrag(x0,y0,p.x-start.x,p.y-start.y,e.shiftKey,shiftLock);
        const dx=snapped.x-x0,dy=snapped.y-y0;
        starts.forEach((initial,shapeId)=>{
          const current=shapeAnnotationById(shapeId);
          if(!current||current.locked)return;
          if(Math.abs(initial.x+dx-current.x)<1e-6&&Math.abs(initial.y+dy-current.y)<1e-6)return;
          current.x=initial.x+dx;
          current.y=initial.y+dy;
          const node=svg.querySelector('[data-shape-id="'+shapeId+'"]');
          if(node)updateShapeAnnotationGroup(node,current);
          moved=true;
        });
      };
      const end=e=>{
        if(e.pointerId!==pid)return;
        window.removeEventListener("pointermove",move);
        window.removeEventListener("pointerup",end);
        window.removeEventListener("pointercancel",end);
        try{target.releasePointerCapture?.(pid);}catch(_){}
        render();
        if(moved)commitHistory();
      };
      window.addEventListener("pointermove",move,{passive:false});
      window.addEventListener("pointerup",end);
      window.addEventListener("pointercancel",end);
      updateShapeFormatToolbar();
    });
  }

  function bindShapeResize(handle,item,group,corner){
    handle.addEventListener("pointerdown",event=>{
      if(item.locked || event.button!==0) return;
      event.preventDefault();
      event.stopPropagation();
      selectedShapeId=item.id;
      clearOtherSelectionsForShape();
      const live=shapeAnnotationById(item.id)||item;
      const startState={x:live.x,y:live.y,w:live.w,h:live.h,angle:live.angle||0};
      let anchorX=startState.x, anchorY=startState.y;
      if(corner==="nw"){anchorX=startState.x+startState.w;anchorY=startState.y+startState.h;}
      if(corner==="ne"){anchorX=startState.x;anchorY=startState.y+startState.h;}
      if(corner==="sw"){anchorX=startState.x+startState.w;anchorY=startState.y;}
      if(corner==="se"){anchorX=startState.x;anchorY=startState.y;}
      const pid=event.pointerId;
      let moved=false;
      try{handle.setPointerCapture?.(pid);}catch(_){ }

      const move=e=>{
        if(e.pointerId!==pid) return;
        e.preventDefault?.();
        const world=stagePointFromClient(e.clientX,e.clientY);
        const p=worldPointToShapeLocal(world,startState);
        const minSize=.15;
        let left,right,top,bottom;
        if(corner==="nw" || corner==="sw"){
          left=Math.min(p.x,anchorX-minSize);right=anchorX;
        }else{
          left=anchorX;right=Math.max(p.x,anchorX+minSize);
        }
        if(corner==="nw" || corner==="ne"){
          top=Math.min(p.y,anchorY-minSize);bottom=anchorY;
        }else{
          top=anchorY;bottom=Math.max(p.y,anchorY+minSize);
        }
        const current=shapeAnnotationById(item.id);
        if(!current) return;
        current.x=left;
        current.y=top;
        current.w=Math.max(minSize,right-left);
        current.h=Math.max(minSize,bottom-top);
        moved=true;
        updateShapeAnnotationGroup(group,current);
      };
      const end=e=>{
        if(e.pointerId!==pid) return;
        window.removeEventListener("pointermove",move);
        window.removeEventListener("pointerup",end);
        window.removeEventListener("pointercancel",end);
        try{handle.releasePointerCapture?.(pid);}catch(_){ }
        render();
        if(moved) commitHistory();
      };
      window.addEventListener("pointermove",move,{passive:false});
      window.addEventListener("pointerup",end);
      window.addEventListener("pointercancel",end);
    });
  }

  function bindShapeRotate(handle,item,group){
    handle.addEventListener("pointerdown",event=>{
      if(item.locked || event.button!==0) return;
      event.preventDefault();
      event.stopPropagation();
      selectedShapeId=item.id;
      clearOtherSelectionsForShape();
      const live=shapeAnnotationById(item.id)||item;
      const cx=live.x+live.w/2, cy=live.y+live.h/2;
      const start=stagePointFromClient(event.clientX,event.clientY);
      const pointerStart=Math.atan2(start.y-cy,start.x-cx)*180/Math.PI;
      const angleStart=normalizeShapeAngle(live.angle);
      const pid=event.pointerId;
      let moved=false;
      try{handle.setPointerCapture?.(pid);}catch(_){ }

      const move=e=>{
        if(e.pointerId!==pid) return;
        e.preventDefault?.();
        const p=stagePointFromClient(e.clientX,e.clientY);
        const pointerAngle=Math.atan2(p.y-cy,p.x-cx)*180/Math.PI;
        let next=angleStart+(pointerAngle-pointerStart);
        if(e.shiftKey) next=Math.round(next/45)*45;
        const current=shapeAnnotationById(item.id);
        if(!current) return;
        current.angle=normalizeShapeAngle(next);
        moved=true;
        updateShapeAnnotationGroup(group,current);
        if($("shapeAngle")) $("shapeAngle").value=String(Math.round(current.angle));
      };
      const end=e=>{
        if(e.pointerId!==pid) return;
        window.removeEventListener("pointermove",move);
        window.removeEventListener("pointerup",end);
        window.removeEventListener("pointercancel",end);
        try{handle.releasePointerCapture?.(pid);}catch(_){ }
        render();
        if(moved) commitHistory();
      };
      window.addEventListener("pointermove",move,{passive:false});
      window.addEventListener("pointerup",end);
      window.addEventListener("pointercancel",end);
    });
  }

  function createShapeAnnotationGroup(item){
    const attrs={class:"shape-annotation","data-shape-id":item.id,"data-shape-role":item.role};
    if(item.decorative) attrs["data-shape-decorative"]="true";
    else attrs["data-shape-brand"]=item.brand;
    const transform=shapeGroupTransform(item);
    if(transform) attrs.transform=transform;
    const group=ns("g",attrs);

    const rect=ns("rect",{
      class:"shape-content",
      x:item.x,y:item.y,width:item.w,height:item.h,
      fill:item.color,
      stroke:"none",
      // Exclude free decorative artwork from colour-area pixel counting,
      // even if it happens to match a court/site catalogue HEX.
      "data-surface-ignore":item.decorative?"1":"0",
      "shape-rendering":"geometricPrecision"
    });
    group.appendChild(rect);

    const hit=ns("rect",{
      class:"shape-hit-area",
      x:item.x,y:item.y,width:item.w,height:item.h,
      fill:"rgba(0,0,0,0)",stroke:"none","pointer-events":"all"
    });
    hit.style.cursor=item.locked?"default":"move";
    group.appendChild(hit);
    bindShapeDrag(hit,item,group);
    bindShapeDrag(rect,item,group);

    if(item.id===selectedShapeId || selectedFreeShapeIds.has(item.id)){
      // Photoshop marching ants: contrasting solid black under animated white dashes.
      // SVG non-scaling strokes keep the outline readable at every zoom level.
      group.appendChild(ns("rect",{
        class:"editing-only shape-selection shape-selection-back",
        x:item.x,y:item.y,width:item.w,height:item.h,
        fill:"none",stroke:"#111111","stroke-width":"1.8",
        "vector-effect":"non-scaling-stroke","pointer-events":"none"
      }));
      group.appendChild(ns("rect",{
        class:"editing-only shape-selection shape-selection-ants",
        x:item.x,y:item.y,width:item.w,height:item.h,
        fill:"none",stroke:"#ffffff","stroke-width":"1.8","stroke-dasharray":"5 5",
        "vector-effect":"non-scaling-stroke","pointer-events":"none"
      }));

      if(!item.locked && selectedFreeShapeIds.size<2){
        const handles={
          nw:[item.x,item.y],ne:[item.x+item.w,item.y],
          sw:[item.x,item.y+item.h],se:[item.x+item.w,item.y+item.h]
        };
        const hitSize=shapeResizeHitWorldSize();
        const knobSize=Math.max(.09,Math.min(.40,hitSize*.40));
        Object.entries(handles).forEach(([key,[x,y]])=>{
          const touch=ns("rect",{
            class:"editing-only shape-resize-hit",
            "data-handle":key,
            x:x-hitSize/2,y:y-hitSize/2,width:hitSize,height:hitSize,
            fill:"rgba(0,0,0,0)",stroke:"none","pointer-events":"all"
          });
          touch.style.cursor=(key==="nw"||key==="se")?"nwse-resize":"nesw-resize";
          group.appendChild(touch);
          const knob=ns("rect",{
            class:"editing-only shape-resize-knob",
            "data-handle":key,
            x:x-knobSize/2,y:y-knobSize/2,width:knobSize,height:knobSize,
            rx:knobSize*.10,fill:"#ffffff",stroke:"#111111","stroke-width":"1.3",
            "vector-effect":"non-scaling-stroke","pointer-events":"none"
          });
          group.appendChild(knob);
          bindShapeResize(touch,item,group,key);
        });

        const rotateGap=Math.max(.7,Math.min(1.2,item.h*.18));
        const rotateX=item.x+item.w;
        const rotateY=item.y-rotateGap;
        group.appendChild(ns("line",{
          class:"editing-only shape-rotate-connector",
          x1:item.x+item.w,y1:item.y,x2:rotateX,y2:rotateY,
          stroke:"#2563eb","stroke-width":.04,"vector-effect":"non-scaling-stroke","pointer-events":"none"
        }));
        const rotate=ns("circle",{
          class:"editing-only shape-rotate-handle",
          cx:rotateX,cy:rotateY,r:.24,
          fill:"#ffffff",stroke:"#2563eb","stroke-width":.04,
          "vector-effect":"non-scaling-stroke","pointer-events":"all"
        });
        rotate.style.cursor="grab";
        group.appendChild(rotate);
        bindShapeRotate(rotate,item,group);
      }
    }

    return group;
  }

  function deleteShapeAnnotation(id){
    const item=shapeAnnotationById(id);
    if(!item || item.locked) return;
    state.shapeAnnotations=state.shapeAnnotations.filter(shape=>shape.id!==id);
    state.artworkLayerOrder=(state.artworkLayerOrder||[]).filter(token=>token!==`shape:${id}`);
    selectedFreeShapeIds.delete(id);
    if(selectedShapeId===id) selectedShapeId=null;
    render();
    commitHistory();
  }

  function duplicateSelectedShape(){
    const item=shapeAnnotationById(selectedShapeId);
    if(!item) return;
    normalizeShapeAnnotations();
    const copy=normalizeShapeAnnotation({
      ...cloneData(item),
      id:state.nextShapeId++,
      // Use the visible rotated width so every copy sits immediately right.
      x:item.x+shapeWorldBounds(item).w+.3,
      y:item.y,
      locked:false,
      hidden:false
    },state.shapeAnnotations.length);
    state.shapeAnnotations.push(copy);
    normalizeArtworkLayerOrder();
    state.artworkLayerOrder=(state.artworkLayerOrder||[]).filter(token=>token!==`shape:${copy.id}`);
    state.artworkLayerOrder.push(`shape:${copy.id}`);
    selectedFreeShapeIds.clear();
    if(copy.decorative)selectedFreeShapeIds.add(copy.id);
    selectedShapeId=copy.id;
    clearOtherSelectionsForShape();
    render();
    commitHistory();
  }

  function rotateSelectedShape(delta){
    const item=shapeAnnotationById(selectedShapeId);
    if(!item || item.locked) return;
    item.angle=normalizeShapeAngle((Number(item.angle)||0)+Number(delta||0));

  function setSelectedShapeAngle(value,{commit=false}={}){

  function populateShapeColourOptions(brand,color){
    const select=$("shapeColour");
    if(!select) return;
    const palette=shapePalette(brand);
    const current=normalizeHexColor(color)||shapeDefaultColor(brand);
    select.innerHTML="";
    palette.forEach(entry=>{
      const hex=normalizeHexColor(entry.color);
      if(!hex) return;
      const option=document.createElement("option");
      option.value=hex;
      option.textContent=`${entry.name} (${hex.toUpperCase()})`;
      select.appendChild(option);
    });
    const exists=Array.from(select.options).some(option=>option.value===current);
    select.value=exists?current:(select.options[0]?.value||current);
    const swatch=$("shapeColourPreview");
    if(swatch) swatch.style.background=select.value||current;
  }

  function updateShapeFormatToolbar(){
    const bar=$("shapeFormatToolbar");
    if(!bar) return;
    const item=selectedShapeId!==null ? shapeAnnotationById(selectedShapeId) : null;
    const multi=selectedFreeShapes().length>1;
    const show=(!multi && !!item) || (!multi && !!shapeToolState.active);
    bar.hidden=!show;
    updateFreeShapeAlignToolbar();
    if(!show) return;

    const decorative=!!(item ? item.decorative : shapeToolState.decorative);
    const role=item?.role || shapeToolState.role;
    const brand=decorative ? null : (item?.brand || shapeToolState.brand || normalizeBrand(state.brand));
    const color=decorative
      ? (item?.color || shapeToolState.freeColor || "#a53531")
      : (item?.color || shapeToolState.color || shapeDefaultColor(brand));
    if($("shapeModeLabel")) $("shapeModeLabel").textContent=decorative?"SHAPE BEBAS":"SHAPE";
    ["shapeRoleLabel","shapeBrandLabel","shapeRole","shapeBrand","shapeColourPreview","shapeColour"].forEach(id=>{
      if($(id)) $(id).hidden=decorative;
    });
    if($("freeShapeColour")){
      $("freeShapeColour").hidden=!decorative;
      $("freeShapeColour").value=normalizeHexColor(color)||"#a53531";
      $("freeShapeColour").disabled=!!item?.locked;
    }
    if(!decorative){
      if($("shapeRole")) $("shapeRole").value=normalizeShapeRole(role);
      if($("shapeBrand")) $("shapeBrand").value=normalizeBrand(brand,state.brand);
      populateShapeColourOptions(brand,color);
    }
    if($("shapeAngle")){
      $("shapeAngle").value=String(Math.round(normalizeShapeAngle(item?.angle||0)));
      $("shapeAngle").disabled=!item || !!item.locked;
    }
    if($("shapeRotateLeft")) $("shapeRotateLeft").disabled=!item || !!item.locked;
    if($("shapeRotateRight")) $("shapeRotateRight").disabled=!item || !!item.locked;
    if($("shapeDuplicate")) $("shapeDuplicate").disabled=!item;
    if($("shapeDelete")) $("shapeDelete").disabled=!item || !!item.locked;
    if($("shapeRole")) $("shapeRole").disabled=!!item?.locked;
    if($("shapeBrand")) $("shapeBrand").disabled=!!item?.locked;
    if($("shapeColour")) $("shapeColour").disabled=!!item?.locked;
  }

  function applyShapeRole(value,{commit=false}={}){
    const role=normalizeShapeRole(value);
    shapeToolState.role=role;
    const item=shapeAnnotationById(selectedShapeId);
    if(item?.decorative) return;
    if(item && !item.locked) item.role=role;
    render();
    if(commit && item && !item.locked) commitHistory();
  }

  function applyShapeBrand(value,{commit=false}={}){
    const brand=normalizeBrand(value,state.brand);
    shapeToolState.brand=brand;
    const item=shapeAnnotationById(selectedShapeId);
    if(item?.decorative) return;
    if(item && !item.locked){
      const oldColor=normalizeHexColor(item.color);
      item.brand=brand;
      const palette=shapePalette(brand);
      item.color=palette.some(entry=>normalizeHexColor(entry.color)===oldColor)
        ? oldColor
        : shapeDefaultColor(brand);
      shapeToolState.color=item.color;
    }else{
      shapeToolState.color=shapeDefaultColor(brand);
    }
    render();
    if(commit && item && !item.locked) commitHistory();
  }

  function applyShapeColour(value,{commit=false}={}){
    const item=shapeAnnotationById(selectedShapeId);
    if(item?.decorative) return;
    const brand=item?.brand || shapeToolState.brand;
    const palette=shapePalette(brand);
    const normalized=normalizeHexColor(value);
    const allowed=normalized && palette.some(entry=>normalizeHexColor(entry.color)===normalized);
    const color=allowed?normalized:shapeDefaultColor(brand);
    shapeToolState.color=color;
    shapeToolState.normalColor=color;
    if(item && !item.locked) item.color=color;
    const swatch=$("shapeColourPreview");
    if(swatch) swatch.style.background=color;
    render();
    if(commit && item && !item.locked) commitHistory();
  }

  function applyFreeShapeColour(value,{commit=false}={}){
    const color=normalizeHexColor(value)||"#a53531";
    shapeToolState.freeColor=color;
    if(shapeToolState.decorative) shapeToolState.color=color;
    const item=shapeAnnotationById(selectedShapeId);
    if(item && item.decorative && !item.locked){
      if(item.color===color){
        if(commit && shapeToolState.freeColourDirty){
          shapeToolState.freeColourDirty=false;
          commitHistory();
        }
        return;
      }
      item.color=color;
      render();
      if(commit){
        shapeToolState.freeColourDirty=false;
        commitHistory();
      }else{
        shapeToolState.freeColourDirty=true;
      }
    }else{
      updateShapeFormatToolbar();
    }
  }

  function removeShapePreview(){
    svg.querySelectorAll(".shape-tool-preview").forEach(node=>node.remove());
  }

  function drawShapeToolOverlay(){
    removeShapePreview();
    if(!shapeToolState.active || !shapeToolState.dragging || !shapeToolState.start || !shapeToolState.end) return;
    const a=shapeToolState.start,b=shapeToolState.end;
    const x=Math.min(a.x,b.x),y=Math.min(a.y,b.y);
    const w=Math.abs(b.x-a.x),h=Math.abs(b.y-a.y);
    const rect=ns("rect",{
      class:"editing-only shape-tool-preview",
      x,y,width:w,height:h,
      fill:shapeToolState.color||shapeDefaultColor(shapeToolState.brand),
      "fill-opacity":.28,
      stroke:"#2563eb","stroke-width":.06,"stroke-dasharray":".20 .12",
      "vector-effect":"non-scaling-stroke","pointer-events":"none"
    });
    svg.appendChild(rect);
  }

  function setShapeToolActive(active,decorative=false){
    if(active && typeof customSiteDrawing!=="undefined" && customSiteDrawing){
      alert("Selesaikan atau Batal Draw Site dahulu sebelum guna Shape Tool.");
      return;
    }
    if(active){
      lineToolState.active=false;
      measureToolState.active=false;
      textToolState.active=false;
      stageTouchPanMode=false;
      closeTextInlineEditor(false);
      closeMeasureInlineEditor(false);
      // Switching from Text/Measure/Court to Shape must also clear their
      // selections, otherwise their formatting bars remain visible.
      clearOtherSelectionsForShape();
      if(shapeToolState.decorative!==!!decorative){
        selectedShapeId=null;
        selectedFreeShapeIds.clear();
      }
      shapeToolState.decorative=!!decorative;
      if(shapeToolState.decorative){
        shapeToolState.color=shapeToolState.freeColor||"#a53531";
      }else{
        shapeToolState.brand=normalizeBrand(shapeToolState.brand||state.brand,state.brand);
        shapeToolState.color=shapeToolState.normalColor||shapeDefaultColor(shapeToolState.brand);
      }
    }
    shapeToolState.active=!!active;
    shapeToolState.dragging=false;
    shapeToolState.pointerId=null;
    shapeToolState.start=null;
    shapeToolState.end=null;
    removeShapePreview();
    updateToolsMenuState();
    updateShapeFormatToolbar();
    render();
  }

  function handleShapePointerDown(event){
    if(!shapeToolState.active || stageSpaceHeld || stagePanActive || event.button!==0) return;
    if(event.target?.closest?.("[data-shape-id]")) return;
    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation();
    const p=stagePointFromClient(event.clientX,event.clientY);
    shapeToolState.dragging=true;
    shapeToolState.pointerId=event.pointerId;
    shapeToolState.start={x:p.x,y:p.y};
    shapeToolState.end={x:p.x,y:p.y};
    shapeToolState.startClient={x:event.clientX,y:event.clientY};
    try{svg.setPointerCapture?.(event.pointerId);}catch(_){ }
    drawShapeToolOverlay();
  }

  function handleShapePointerMove(event){
    if(!shapeToolState.dragging || event.pointerId!==shapeToolState.pointerId) return;
    event.preventDefault?.();
    const p=stagePointFromClient(event.clientX,event.clientY);
    shapeToolState.end={x:p.x,y:p.y};
    drawShapeToolOverlay();
  }

  function finishShapePointer(event){
    if(!shapeToolState.dragging || event.pointerId!==shapeToolState.pointerId) return;
    event.preventDefault?.();
    const a=shapeToolState.start;
    const b=shapeToolState.end || stagePointFromClient(event.clientX,event.clientY);
    const startClient=shapeToolState.startClient;
    const travelled=startClient
      ? Math.hypot(event.clientX-startClient.x,event.clientY-startClient.y)
      : Infinity;
    const isTap=travelled<(event.pointerType==="touch"?9:4);
    shapeToolState.dragging=false;
    try{svg.releasePointerCapture?.(event.pointerId);}catch(_){ }
    shapeToolState.pointerId=null;
    shapeToolState.start=null;
    shapeToolState.end=null;
    shapeToolState.startClient=null;
    removeShapePreview();
    if(event.type==="pointercancel" || !a || !b) return render();

    const x=Math.min(a.x,b.x),y=Math.min(a.y,b.y);
    const w=Math.abs(b.x-a.x),h=Math.abs(b.y-a.y);
    // A tap on empty Site/Court space deselects the current Shape instead
    // of starting a new one. A genuine drag still draws the new Shape.
    if(isTap || w<.08 || h<.08){
      selectedShapeId=null;
      selectedFreeShapeIds.clear();
      return render();
    }

    normalizeShapeAnnotations();
    const decorative=!!shapeToolState.decorative;
    const brand=decorative ? null : normalizeBrand(shapeToolState.brand,state.brand);
    const item=normalizeShapeAnnotation({
      id:state.nextShapeId++,
      x,y,w,h,
      angle:0,
      decorative,
      role:decorative ? "decorative" : shapeToolState.role,
      brand,
      color:decorative
        ? (shapeToolState.freeColor||"#a53531")
        : (shapeToolState.color||shapeDefaultColor(brand)),
      hidden:false,locked:false
    },state.shapeAnnotations.length);
    state.shapeAnnotations.push(item);
    selectedFreeShapeIds.clear();
    if(item.decorative)selectedFreeShapeIds.add(item.id);
    selectedShapeId=item.id;
    clearOtherSelectionsForShape();
    normalizeArtworkLayerOrder();
    state.artworkLayerOrder=state.artworkLayerOrder.filter(token=>token!==`shape:${item.id}`);
    state.artworkLayerOrder.push(`shape:${item.id}`);
    render();
    commitHistory();
  }

  shapeToolState.color=shapeDefaultColor(shapeToolState.brand);

  // ---- Persist Shape data in every Option/Group/JSON -----------------------
  const originalCaptureCurrentOptionData=captureCurrentOptionData;
  captureCurrentOptionData=function(){
    normalizeShapeAnnotations();
    const data=originalCaptureCurrentOptionData();
    data.shapeAnnotations=cloneData(state.shapeAnnotations||[]);
    data.nextShapeId=state.nextShapeId;
    return data;
  };

  const originalNormalizeOptionData=normalizeOptionData;
  normalizeOptionData=function(option){
    const raw=option||{};
    const data=originalNormalizeOptionData(option);
    const shapes=Array.isArray(raw.shapeAnnotations)
      ? raw.shapeAnnotations.map((item,index)=>normalizeShapeAnnotation(cloneData(item),index))
      : [];
    data.shapeAnnotations=shapes;
    data.nextShapeId=Math.max(
      parseInt(raw.nextShapeId||1,10)||1,
      ...shapes.map(item=>item.id+1),
      1
    );
    return data;
  };

  const originalApplyOptionData=applyOptionData;
  applyOptionData=function(optionData){
    const data=normalizeOptionData(optionData);
    originalApplyOptionData(data);
    state.shapeAnnotations=cloneData(data.shapeAnnotations||[]);
    state.nextShapeId=data.nextShapeId||1;
    selectedShapeId=null;
    selectedFreeShapeIds.clear();
    normalizeShapeAnnotations();
  };

  // ---- Artwork Layers -------------------------------------------------------
  function artworkLayerShapeTokens(){
    normalizeShapeAnnotations();
    return state.shapeAnnotations.map(item=>`shape:${item.id}`);
  }

  normalizeArtworkLayerOrder=function(value=state.artworkLayerOrder){
    const siteTokens=artworkLayerSiteTokens();
    const courtTokens=artworkLayerCourtTokens();
    const imageTokens=artworkLayerImageTokens();
    const lineTokens=artworkLayerLineTokens();
    const shapeTokens=artworkLayerShapeTokens();
    const lampTokens=(state.lampAnnotations||[]).map(item=>`lamp:${item.id}`);
    const doorTokens=(state.doorAnnotations||[]).map(item=>`door:${item.id}`);
    const fenceTokens=(state.partitionAnnotations||[]).map(item=>`partition:${item.id}`);
    const netTokens=(state.netAnnotations||[]).map(item=>`net:${item.id}`);
    const available=[...siteTokens,...courtTokens,...imageTokens,...lineTokens,...shapeTokens,...lampTokens,...doorTokens,...fenceTokens,...netTokens];
    const availableSet=new Set(available);
    let order=Array.isArray(value) ? value.filter(token=>typeof token==="string") : [];

    if(state.siteShapeMode==="custom" && order.includes("site:main")){
      const index=order.indexOf("site:main");
      order.splice(index,1,...siteTokens);
    }else if(state.siteShapeMode!=="custom"){
      const oldSiteIndexes=order
        .map((token,index)=>token.startsWith("site:") ? index : -1)
        .filter(index=>index>=0);
      if(oldSiteIndexes.length && !order.includes("site:main")){
        const insertAt=Math.min(...oldSiteIndexes);
        order=order.filter(token=>!token.startsWith("site:"));
        order.splice(Math.min(insertAt,order.length),0,"site:main");
      }
    }

    const seen=new Set();
    order=order.filter(token=>{
      if(!availableSet.has(token) || seen.has(token)) return false;
      seen.add(token);
      return true;
    });

    if(!order.length){
      order=[...siteTokens,...courtTokens,...imageTokens,...lineTokens,...shapeTokens,...lampTokens,...doorTokens,...fenceTokens,...netTokens];
    }else{
      siteTokens.forEach(token=>{
        if(order.includes(token)) return;
        let insertAt=-1;
        order.forEach((existing,index)=>{if(existing.startsWith("site:")) insertAt=index+1;});
        order.splice(insertAt>=0?insertAt:0,0,token);
      });
      [...courtTokens,...imageTokens,...lineTokens,...shapeTokens,...lampTokens,...doorTokens,...fenceTokens,...netTokens].forEach(token=>{
        if(!order.includes(token)) order.push(token);
      });
    }

    state.artworkLayerOrder=order;
    return order;
  };

  // Keep optional Tools object groups addressable by the unified selection
  // system even when their own renderer has no data-layer-token attribute.
  function drawTaggedSelectObject(token,draw){
    const before=new Set(svg.children);
    draw();
    for(const child of svg.children){
      if(!before.has(child) && typeof child.setAttribute==="function" &&
         !child.hasAttribute("data-layer-token")){
        child.setAttribute("data-layer-token",token);
      }
    }
  }

  drawArtworkLayers=function(){
    normalizeImageAnnotations();
    normalizeLineAnnotations();
    normalizeShapeAnnotations();
    const order=normalizeArtworkLayerOrder();
    const customAreas=state.siteShapeMode==="custom"
      ? new Map(siteAreasForRender().map((area,index)=>[area.id,{area,index}]))
      : null;

    let index=0;
    while(index<order.length){
      const token=order[index];

      if(token.startsWith("court:")){
        const segment=[];
        while(index<order.length && order[index].startsWith("court:")){
          const id=parseInt(order[index].slice(6),10);
          const court=state.courts.find(item=>item.id===id);
          if(court && !court.hidden) segment.push(court);
          index++;
        }
        segment.forEach(drawCourt);
        if(state.overlayMode) segment.forEach(drawCourtLineOverlay);
        continue;
      }

      if(token==="site:main"){
        if(state.siteShapeMode!=="custom") drawRectSiteLayer();
        index++;
        continue;
      }

      if(token.startsWith("site:")){
        const id=parseInt(token.slice(5),10);
        const entry=customAreas?.get(id);
        if(entry) drawCustomSiteAreaLayer(entry.area,entry.index);
        index++;
        continue;
      }

      if(token.startsWith("image:")){
        const id=parseInt(token.slice(6),10);
        const item=state.imageAnnotations.find(image=>image.id===id);
        if(item && !item.hidden && item.src){
          const group=createImageAnnotationGroup(item);
          group.setAttribute("data-layer-token",token);
          svg.appendChild(group);
        }
        index++;
        continue;
      }

      if(token.startsWith("line:")){
        const id=parseInt(token.slice(5),10);
        const item=state.lineAnnotations.find(line=>line.id===id);
        if(item && !item.hidden && lineLength(item)>.001){
          const group=createLineAnnotationGroup(item);
          group.setAttribute("data-layer-token",token);
          svg.appendChild(group);
        }
        index++;
        continue;
      }

      if(token.startsWith("lamp:")){
        drawTaggedSelectObject(token,()=>{
          if(window.BinaCourtLighting) window.BinaCourtLighting.draw(parseInt(token.slice(5),10));
        });
        index++;
        continue;
      }

      if(token.startsWith("door:")){
        drawTaggedSelectObject(token,()=>window.BinaCourtDoors?.draw(parseInt(token.slice(5),10)));
        index++;
        continue;
      }

      if(token.startsWith("partition:")){
        drawTaggedSelectObject(token,()=>window.BinaCourtPartitions?.draw(parseInt(token.slice(10),10)));
        index++;
        continue;
      }

      if(token.startsWith("net:")){
        drawTaggedSelectObject(token,()=>window.BinaCourtNets?.draw(parseInt(token.slice(4),10)));
        index++;
        continue;
      }

      if(token.startsWith("shape:")){
        const id=parseInt(token.slice(6),10);
        const item=shapeAnnotationById(id);
        if(item && !item.hidden){
          const group=createShapeAnnotationGroup(item);
          group.setAttribute("data-layer-token",token);
          svg.appendChild(group);
        }
        index++;
        continue;
      }

      index++;
    }
  };

  const originalLayerItemInfo=layerItemInfo;
  layerItemInfo=function(token,displayIndex,total){
    if(token.startsWith("shape:")){
      const id=parseInt(token.slice(6),10);
      const item=shapeAnnotationById(id);
      if(!item) return null;
      const rankText=displayIndex===0 ? "Paling atas" : (displayIndex===total-1 ? "Paling bawah" : `Layer ${displayIndex+1}`);
      return {
        token,type:"shape",id,
        name:item.decorative ? `Shape Bebas ${id}` : `${shapeRoleLabel(item.role)} Shape ${id}`,
        // Decorative shapes deliberately carry no size, system or product data.
        meta:item.decorative ? `Visual sahaja - ${rankText}`
          : `${item.w.toFixed(1)} x ${item.h.toFixed(1)} m - ${productBrandName(item.brand)} - Shape - ${rankText}`,
        color:item.color,
        hidden:!!item.hidden,
        locked:!!item.locked,
        active:selectedShapeId===id||selectedFreeShapeIds.has(id)
      };
    }
    return originalLayerItemInfo(token,displayIndex,total);
  };

  syncArtworkTypeOrders=function(){

    const courtById=new Map(state.courts.map(c=>[c.id,c]));
    const orderedCourts=order.filter(token=>token.startsWith("court:"))
      .map(token=>courtById.get(parseInt(token.slice(6),10))).filter(Boolean);
    if(orderedCourts.length===state.courts.length) state.courts=orderedCourts;

    const imageById=new Map(state.imageAnnotations.map(item=>[item.id,item]));
    const orderedImages=order.filter(token=>token.startsWith("image:"))
      .map(token=>imageById.get(parseInt(token.slice(6),10))).filter(Boolean);
    if(orderedImages.length===state.imageAnnotations.length) state.imageAnnotations=orderedImages;

    const lineById=new Map(state.lineAnnotations.map(item=>[item.id,item]));
    const orderedLines=order.filter(token=>token.startsWith("line:"))
      .map(token=>lineById.get(parseInt(token.slice(5),10))).filter(Boolean);
    if(orderedLines.length===state.lineAnnotations.length) state.lineAnnotations=orderedLines;

    const shapeById=new Map(state.shapeAnnotations.map(item=>[item.id,item]));
    const orderedShapes=order.filter(token=>token.startsWith("shape:"))
      .map(token=>shapeById.get(parseInt(token.slice(6),10))).filter(Boolean);

          <button type="button" class="layer-lock ${info.locked?"lock-active":""}" title="${info.locked?"Unlock layer":"Lock layer"}" aria-label="${info.locked?"Unlock layer":"Lock layer"}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="${info.locked?"M8 10V7a4 4 0 0 1 8 0v3":"M8 10V7a4 4 0 0 1 8 0"}"/></svg></button>

      item.querySelector(".layer-visibility")?.addEventListener("click",e=>{

        else if(info.type==="shape") toggleShapeLayerVisibility(info.id);

        else if(info.type==="line") toggleLineLayerLock(info.id);
        else if(info.type==="site") toggleSiteAreaLayerLock(info.id);
        else if(info.type==="shape") toggleShapeLayerLock(info.id);

      item.addEventListener("click",e=>{

  // ---- PDF / colour description integration --------------------------------
  const originalCollectUsedColors=collectUsedColors;
  collectUsedColors=function(){
    const used=originalCollectUsedColors();
    normalizeShapeAnnotations();
    state.shapeAnnotations.filter(item=>!item.hidden && !item.decorative).forEach(shape=>{
      const brand=normalizeBrand(shape.brand,state.brand);
      const palette=shapePalette(brand);
      const info=colorInfo(shape.color,palette);
      if(!info) return;
      const usage=shapeRoleLabel(shape.role);
      const existing=used.find(item=>
        item.color===info.color && item.kind==="surface" && item.brand===brand
      );
      if(existing){
        const text=String(existing.usage||"");
        const hasRole=usage==="Walkway"
          ? /walkway/i.test(text)
          : usage==="Main Surface"
            ? /main surface/i.test(text)
            : /(?:^|\s\/\s)Line(?:$|\s\/\s)/i.test(text);
        if(!hasRole) existing.usage=text?`${text} / ${usage}`:usage;
      }else{
        used.push({...info,usage,kind:"surface",brand,lineDetails:undefined});
      }
    });

  // ---- Render and tools integration -----------------------------------------
  // Editing UI controls are screen-space objects. Their on-screen size must
  // stay fixed when the SVG viewBox changes from wheel, pinch or zoom buttons.
  // This alters ONLY editing handles, never exported artwork dimensions.
  function refreshBinaEditingHandleSizes(){
    if(!svg || typeof svg.querySelectorAll!=="function")return;
    const selectors=[
      ".line-handle-start",".line-handle-end",".line-endpoint-hit",
      ".measure-handle-start",".measure-handle-end",
      ".image-resize-hit",".image-resize-knob",".image-rotate-handle",
      ".shape-resize-hit",".shape-resize-knob",".shape-rotate-handle",
      ".court-resize-handle",".futsal-d-depth-handle",
      ".futsal-d-width-handle",".futsal-center-circle-handle",
      ".custom-site-handle",".custom-site-preview-handle",
      ".site-resize-handle-group circle",".site-resize-handle-group rect"
    ];
    svg.querySelectorAll(selectors.join(",")).forEach(el=>{
      const matrix=el.getScreenCTM?.();
      if(!matrix)return;
      // Works for SVG groups that are translated or rotated.
      const sx=Math.hypot(matrix.a,matrix.b);
      const sy=Math.hypot(matrix.c,matrix.d);
      const scale=Math.sqrt(Math.max(1e-12,sx*sy));
      if(!Number.isFinite(scale)||scale<=1e-7)return;
      const cls=el.classList;
      const hit=cls.contains("line-endpoint-hit")||
        cls.contains("image-resize-hit")||
        cls.contains("shape-resize-hit")||
        (el.closest(".site-resize-handle-group")&&el.getAttribute("fill")==="rgba(0,0,0,0)");
      const pixels=hit?20:7;
      if(!hit && el.getAttribute("stroke") && el.getAttribute("stroke")!=="none"){
        // Stroke outlines should not thicken or disappear with zoom.
        el.setAttribute("vector-effect","non-scaling-stroke");
        el.setAttribute("stroke-width","1.5");
      }
      if(el.tagName.toLowerCase()==="circle"){
        el.setAttribute("r",(pixels/scale).toFixed(6));
      }else if(el.tagName.toLowerCase()==="rect"){
        const x=Number(el.getAttribute("x"))||0,y=Number(el.getAttribute("y"))||0;
        const w=Number(el.getAttribute("width"))||0,h=Number(el.getAttribute("height"))||0;
        const cx=x+w/2,cy=y+h/2;
        const size=2*pixels/scale;
        el.setAttribute("x",(cx-size/2).toFixed(6));
        el.setAttribute("y",(cy-size/2).toFixed(6));
        el.setAttribute("width",size.toFixed(6));
        el.setAttribute("height",size.toFixed(6));
        // Use the same visual rounding regardless of zoom level.
        if(!hit)el.setAttribute("rx",(Math.min(3,pixels/2)/scale).toFixed(6));
      }
    });
  }
  window.__refreshBinaEditingHandleSizes=refreshBinaEditingHandleSizes;

  function createBulkCourtColourControl(id,label){

  function ensureBulkCourtColourToolbar(){
    const panel=$("multiSelectPanel");
    if(!panel)return;
    if($("bulkCourtColourToolbar"))return;
    const bar=document.createElement("div");
    bar.id="bulkCourtColourToolbar";
    bar.style.cssText="display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:2px 0";
    const prefix=document.createElement("strong");
    prefix.textContent="COLOUR ALL";
    prefix.style.cssText="font-size:11px;white-space:nowrap";
    bar.appendChild(prefix);
    bar.appendChild(createBulkCourtColourControl("bulkCourtColourTarget","Bahagian"));
    bar.appendChild(createBulkCourtColourControl("bulkCourtColourValue","Warna"));
    const preview=document.createElement("span");
    preview.id="bulkCourtColourPreview";
    preview.style.cssText="width:24px;height:24px;border:1px solid #98a2b3;border-radius:5px;display:inline-block;flex:0 0 24px";
    bar.appendChild(preview);
    const hint=document.createElement("span");
    hint.id="bulkCourtColourHint";
    hint.style.cssText="font-size:10px;max-width:270px;white-space:normal";
    bar.appendChild(hint);
    panel.style.flexWrap="wrap";
    panel.appendChild(bar);
    $("bulkCourtColourTarget").addEventListener("change",refreshBulkCourtColourToolbar);
    $("bulkCourtColourValue").addEventListener("change",event=>{
      const courts=selectedCourts();
      const entry=bulkCourtColourTargets.find(item=>item.key===$("bulkCourtColourTarget")?.value);
      const color=normalizeHexColor(event.target.value);
      if(courts.length<2 || !entry || !color)return;
      if(courts.some(c=>c.locked||c.hidden||!entry.supports(c)))return;
      const brand=brandForCourt(courts[0]);
      if(courts.some(c=>brandForCourt(c)!==brand))return;
      const palette=entry.key==="line" ? getLinePaletteForBrand(brand) : getDefaultPaletteForBrand(brand);
      if(!palette.some(item=>normalizeHexColor(item.color)===color))return;
      let changed=false;
      courts.forEach(c=>{
        if(normalizeHexColor(c[entry.property])!==color){
          c[entry.property]=color;
          changed=true;
        }
        if(entry.key==="netballGoal")c.netballAccentFill=color;
      });
      if(!changed)return;
      render();
      commitHistory();
    });
  }

  function refreshBulkCourtColourToolbar(){
    ensureBulkCourtColourToolbar();
    const courts=selectedCourts();
    const bar=$("bulkCourtColourToolbar");
    if(!bar)return;
    bar.hidden=courts.length<2;
    if(courts.length<2)return;
    const targetSelect=$("bulkCourtColourTarget");
    const colorSelect=$("bulkCourtColourValue");
    const preview=$("bulkCourtColourPreview");
    const hint=$("bulkCourtColourHint");
    const brand=brandForCourt(courts[0]);
    const sameBrand=courts.every(c=>brandForCourt(c)===brand);
    const unlocked=courts.every(c=>!c.locked && !c.hidden);
    const choices=bulkCourtColourTargets.filter(item=>courts.every(c=>item.supports(c)));
    const previousTarget=targetSelect.value;
    targetSelect.replaceChildren();
    choices.forEach(item=>{
      const option=document.createElement("option");
      option.value=item.key;
      option.textContent=item.label;
      targetSelect.appendChild(option);
    });
    targetSelect.value=choices.some(item=>item.key===previousTarget)?previousTarget:(choices[0]?.key||"");
    const target=choices.find(item=>item.key===targetSelect.value);
    targetSelect.disabled=!sameBrand||!unlocked;
    colorSelect.replaceChildren();
    const placeholder=document.createElement("option");
    placeholder.value="";

  function itemFor(token){
    if(token==="site:main")return {hidden:false};
    if(token.startsWith("site:")){
      if(state.siteShapeMode!=="custom")return null;
      return (state.siteAreas||[]).find(x=>String(x.id)===token.slice(5))||null;
    }
    const [type,id]=token.split(":");

    return key?(state[key]||[]).find(x=>String(x.id)===id)||null:null;

      "[data-layer-token],[data-id],[data-shape-id],[data-image-id]," +
      "[data-line-id],[data-text-id],[data-measure-id],[data-lamp-id]," +
      "[data-door-id],[data-partition-id],[data-net-id]"
    );
    if(!node)return null;
    const token=node.getAttribute("data-layer-token");
    if(token&&valid(token))return token;
    for(const [type,attr] of Object.entries(nodeAttrs)){
      const id=node.getAttribute(attr);

  // BinaCourt Group Drag + Colour V2
  // One shared editor for any compatible colour property across multiple
  // selected objects. A colour change creates exactly one undo step.
  function colourSpecs(token){
    const obj=itemFor(token);
    if(!obj)return [];
    const type=token.split(":")[0];
    const specs=[];
    const add=(key,label,prop,brand=null,kind="surface")=>{
      specs.push({token,obj,key,label,prop,brand,kind});
    };
    if(type==="court"){
      const brand=brandForCourt(obj);
      add("surface","Court / Surface","fill",brand);
      add("line","Line","line",brand,"line");
      bulkCourtColourTargets.filter(t=>t.key!=="fill"&&t.key!=="line"&&t.supports(obj))
        .forEach(t=>add(t.key,t.label,t.property,brand));
    }else if(type==="shape"){
      if(obj.decorative)add("visual","Warna Bebas","color");
      else{
        const brand=normalizeBrand(obj.brand,state.brand);
        if(obj.role==="line")add("line","Line","color",brand,"line");
        else add("surface","Court / Surface","color",brand);
      }
    }else if(type==="site"){
      add("surface","Court / Surface","color",brandForSiteArea(obj));
    }else if(type==="line"){
      add("line","Line","color");
    }else if(type==="text"){
      add("text","Text Colour","fill");
    }else if(type!=="image"&&type!=="measure"){
      // Optional design objects may expose an editable solid colour.
      // Never invent one for images, dimensions or structural settings.
      if(normalizeHexColor(obj.color))add("visual","Warna Objek","color");
      else if(normalizeHexColor(obj.fill))add("visual","Warna Objek","fill");
    }
    return specs;
  }
  function compatibleColourOptions(){
    const tokens=[...chosen].filter(valid);
    if(tokens.length<2)return [];
    const first=colourSpecs(tokens[0]);
    return first.map(spec=>{
      const set=[spec];
      for(const token of tokens.slice(1)){
        const other=colourSpecs(token).find(x=>x.key===spec.key);
        if(!other)return null;
        set.push(other);
      }
      const library=set.filter(x=>x.brand!==null).map(x=>
        x.kind==="line"?getLinePaletteForBrand(x.brand):getDefaultPaletteForBrand(x.brand));
      let palette=null;
      if(library.length){
        palette=library[0].filter(col=>library.every(list=>
          list.some(item=>normalizeHexColor(item.color)===normalizeHexColor(col.color))));
      }
      return {key:spec.key,label:spec.label,specs:set,palette};
    }).filter(Boolean);

    function applyColour(value){
      const colour=normalizeHexColor(value);
      const choice=compatibleColourOptions().find(x=>x.key===kind.value);
      if(!colour||!choice||choice.specs.some(sp=>sp.obj.locked||sp.obj.hidden))return;
      if(choice.palette&&!choice.palette.some(v=>normalizeHexColor(v.color)===colour))return;
